to break one’s arm."},{"it":"canone, il","en":"fee; subscription payment. Il canone della televisione = the television licence fee."},{"it":"capire il senso di qualcosa","en":"to understand the meaning or point of something."},{"it":"capo mafioso, il","en":"mafia boss."},{"it":"carabiniere, il","en":"member of the Italian Carabinieri, a national police force."},{"it":"classe, la","en":"class; classroom group."},{"it":"coltellino, il","en":"small knife; pocketknife. The suffix -ino often makes a noun smaller."},{"it":"condannare qualcuno","en":"to convict or sentence someone. Far condannare il mafioso = to get the mafia boss convicted."},{"it":"contro","en":"against. Andare contro la legge = to go against the law."},{"it":"curarsi di","en":"to take care of; to make sure of. Curarsi che le lezioni si svolgano correttamente = to make sure the lessons take place properly."},{"it":"dare per scontato","en":"to take for granted. This expression is useful for understanding how people can begin to accept injustice as normal."},{"it":"dare quattro a qualcuno","en":"to give someone a telling-off; to reprimand someone. La maestra ne dice quattro a Tonio = the teacher gives Tonio a telling-off."},{"it":"delitto, il","en":"crime; serious offence. Delitti terribili = terrible crimes."},{"it":"dipendere da","en":"to depend on. La maestra dipende dal preside = the teacher is answerable to the headteacher."},{"it":"distinto","en":"distinguished; respectable-looking. Un signore distinto = a distinguished-looking gentleman."},{"it":"dalla parte di","en":"on the side of. Stare dalla parte della mafia = to be on the mafia’s side."},{"it":"essere in mezzo a noi","en":"to be among us. The father explains that mafiosi can be ordinary-looking people living in society."},{"it":"esatto","en":"exactly; that’s right."},{"it":"essere nato come","en":"to have originated as. La richiesta era nata come una prepotenza = the demand had started as an act of bullying."},{"it":"essere sconfitto","en":"to be defeated. La giustizia è stata sconfitta = justice has been defeated."},{"it":"fare finta di","en":"to pretend to; to act as if. Fare finta di non vedere = to pretend not to see."},{"it":"fare rispettare la legge","en":"to enforce the law; to make people obey the law."},{"it":"farsi difendere","en":"to get someone to defend you. Vai dalla maestra per farti difendere = you go to the teacher to get her to defend you."},{"it":"foglio, il","en":"sheet of paper; document. Quei fogli accusano don Mariano = those papers implicate Don Mariano."},{"it":"forza, la","en":"strength; force. La legge del più forte = the law of the strongest."},{"it":"fuori","en":"outside; out. The meaning depends on the context."},{"it":"giudice, il","en":"judge."},{"it":"giustamente","en":"justly; rightly; fairly."},{"it":"giustizia, la","en":"justice. La giustizia è stata sconfitta = justice has been defeated."},{"it":"giusto / ingiusto","en":"just, fair / unjust, unfair."},{"it":"governare","en":"to govern; to rule. In this chapter, the school is used as an example of a community with rules and someone responsible for them."},{"it":"illegale","en":"illegal; unlawful. La legge di Tonio, illegale = Tonio’s illegal rules."},{"it":"imbianchino, l’","en":"painter and decorator; house painter."},{"it":"importante","en":"important; significant. Si crede tanto importante = he thinks he is so important."},{"it":"in cambio di","en":"in exchange for. In cambio della pizzetta = in exchange for the small pizza snack."},{"it":"incolpare qualcuno","en":"to blame or accuse someone."},{"it":"ingiustizia, l’","en":"injustice; unfairness. Accettare l’ingiustizia = to accept injustice."},{"it":"intascare","en":"to pocket; to take and keep money. Intascare le mance dei compagni = to pocket the classmates’ pocket money."},{"it":"insieme, l’","en":"group; collection. L’insieme di quei prepotenti = that group of bullies."},{"it":"intervallo, l’","en":"break between lessons; school break."},{"it":"legge, la","en":"law; rule. The chapter contrasts the official law with the mafia’s unofficial, violent “law.”"},{"it":"legge del più forte, la","en":"the law of the strongest; the idea that the stronger person gets their way."},{"it":"lezione, la","en":"lesson. Le lezioni si svolgono in modo corretto = lessons take place properly."},{"it":"luogo, il","en":"place. This word is useful in the phrase in mezzo a noi, meaning “among us,” although luogo itself is not the expression used here."},{"it":"mafia, la","en":"mafia."},{"it":"mancia, la","en":"pocket money; tip. Here it means the money a child receives to spend."},{"it":"mantenere l’ordine","en":"to maintain order."},{"it":"mettersi in tasca","en":"to put into one’s pocket; figuratively, to pocket or take money for oneself. Tonio può continuare a mettersi in tasca soldi non suoi = Tonio can keep pocketing money that does not belong to him."},{"it":"mostro, il","en":"monster. The “monster without a face” represents the mafia, which cannot always be recognised by appearance."},{"it":"mostro travestito, il","en":"monster in disguise. Here, it describes a dangerous person who looks ordinary."},{"it":"miseria, la","en":"misery; extreme poverty. One of the historical meanings of mafia discussed in the chapter."},{"it":"negoziante, il","en":"shopkeeper; store owner."},{"it":"negozio, il","en":"shop; store."},{"it":"normale","en":"normal; ordinary. Gli sembra una cosa normale = it seems normal to him."},{"it":"non bastare","en":"not to be enough. Le prove non bastano = the evidence is not enough."},{"it":"obbedire a","en":"to obey. Obbedirai alla legge di Tonio = you will obey Tonio’s law."},{"it":"occhio, l’","en":"eye. Although the expression chiudere un occhio appeared in the previous chapter, it is not the focus of this one."},{"it":"ordine, l’","en":"order. Mantenere l’ordine = to maintain order."},{"it":"pagare per paura","en":"to pay out of fear."},{"it":"pagamento, il","en":"payment."},{"it":"partita, la","en":"match; game. La grande partita is used metaphorically for the major struggle Giovanni will face in Palermo."},{"it":"passare a","en":"to move on to; to turn to. The exact meaning depends on what follows."},{"it":"paura, la","en":"fear. Stare zitto per paura = to keep quiet out of fear."},{"it":"perdere una battaglia","en":"to lose a battle."},{"it":"polizia, la","en":"police."},{"it":"prepotente, il / la","en":"bully; someone who abuses their power."},{"it":"prepotenza, la","en":"bullying; abuse of power."},{"it":"preside, il","en":"headteacher; school principal."},{"it":"processare qualcuno","en":"to put someone on trial. Bisogna processare don Mariano = Don Mariano must be put on trial."},{"it":"processo, il","en":"trial; court case."},{"it":"proprietario, il","en":"owner. Il proprietario del negozio = the shop owner."},{"it":"proteggere","en":"to protect. In cambio noi ti proteggiamo = in exchange, we protect you."},{"it":"prova, la","en":"proof; piece of evidence. Le prove non bastano = the evidence is insufficient."},{"it":"punire","en":"to punish. Tonio dovrebbe essere punito = Tonio should be punished."},{"it":"ragione, la","en":"reason; right. La ragione sta dalla parte del più forte = the stronger person is considered to be in the right."},{"it":"regolare","en":"to regulate; to govern. La legge regola la vita delle città = the law regulates city life."},{"it":"rispettato","en":"respected. Un uomo rispettato = a respected man."},{"it":"rivolgersi a qualcuno","en":"to turn to someone for help; to approach someone. Rivolgersi alla polizia = to turn to the police."},{"it":"rotolare","en":"to roll; to tumble. Simone rotola dalle scale = Simone tumbles down the stairs."},{"it":"riassumere","en":"to summarise. Riassumendo = to sum up; in summary."},{"it":"salumiere, il","en":"delicatessen worker; person who sells cured meats and other deli products."},{"it":"saltare in aria","en":"to blow up; to be blown up. Il negozio salta in aria = the shop blows up."},{"it":"sconfiggere","en":"to defeat. Il mostro che avrebbe dovuto combattere = the monster he would have to fight."},{"it":"senso, il","en":"meaning; point. Il senso di quella giornata = the meaning of that day."},{"it":"sospendere qualcuno","en":"to suspend someone, usually from school or work. Il preside lo sospende per una settimana = the headteacher suspends him for a week."},{"it":"stare zitto","en":"to keep quiet; to say nothing."},{"it":"svolgersi","en":"to take place; to be held. Le lezioni si svolgono in modo corretto = lessons take place properly."},{"it":"tasca, la","en":"pocket. Avere le tasche piene di soldi = to have pockets full of money."},{"it":"tanto","en":"so much; very. Si crede tanto importante = he thinks he is so important."},{"it":"tornare a casa","en":"to go back home; to return home."},{"it":"tra l’altro","en":"besides; moreover; as it happens."},{"it":"travestito","en":"disguised; dressed up as someone or something else. Mostri travestiti = monsters in disguise."},{"it":"uccidere","en":"to kill. Persone uccise = people who were killed."},{"it":"ubbidire a","en":"to obey. This is an alternative spelling of obbedire, used in the text."},{"it":"un secolo","en":"a century; one hundred years."},{"it":"valere","en":"to be valid; to count; to apply. L’unica che dovrebbe valere = the only one that should apply."},{"it":"vincere","en":"to win. Vincere la battaglia successiva = to win the next battle."},{"it":"violenza, la","en":"violence. The chapter describes threats and violence used to make shopkeepers pay the mafia."},{"it":"- zitto","en":"quiet; silent. Stare zitto = to keep quiet."}],"phrases":[{"it":"la legge del più forte","en":"the law of the strongest"},{"it":"fare rispettare la legge","en":"to enforce the law"},{"it":"fare finta di non vedere","en":"to pretend not to see"},{"it":"a forza di accettare l’ingiustizia","en":"by repeatedly accepting injustice"},{"it":"stare dalla parte di qualcuno","en":"to be on someone’s side"},{"it":"in cambio di","en":"in exchange for"},{"it":"mettersi in tasca soldi non suoi","en":"to pocket money that does not belong to you"},{"it":"stare zitto per paura","en":"to keep quiet out of fear"},{"it":"le prove non bastano","en":"the evidence is not enough"},{"it":"essere assolto","en":"to be acquitted"},{"it":"la giustizia è stata sconfitta","en":"justice has been defeated"},{"it":"una battaglia persa","en":"a lost battle"},{"it":"il mostro senza volto","en":"the faceless monster"},{"it":"saltare in aria","en":"to blow up"},{"it":"avere le tasche piene di soldi","en":"to have pockets full of money"}]},{"number":5,"title":"Chapter 5 — Italian vocabulary list","words":[{"it":"accettare","en":"to accept. Accettare di entrare nella cosa = to agree to join the mafia."},{"it":"acido, l’","en":"acid. A chemical liquid that can dissolve other substances."},{"it":"affiancato da","en":"assisted by; alongside. Un capo affiancato da un vicecapo = a boss assisted by a deputy."},{"it":"al di sopra di","en":"above; higher than. La cupola sta al di sopra di tutte le famiglie = the mafia leadership sits above all the families."},{"it":"al largo","en":"out at sea; far from the shore. Portarlo al largo con una barca = to take him far out to sea by boat."},{"it":"animale, l’","en":"animal. Animali tra gli animali = animals among animals."},{"it":"aspirante, l’","en":"candidate; aspiring member. L’aspirante mafioso = the person seeking to join the mafia."},{"it":"aspirina, l’","en":"aspirin, a medicine used to relieve pain."},{"it":"bidone, il","en":"large container; drum. Un bidone pieno di acido = a drum full of acid."},{"it":"biddicchiu","en":"Sicilian expression meaning “little beauty” or “cutie”; included here as a reminder that regional Italian expressions can differ from standard Italian."},{"it":"bruciare","en":"to burn. Le mie carni debbono bruciare = my flesh must burn."},{"it":"buttare","en":"to throw; to put carelessly. Buttare qualcosa nell’acqua = to throw something into the water."},{"it":"capodecina, il","en":"a mafia member who commands a group of soldiers or picciotti."},{"it":"capo, il","en":"boss; leader. Il capo della mafia = the mafia boss."},{"it":"capire","en":"to understand. Cominci a capire? = Are you beginning to understand?"},{"it":"carciofo, il","en":"artichoke. Its layers of leaves are used as a comparison for the mafia’s many families."},{"it":"carne, la","en":"flesh; meat. Le mie carni = my flesh."},{"it":"cenere, la","en":"ash. Diventare cenere = to turn to ash."},{"it":"cerimonia, la","en":"ceremony. Una cerimonia per il giuramento = a ceremony for the oath."},{"it":"chiedere a qualcuno di fare qualcosa","en":"to ask someone to do something. Chiedono ai testimoni di pungere il dito = they ask the witnesses to prick the finger."},{"it":"colpa, la","en":"fault; blame. La sua unica colpa = his only fault."},{"it":"comandare","en":"to command; to lead. I capodecina comandano i soldati = the capodecina command the soldiers."},{"it":"combinato","en":"in mafia terminology, initiated or formally accepted into the organisation. Il ragazzo è stato combinato = the young man has been initiated."},{"it":"consigliere, il","en":"adviser; counsellor. In the mafia hierarchy, a person who advises the boss."},{"it":"cosca, la","en":"mafia clan or group. In the chapter, the layers of an artichoke represent the different clans."},{"it":"Cosa Nostra","en":"literally “Our Thing”; a name used for the Sicilian mafia."},{"it":"cupola, la","en":"dome. In this chapter, it means the mafia’s top leadership, which makes decisions for the different clans."},{"it":"debole, il / la","en":"weak person. Difendere i deboli = to defend the weak."},{"it":"denunciare","en":"to report; to denounce; to speak out against. Denunciare le ingiustizie sociali = to denounce social injustices."},{"it":"derivare da","en":"to derive from; to originate from. Il rituale deriva da un’antica setta = the ritual originates from an ancient sect."},{"it":"difendere","en":"to defend; to protect. Difendere gli orfani e le vedove = to protect orphans and widows."},{"it":"dissolversi","en":"to dissolve. Si è dissolto come questa aspirina = it dissolved like this aspirin."},{"it":"dischetto, il","en":"small disc or tablet. Here, it refers to the aspirin tablet."},{"it":"dritto","en":"upright; straight. Stare dritto = to stand upright."},{"it":"eletto","en":"elected; chosen by voting. Un capo eletto dagli uomini d’onore = a boss elected by the men of honour."},{"it":"eseguire un ordine","en":"to carry out an order. Il soldato che esegue gli ordini = the soldier who carries out orders."},{"it":"essere in guerra con","en":"to be at war with; to be in conflict with. La sua famiglia era in guerra con un’altra famiglia = his family was at war with another family."},{"it":"essere rimasto","en":"to have remained; to be left. Non è rimasto più nulla = nothing was left."},{"it":"essere stato combinato","en":"to have been initiated into the mafia."},{"it":"famiglia, la","en":"family. In the chapter, it often means a mafia clan rather than a biological family."},{"it":"fedeltà, la","en":"loyalty; faithfulness. Promettere fedeltà = to promise loyalty."},{"it":"figurina, la","en":"small picture or card. Here, it refers to a small religious image burned during the initiation ritual."},{"it":"fine, la","en":"end; fate. Non si sa che fine abbia fatto = nobody knows what happened to him."},{"it":"fondo, il","en":"bottom; floor. Il fondo del bicchiere = the bottom of the glass."},{"it":"forse","en":"perhaps; maybe."},{"it":"frizzare","en":"to fizz; to bubble. L’aspirina cominciò a frizzare = the aspirin began to fizz."},{"it":"gettare","en":"to throw; to cast. Gettare un corpo in acqua = to throw a body into the water."},{"it":"giocare","en":"to play. Giocare con lui ai videogiochi = to play video games with him."},{"it":"giudice, il","en":"judge."},{"it":"giuramento, il","en":"oath; solemn promise. Fare un giuramento = to swear an oath."},{"it":"giurare","en":"to swear; to make a solemn promise."},{"it":"giusto / giusta","en":"just; fair. La legge giusta = the just law."},{"it":"immaginare","en":"to imagine. Immagina un uomo vero = imagine a real man."},{"it":"immaginetta, l’","en":"small picture, usually a religious image. Un’immaginetta sacra = a small holy image."},{"it":"imporre","en":"to impose; to force something on others. Imporre la propria legge = to impose one’s own law."},{"it":"ingiustizia, l’","en":"injustice. Combattere le ingiustizie = to fight injustice."},{"it":"iniziazione, l’","en":"initiation; the process of formally entering a group."},{"it":"interesse, l’","en":"interest; concern. Hanno ben altri interessi = they have quite different interests."},{"it":"invisibile","en":"invisible; impossible to see. Un mondo a parte, invisibile ma presente dappertutto = a separate world, invisible but present everywhere."},{"it":"lasciare","en":"to leave; to let. Lasciare il cadavere in acqua = to leave the body in the water."},{"it":"legge, la","en":"law. La legge giusta = the just law."},{"it":"legge ingiusta, la","en":"unjust law. In the story, the mafia imposes its own rules instead of the legitimate law."},{"it":"lotta, la","en":"fight; struggle. Due famiglie sono in lotta = two families are fighting."},{"it":"lupara bianca, la","en":"a mafia expression for a disappearance in which the victim’s body is never found, often because it has been destroyed or concealed."},{"it":"mafioso, il","en":"mafia member; mafioso."},{"it":"mantenere fede a","en":"to remain faithful to; to keep. Mantenere fede al giuramento = to keep one’s oath."},{"it":"Medioevo, il","en":"the Middle Ages."},{"it":"membro, il","en":"member. I membri della famiglia = the members of the clan."},{"it":"mistero, il","en":"mystery. La fine di Giuseppe è rimasta un mistero = Giuseppe’s fate remained a mystery."},{"it":"mostro, il","en":"monster. The father uses this word to describe the mafia metaphorically."},{"it":"mostro dalle mille facce, il","en":"a monster with a thousand faces; a metaphor for the mafia’s many forms and activities."},{"it":"mutilazione, la","en":"mutilation. This word appeared in the previous chapter, not the main story of this one."},{"it":"nascere","en":"to be born. Quando nacque = when he was born."},{"it":"nessuno","en":"nobody; no one. Non è rimasto più nulla is the related expression “nothing is left.”"},{"it":"nuovo","en":"new. Il nuovo mafioso = the new mafia member."},{"it":"occhio, l’","en":"eye. Non riuscivo a staccare gli occhi dal bicchiere = I couldn’t take my eyes off the glass."},{"it":"odio, l’","en":"hatred. Uccidono per odio = they kill out of hatred."},{"it":"ometto / omino, l’","en":"little man; small figurine. L’omino del Subbuteo = the little football player figurine used in the table football game Subbuteo."},{"it":"orfano, l’","en":"orphan. Gli orfani e le vedove = orphans and widows."},{"it":"ordine, l’","en":"order; command. Eseguire gli ordini = to carry out orders."},{"it":"palleggiarsi qualcosa tra le mani","en":"to toss something from one hand to the other. In the story, the father tries to imitate the ritual with a burning paper napkin."},{"it":"parente, il / la","en":"relative; family member. Uccidere parenti = to kill relatives."},{"it":"pescare","en":"to fish; to catch fish."},{"it":"picciotto, il","en":"a low-ranking mafia member or soldier."},{"it":"pungere","en":"to prick; to pierce. Pungere il dito con una spina = to prick the finger with a thorn."},{"it":"potere, il","en":"power. Fame di potere = hunger for power."},{"it":"promettere","en":"to promise. Promettere fedeltà = to promise loyalty."},{"it":"pronunciare","en":"to pronounce; to say formally. Pronunciare queste parole = to say these words."},{"it":"proprio","en":"precisely; exactly; one’s own, depending on context. Derivi proprio da un’antica setta = derives precisely from an ancient sect."},{"it":"raccontare","en":"to tell; to recount. Raccontò la verità = he told the truth."},{"it":"regola, la","en":"rule. Rispettare le regole della cosca = to obey the clan’s rules."},{"it":"religioso / religiosa","en":"religious. Una setta religiosa = a religious sect."},{"it":"resuscitare","en":"to bring back to life; to resurrect. Un’aspirina non ha mai resuscitato un infame = an aspirin has never brought a scoundrel back to life."},{"it":"rituale, il","en":"ritual; a set of formal actions performed for a particular purpose."},{"it":"riunire","en":"to bring together; to gather. Related to the idea of the mafia’s leaders forming the cupola."},{"it":"sacro / sacra","en":"holy; sacred. Un’immaginetta sacra = a small holy image."},{"it":"sangue, il","en":"blood. Una goccia di sangue = a drop of blood."},{"it":"santina, la","en":"little holy picture; small image of a saint. The text uses santino for the image burned during the oath."},{"it":"santuario, il","en":"sanctuary. This word is not central to the chapter; the relevant word in the passage is santino."},{"it":"setta, la","en":"sect; secret or closed religious group. Una setta segreta = a secret sect."},{"it":"sciogliere","en":"to dissolve; to melt. L’acido scioglie qualsiasi cosa = acid dissolves anything."},{"it":"soldato, il","en":"soldier. I soldati o picciotti = the soldiers, or picciotti, of the mafia."},{"it":"spiegare","en":"to explain. Il vecchio mafioso spiega al nuovo = the old mafia member explains to the new one."},{"it":"spina, la","en":"thorn. Una spina di arancia amara = a thorn from a bitter orange tree."},{"it":"staccare","en":"to detach; to take away; to pull off. Staccare una foglia dal carciofo = to pull a leaf off the artichoke."},{"it":"strangolare","en":"to strangle. Lo ha strangolato = he strangled him."},{"it":"svelare","en":"to reveal; to disclose. Svelare il nome della cosa = to reveal the name of “the thing.”"},{"it":"tentacolo, il","en":"tentacle. Più tentacoli di questo polipo = more tentacles than this octopus."},{"it":"testimone, il / la","en":"witness. Due testimoni = two witnesses."},{"it":"tradire","en":"to betray. Se il mafioso tradirà = if the mafia member betrays the organisation."},{"it":"trattare","en":"to treat; to deal with. This is a useful general verb, but the specific expressions in the chapter are more important."},{"it":"tutto ciò che","en":"everything that; all that. Tutto ciò che era rimasto = everything that was left."},{"it":"uccidere","en":"to kill. Uccidono per odio e fame di potere = they kill out of hatred and hunger for power."},{"it":"uomo d’onore, l’","en":"literally “man of honour,” the term mafia members use for themselves."},{"it":"un mondo a parte","en":"a world apart; a separate world."},{"it":"ustionarsi","en":"to burn oneself; to suffer a burn. Si ustiona le mani = he burns his hands."},{"it":"vedova, la","en":"widow. Gli orfani e le vedove = orphans and widows."},{"it":"vicecapo, il","en":"deputy boss; second-in-command."},{"it":"vocabulario / vocabolario, il","en":"vocabulary; dictionary. La mafia ha un vocabolario tutto suo = the mafia has a vocabulary of its own."},{"it":"volere","en":"to want. Voleva che a Palermo valesse una legge sola = he wanted only one law to apply in Palermo."},{"it":"valere","en":"to be valid; to apply; to count. Valesse una legge sola = only one law would apply."},{"it":"- zaino, lo","en":"backpack. Tirò fuori dallo zaino una fotografia = he took a photograph out of his backpack."}],"phrases":[{"it":"fare un giuramento","en":"to swear an oath"},{"it":"promettere fedeltà","en":"to promise loyalty"},{"it":"rispettare le regole","en":"to obey the rules"},{"it":"fare da testimone","en":"to act as a witness"},{"it":"pungere il dito","en":"to prick the finger"},{"it":"versare una goccia di sangue","en":"to pour a drop of blood"},{"it":"mantenere fede al giuramento","en":"to keep one’s oath"},{"it":"diventare cenere","en":"to turn to ash"},{"it":"essere combinato","en":"to be initiated into the mafia"},{"it":"essere posato","en":"in mafia terminology, to be expelled or cast out of the organisation"},{"it":"un mondo a parte","en":"a world apart"},{"it":"in guerra con un’altra famiglia","en":"at war with another family"},{"it":"non sapere che fine abbia fatto qualcuno","en":"not to know what happened to someone"},{"it":"non è rimasto più nulla","en":"nothing was left"},{"it":"fame di potere","en":"hunger for power"},{"it":"a differenza di","en":"unlike; in contrast to"},{"it":"staccare gli occhi da qualcosa","en":"to take one’s eyes off something"},{"it":"parlare a voce alta","en":"to speak loudly"},{"it":"tornare a riva","en":"to return to shore"},{"it":"mi era passata la voglia di scherzare","en":"I no longer felt like joking"}]},{"number":6,"title":"Chapter 6 — Una vita da topo","words":[{"it":"This chapter is about Giovanni Falcone’s fight against the mafia, the danger he faces as a magistrate, and how that danger changes his everyday life. It also introduces the idea of omertà","en":"the silence that protects criminals."},{"it":"a parte","en":"apart from; except for. A parte le persone uccise = apart from the people who were killed."},{"it":"a sorpresa","en":"unexpectedly; by surprise. Va alla piscina comunale a sorpresa = he goes to the public swimming pool unexpectedly."},{"it":"al cuor non si comanda","en":"you can’t command the heart; you can’t choose whom you fall in love with."},{"it":"al giorno d’oggi","en":"nowadays. A useful general expression, though the chapter mainly uses un giorno in the sense of “one day.”"},{"it":"alzare la voce","en":"to raise one’s voice."},{"it":"amico, l’","en":"friend. Gli amici del mostro = the monster’s friends, meaning people who help the mafia."},{"it":"antiproiettile","en":"bulletproof. Vetri antiproiettile = bulletproof glass; giubbotti antiproiettile = bulletproof vests."},{"it":"attentato, l’","en":"assassination attempt; attack. Fare un attentato = to carry out an attack."},{"it":"avvertimento, l’","en":"warning. Ricevere un avvertimento = to receive a warning."},{"it":"banca, la","en":"bank. Lui ha delle banche intere tutte sue = he has entire banks of his own."},{"it":"benefattore, il","en":"benefactor; someone who helps others. The mafia may appear to be helping people by providing jobs."},{"it":"bunker, il","en":"bunker; a strongly protected shelter. Giovanni spends much of his time in a secure place at home."},{"it":"burbero","en":"gruff; stern; not very friendly. Un omone burbero = a big, gruff man."},{"it":"buttare fuori","en":"to throw out; to expel. In mafia contexts, fare fuori qualcuno means to kill someone."},{"it":"cantiere, il","en":"construction site. Aprire tanti cantieri = to open many construction sites."},{"it":"carriera, la","en":"career. Fare carriera = to advance in one’s career."},{"it":"cassetta, la","en":"cassette; videotape. Una cassetta al videoregistratore = a videotape played on a video recorder."},{"it":"collega, il / la","en":"colleague. Un suo stesso collega = one of his own colleagues."},{"it":"colpevole, il / la","en":"guilty person; culprit. Punire i colpevoli = to punish those responsible."},{"it":"cominciare a","en":"to begin to. Comincia a puntare il mirino contro Giovanni = begins to aim at Giovanni."},{"it":"consentire a qualcuno di fare qualcosa","en":"to allow someone to do something. Consentire ai muratori di ricevere lo stipendio = to allow the builders to receive their wages."},{"it":"corrotto","en":"corrupt; bribed. Corrotti dal mostro = corrupted by the monster."},{"it":"costruire","en":"to build. Costruire case = to build houses."},{"it":"coraggio, il","en":"courage. Un vecchietto coraggioso = a brave old man."},{"it":"correre un pericolo","en":"to be in danger; to face a risk. Le persone che gli sono vicine corrono i suoi stessi pericoli = the people close to him face the same dangers as he does."},{"it":"dare fastidio","en":"to bother; to inconvenience. Non voleva dare fastidio agli spettatori = he didn’t want to bother the audience."},{"it":"decidere","en":"to decide. Le persone che devono decidere in Comune = the people who have to make the decision at the town hall."},{"it":"delinquente, il","en":"criminal; offender. Incastrare i delinquenti = to build a case against criminals."},{"it":"difendere","en":"to defend; to protect. Difendere le proprie figurine = to protect your own collectible cards."},{"it":"diritto, il","en":"law; right. In ufficio istruzione, the legal meaning is connected with judicial investigations."},{"it":"dispiacere, il","en":"sadness; regret. A useful related noun, although the chapter more directly uses triste and preoccupazione."},{"it":"domani","en":"tomorrow; in this context, also “in the future.” Così domani Palermo sarà più bella = this way, Palermo will be more beautiful in the future."},{"it":"eliminare","en":"to eliminate; to kill. Eliminare un vecchio sceriffo = to eliminate an old sheriff."},{"it":"elicottero, l’","en":"helicopter. Un elicottero si abbassa sui tetti = a helicopter descends towards the rooftops."},{"it":"esplosione, l’","en":"explosion. Un’esplosione gigantesca = a gigantic explosion."},{"it":"esplosivo, l’","en":"explosive; explosives. Una macchina piena di esplosivo = a car full of explosives."},{"it":"essere deciso a","en":"to be determined to. Giovanni è deciso a scoperchiare il pentolone = Giovanni is determined to expose what is hidden."},{"it":"essere fatto della stessa pasta","en":"to be made of the same stuff; to have the same character or qualities."},{"it":"fare carriera","en":"to advance in one’s career."},{"it":"fare finta di","en":"to pretend to. Fare finta di non vedere = to pretend not to see."},{"it":"fare fuori qualcuno","en":"to kill someone; to eliminate someone. This is an informal but important expression in the chapter."},{"it":"fare giustizia","en":"to do justice; to see that justice is done."},{"it":"fare paura a qualcuno","en":"to frighten someone. Quel vecchietto faceva più paura di un esercito = that brave old man frightened them more than an army."},{"it":"foglia, la","en":"leaf. The chapter continues the artichoke metaphor: a “leaf” represents a level or group within the mafia."},{"it":"formalità, la","en":"formality; something done as a matter of procedure. È solo una formalità = it’s just a formality."},{"it":"forse","en":"perhaps; maybe."},{"it":"frequentare","en":"to attend; to go to regularly. The chapter refers to Rocco visiting schools to explain what the mafia is."},{"it":"giacca, la","en":"jacket. Un paio di scarpe o una giacca = a pair of shoes or a jacket."},{"it":"giudice istruttore, il","en":"investigating judge; a judge responsible for investigating a case and gathering evidence."},{"it":"giustizia, la","en":"justice. Aiutare la giustizia = to help justice; to help the legal system."},{"it":"giusto / ingiusto","en":"fair, just / unfair, unjust."},{"it":"giù di morale","en":"feeling down; low in spirits. Quando Giovanni è giù di morale = when Giovanni is feeling down."},{"it":"guardia del corpo, la","en":"bodyguard. Le guardie del corpo = the bodyguards."},{"it":"giubbotto, il","en":"jacket; vest. Giubbotto antiproiettile = bulletproof vest."},{"it":"incastrare","en":"to catch someone by establishing their guilt; to frame or trap someone, depending on context. Here, it means building a case against criminals."},{"it":"indagine, l’","en":"investigation. Una delle indagini più importanti = one of the most important investigations."},{"it":"indagare","en":"to investigate. I magistrati che indagano = the magistrates who investigate."},{"it":"inferno, l’","en":"hell. Un vero inferno = a real hell; a scene of terrible destruction."},{"it":"ingiustizia, l’","en":"injustice. Combattere le ingiustizie = to fight injustice."},{"it":"istruzione, l’","en":"instruction; education. In ufficio istruzione, it is a specific judicial-office term, not a school department."},{"it":"interrogare","en":"to question; to interrogate. Interrogare il capo di una cosca = to question the head of a mafia clan."},{"it":"lampeggiatore, il","en":"flashing warning light. Sirene e lampeggiatori accesi = sirens and flashing lights switched on."},{"it":"lasciare","en":"to let; to allow; to leave. Lasciar costruire le case a chi le fa meglio = to let the people who build the best houses build them."},{"it":"legge, la","en":"law. Una legge sola = one single law."},{"it":"libero di","en":"free to; able to. Liberi di tornare ai loro affari = free to return to their business."},{"it":"lavoro, il","en":"work; job. La gente ha bisogno di lavorare = people need to work."},{"it":"luogo, il","en":"place. In pieno centro di Palermo = right in the centre of Palermo."},{"it":"magistrato, il","en":"magistrate; judicial officer. In this chapter, Giovanni and Rocco are magistrates."},{"it":"mancare le prove","en":"for evidence to be missing or insufficient. Mancano le prove = there isn’t enough evidence."},{"it":"mirino, il","en":"sight; gunsight. Puntare il mirino contro qualcuno = to target someone."},{"it":"morire in prigione","en":"to die in prison."},{"it":"muratore, il","en":"builder; construction worker. I muratori lavorano nei cantieri = the builders work on construction sites."},{"it":"mestiere, il","en":"job; profession; trade. Il suo mestiere è fare giustizia = his job is to deliver justice."},{"it":"mostro, il","en":"monster. In the story, this is the narrator’s metaphor for the mafia."},{"it":"nascondere","en":"to hide. The chapter describes people hiding the truth by pretending not to have seen anything."},{"it":"neppure","en":"not even. Non può più venire neppure qui a Mondello = he can’t even come here to Mondello anymore."},{"it":"nessuno","en":"nobody; no one. Nessuno ha visto nulla = nobody saw anything."},{"it":"non avere il coraggio di","en":"not to have the courage to. Nessuno ha avuto il coraggio di fare quelle ricerche = nobody had the courage to carry out those investigations."},{"it":"nonostante","en":"despite; in spite of. A useful general connector, though the chapter’s key expressions are more specific."},{"it":"obiettivo, l’","en":"target; objective. Il prossimo obiettivo del mostro = the monster’s next target."},{"it":"omicidio, l’","en":"murder. Un omicidio, una rapina, un attentato = a murder, a robbery, an attack."},{"it":"omertà, l’","en":"the code of silence that protects criminals, especially within mafia culture. Il silenzio che protegge un crimine = the silence that protects a crime."},{"it":"onorato","en":"honoured; respected. Uomo d’onore = “man of honour,” the term used by mafia members for themselves."},{"it":"ospedale, l’","en":"hospital. Fu ricoverata in ospedale = she was admitted to hospital."},{"it":"paura, la","en":"fear. Liberare la gente dalla paura = to free people from fear."},{"it":"pentolone, il","en":"large cooking pot. Scoperchiare il pentolone = literally, to take the lid off the pot; figuratively, to expose secrets or wrongdoing."},{"it":"perquisire","en":"to search someone or a place, usually for security or evidence. Gli amici dovevano essere perquisiti = his friends had to be searched."},{"it":"pistolero, il","en":"gunman; gunslinger. I giovani pistoleri = the young gunmen."},{"it":"poliziotto, il","en":"police officer."},{"it":"preoccupazione, la","en":"worry; concern. Morirò per la preoccupazione = I’ll die from worry."},{"it":"prepotente, il / la","en":"bully; someone who abuses their power."},{"it":"progetto, il","en":"project; proposal; plan. Presentare un progetto al concorso = to submit a proposal to the competition."},{"it":"proteggere","en":"to protect. Il silenzio che protegge un crimine = the silence that protects a crime."},{"it":"punire","en":"to punish. Punire i colpevoli = to punish the guilty."},{"it":"rapina, la","en":"robbery. Un omicidio, una rapina, un attentato = a murder, a robbery, an attack."},{"it":"rischiare","en":"to risk; to take a risk. Certo che rischia = of course he is taking a risk."},{"it":"ricco / ricchissimo","en":"rich / extremely rich."},{"it":"riconoscente","en":"grateful; appreciative. La gente gli è riconoscente = people are grateful to him."},{"it":"rientrare","en":"to return; to go back in. A useful related verb, although the chapter more often uses tornare."},{"it":"rintanato","en":"hidden away; holed up. Viveva rintanato come un topo = he lived hidden away like a mouse."},{"it":"rompere le scatole a qualcuno","en":"to annoy someone; to be a nuisance to someone. Informal expression. Quel giovane magistrato tanto deciso a rompere le scatole = that young magistrate so determined to make trouble for them."},{"it":"rubare","en":"to steal. Rubare il lavoro agli altri = to steal work from others."},{"it":"scappare","en":"to escape; to run away. A useful general verb, though the chapter mainly describes Giovanni trying to survive rather than escape."},{"it":"scorta, la","en":"security escort; protection detail. Viaggiare con la scorta = to travel with a security escort."},{"it":"scoprire","en":"to discover; to uncover. Non scoprire nulla = not to discover anything."},{"it":"scoperchiare","en":"to take the lid off. Scoperchiare il pentolone = to expose hidden wrongdoing."},{"it":"sceriffo, lo","en":"sheriff. The father compares Rocco to an incorruptible sheriff from Western films."},{"it":"sacrificio, il","en":"sacrifice. Grandi responsabilità, grandi sacrifici = great responsibilities, great sacrifices."},{"it":"sirena, la","en":"siren. Le auto con le sirene accese = cars with their sirens on."},{"it":"sopportare","en":"to tolerate; to put up with. Francesca può capire e sopportare una vita così sacrificata = Francesca can understand and put up with such a restricted life."},{"it":"sorvegliare","en":"to watch; to monitor. The chapter describes a helicopter checking the rooftops for danger."},{"it":"stipendio, lo","en":"salary; wages. Ricevere lo stipendio = to receive one’s salary."},{"it":"svago, lo","en":"pastime; leisure activity. Le cene e qualche festa erano i soli svaghi = dinners and a few parties were his only leisure activities."},{"it":"tentacolo, il","en":"tentacle. The mafia is described as a monster whose tentacles reach into many parts of society."},{"it":"testimone, il / la","en":"witness. Non si trovano mai i testimoni = witnesses are never found."},{"it":"tranquillizzare","en":"to reassure; to calm someone down. Giovanni cerca di tranquillizzare la madre = Giovanni tries to reassure his mother."},{"it":"tritolo, il","en":"TNT; a powerful explosive. Cinquanta chili di tritolo = fifty kilos of TNT."},{"it":"tornare a casa","en":"to return home."},{"it":"trovarsi a fare qualcosa","en":"to find oneself doing something. Trovarsi a interrogare il capo di una cosca = to find oneself questioning the head of a mafia clan."},{"it":"ufficio istruzione, l’","en":"a judicial office responsible for investigations and gathering evidence in criminal cases, as described in the chapter."},{"it":"un conto è…, un conto è…","en":"it is one thing to…, but another thing to…. Un conto è raccontare storie di eroi a un bambino, un conto è sapere che quel figlio può essere ucciso = it is one thing to tell a child stories about heroes, but another to know that your son could be killed."},{"it":"un lampo, in","en":"in a flash; very quickly. In un lampo arriva a ventuno = he reaches twenty-one in a flash."},{"it":"vedere","en":"to see. Fare finta di non vedere = to pretend not to see."},{"it":"veleno, il","en":"poison. Un po’ di veleno: cianuro = a little poison: cyanide."},{"it":"videoregistratore, il","en":"video recorder; VCR. Guardare una cassetta al videoregistratore = to watch a videotape on a VCR."},{"it":"vita da topo, la","en":"a life like a mouse’s; a life spent hiding in fear. This is the chapter’s title and describes Giovanni’s restricted existence."},{"it":"vivere rintanato","en":"to live hidden away; to stay holed up."},{"it":"volere bene a qualcuno","en":"to love someone; to care about someone. Non si vogliono più bene = they no longer love each other."}],"phrases":[{"it":"io non c’ero, e se c’ero dormivo","en":"I wasn’t there, and if I was, I was asleep"},{"it":"fare la spia","en":"to tell on someone; to be a snitch"},{"it":"il silenzio che protegge un crimine","en":"the silence that protects a crime"},{"it":"aiutare la giustizia","en":"to help justice"},{"it":"non farsi corrompere","en":"not to allow oneself to be corrupted"},{"it":"tenersi buoni i potenti","en":"to keep powerful people on one’s good side"},{"it":"essere fatto della stessa pasta","en":"to be made of the same stuff; to have the same character"},{"it":"fare affari","en":"to do business"},{"it":"vivere come un pascià","en":"to live like a king; to live in luxury"},{"it":"essere riconoscente a qualcuno","en":"to be grateful to someone"},{"it":"fare finta di non vedere nulla","en":"to pretend not to see anything"},{"it":"scoperchiare il pentolone","en":"to expose hidden secrets or wrongdoing"},{"it":"puntare il mirino contro qualcuno","en":"to target someone"},{"it":"viaggiare con la scorta","en":"to travel with a security escort"},{"it":"giorno e notte","en":"day and night"},{"it":"da un giorno all’altro","en":"from one day to the next; at any moment"},{"it":"vivere rintanato come un topo","en":"to live hidden away like a mouse"},{"it":"non poter più permettersi qualcosa","en":"no longer to be able to afford or allow oneself something"},{"it":"giù di morale","en":"feeling down"},{"it":"al cuor non si comanda","en":"you can’t command the heart"},{"it":"chi ha grandi responsabilità, deve fare anche grandi sacrifici","en":"those who have great responsibilities must also make great sacrifices"},{"it":"non andare più da nessuna parte","en":"to stop going anywhere"},{"it":"dalla testa ai piedi","en":"from head to toe"},{"it":"in un lampo","en":"in a flash"}]},{"number":7,"title":"Chapter 7 — Sgambettarlo, come Maradona","words":[{"it":"a braccia aperte","en":"with open arms; warmly welcoming someone."},{"it":"a faccia aperta / a viso aperto","en":"openly; directly, without hiding your intentions. Giocarsi la partita a viso aperto = to fight the battle openly."},{"it":"a forza di","en":"through repeated effort; by dint of."},{"it":"a malapena","en":"barely; only just."},{"it":"a quanto pare","en":"apparently; it seems that."},{"it":"accertarsi di","en":"to make sure of; to verify."},{"it":"accusare","en":"to accuse. Le accuse al mostro = the accusations against the mafia."},{"it":"accusa, l’","en":"accusation; charge. Difendersi dall’accusa di mafia = to defend oneself against a mafia charge."},{"it":"affare, l’","en":"business; deal; affair. Tornare ai propri affari = to return to one’s own business."},{"it":"all’attacco","en":"on the attack; going on the offensive. Una squadra decisa ad andare all’attacco = a team determined to go on the offensive."},{"it":"arrestare","en":"to arrest. Arrestare decine di mafiosi = to arrest dozens of mafia members."},{"it":"arresto, l’","en":"arrest. Fare gli arresti = to make arrests."},{"it":"attaccante, l’","en":"striker; attacking player. Used metaphorically for members of the anti-mafia team who take the initiative."},{"it":"attentato, l’","en":"assassination attempt; attack. Evitare gli attentati = to avoid attacks."},{"it":"avversario, l’","en":"opponent; adversary. Il mostro ha paura del suo avversario = the monster is afraid of its opponent."},{"it":"avvizzire","en":"to wilt; to wither. Il carciofo comincia ad avvizzire = the artichoke begins to wilt; metaphorically, the mafia starts to weaken."},{"it":"braccio destro, il","en":"right-hand man; most trusted assistant. Beppe è il braccio destro di Ninni = Beppe is Ninni’s right-hand man."},{"it":"bravo","en":"good; skilled; capable. È bravo come Maradona = he is as good as Maradona."},{"it":"buttarsi per le strade","en":"to rush into the streets. I poliziotti si buttano per le strade di Palermo = the police rush into the streets of Palermo."},{"it":"capo, il","en":"boss; leader. Il capo più potente = the most powerful boss."},{"it":"capo della cosca, il","en":"head of a mafia clan."},{"it":"capo della cupola, il","en":"head of the mafia’s top leadership."},{"it":"carcerare","en":"to imprison; to put in prison."},{"it":"carcere, il","en":"prison. Le carceri del Nord Italia = the prisons of northern Italy."},{"it":"carciofo, il","en":"artichoke. The chapter continues using the artichoke as a metaphor for the mafia and its interconnected clans."},{"it":"caserma, la","en":"barracks; police or military station. La caserma della Guardia di Finanza = the barracks of the Italian financial police."},{"it":"collaborare con","en":"to work with; to cooperate with. Paolo collabora con Giovanni = Paolo works with Giovanni."},{"it":"collaborazione, la","en":"cooperation; collaboration. Ottenere la collaborazione delle cosche = to obtain cooperation from the mafia clans."},{"it":"collaboratore, il","en":"collaborator; colleague. I suoi collaboratori = his colleagues or people working with him."},{"it":"comandare","en":"to command; to lead. Comandava tutti = he commanded everyone."},{"it":"commettere un errore","en":"to make a mistake. Ho commesso degli errori = I have made mistakes."},{"it":"commissario, il","en":"police commissioner; senior police officer."},{"it":"concorso, il","en":"competition; contest. Presentare un progetto al concorso = to submit a project to a competition."},{"it":"confidenza, la","en":"confidence; confidential information. Strappare confidenze ai parenti = to obtain confidential information from relatives."},{"it":"cosca, la","en":"mafia clan or group. Le cosche di Palermo = the mafia clans of Palermo."},{"it":"coraggioso","en":"courageous; brave. Magistrati coraggiosi = brave magistrates."},{"it":"corruzione, la","en":"corruption. The chapter describes people who have been corrupted by the mafia."},{"it":"costruire","en":"to build. Costruire case e strade = to build houses and roads."},{"it":"covo, il","en":"hideout; secret place where someone stays hidden. I covi dove sono nascosti i mafiosi = the hideouts where the mafiosi are concealed."},{"it":"cugino, il","en":"cousin. Due cugini molto rispettati = two highly respected cousins."},{"it":"dare informazioni","en":"to give information. Dare informazioni ai poliziotti = to give information to the police."},{"it":"dare un aiuto","en":"to give help; to provide assistance. Dare un aiuto prezioso alla mafia = to provide valuable help to the mafia."},{"it":"decidere","en":"to decide. Decidere chi deve costruire le case = to decide who should build the houses."},{"it":"delinquente, il","en":"criminal; offender."},{"it":"delinquenza, la","en":"criminality; crime. Episodi di delinquenza = incidents of crime."},{"it":"depositare","en":"to file; to submit officially. Il pool deposita le prove = the anti-mafia team officially submits the evidence."},{"it":"difendersi da","en":"to defend oneself against. Difendersi dall’accusa di mafia = to defend oneself against a mafia accusation."},{"it":"diritto, il","en":"law; right. The chapter’s main legal vocabulary centres on magistrates, investigations and trials."},{"it":"disporre di","en":"to have available; to possess. Disporre di informazioni preziose = to have valuable information."},{"it":"diventare","en":"to become. Giovanni e Leoluca diventano amici = Giovanni and Leoluca become friends."},{"it":"dubbio, il","en":"doubt. A useful word for understanding questions about whether a witness is telling the truth."},{"it":"eleggere","en":"to elect; to choose someone for a position. L’avevano eletto numero uno di Cosa Nostra = they had elected him the number-one boss of Cosa Nostra."},{"it":"eliminare","en":"to eliminate; in the story, to kill. Sono stati eliminati i due attaccanti = the two attacking players were eliminated, meaning they were killed."},{"it":"entrare in carcere","en":"to enter prison."},{"it":"essere disposto a","en":"to be willing to. Sono disposte a dare informazioni = they are willing to give information."},{"it":"essere in pericolo","en":"to be in danger."},{"it":"essere nelle mani di qualcuno","en":"to be in someone’s hands; to be under someone’s control. Palermo è nelle mani del mostro = Palermo is in the monster’s hands."},{"it":"essere pronto a","en":"to be ready to. Sono pronto a dire tutto quello che so = I am ready to say everything I know."},{"it":"essere rispettato","en":"to be respected. Due cugini molto rispettati in città = two cousins who are highly respected in the city."},{"it":"eseguire un ordine","en":"to carry out an order."},{"it":"evitare","en":"to avoid. Evitare gli attentati = to avoid assassination attempts."},{"it":"fare arrestare qualcuno","en":"to get someone arrested. Vendicarsi facendo arrestare i nemici = to get revenge by having one’s enemies arrested."},{"it":"fare una retata","en":"to carry out a police raid. Fare una retata in un circolo = to raid a club or meeting place."},{"it":"fare un giuramento","en":"to swear an oath. Fare il giuramento con il santino bruciato = to swear the oath with a holy image burned in one’s hands."},{"it":"fare una vacanza","en":"to go on holiday. Fare una vacanza insieme in Russia = to go on holiday together in Russia."},{"it":"foglia, la","en":"leaf. In the artichoke metaphor, a leaf represents a mafia group or clan."},{"it":"formazione, la","en":"team lineup; formation. Dimmi la formazione = tell me the lineup."},{"it":"fornire","en":"to provide; to supply. Fornire informazioni preziose = to provide valuable information."},{"it":"fratello, il","en":"brother. Il fratello di don Masino = Don Masino’s brother."},{"it":"fuggire","en":"to flee; to escape. Molti mafiosi sfuggono all’arresto = many mafiosi escape arrest."},{"it":"funzionare","en":"to work; to function. Come funziona davvero la mafia = how the mafia really works."},{"it":"gelato, il","en":"ice cream. Prendere un cono = to get an ice-cream cone."},{"it":"gestire","en":"to manage; to run. Gestire un parcheggio = to manage a car park."},{"it":"giocarsi la partita","en":"to play the match; figuratively, to fight the battle or take on the challenge."},{"it":"giocare un ruolo fondamentale","en":"to play a fundamental role; to be crucial."},{"it":"giocatore, il","en":"player. The chapter compares the anti-mafia team to a football team."},{"it":"giudice, il","en":"judge."},{"it":"giustizia, la","en":"justice. La voglia di giustizia = the desire for justice."},{"it":"giustificare","en":"to justify; to give a reason for something."},{"it":"governare","en":"to govern; to run a city or region. I politici che governano le città = politicians who govern cities."},{"it":"grande vittoria, la","en":"great victory. La prima grande vittoria = the first major victory."},{"it":"in borghese","en":"in plain clothes. Una decina di poliziotti in borghese = about ten plainclothes police officers."},{"it":"in gran segreto","en":"in complete secrecy. Il matrimonio avvenne in gran segreto = the wedding took place in complete secrecy."},{"it":"in pericolo","en":"in danger. Un uomo in pericolo = a man in danger."},{"it":"incarcerare","en":"to imprison; to put behind bars."},{"it":"informazione, l’","en":"information. Informazioni preziose su Cosa Nostra = valuable information about Cosa Nostra."},{"it":"informazioni false","en":"false information."},{"it":"indagine, l’","en":"investigation. Organizzare le indagini = to organise investigations."},{"it":"indagare","en":"to investigate. I magistrati indagano sui mafiosi = the magistrates investigate the mafiosi."},{"it":"ingioiellato","en":"covered in jewellery; wearing lots of jewellery. Signore tutte ingioiellate = ladies covered in jewellery."},{"it":"inizio, l’","en":"beginning. Agli inizi degli anni Ottanta = in the early 1980s."},{"it":"insospettabile","en":"unsuspected; someone who would not normally be suspected. Persone insospettabili = people nobody would suspect."},{"it":"interrogare","en":"to question; to interrogate. Interrogare il capo di una cosca = to question the head of a mafia clan."},{"it":"interesse, l’","en":"interest. Nell’interesse della società = in the interests of society."},{"it":"informare","en":"to inform; to tell someone something."},{"it":"lasciare Palermo","en":"to leave Palermo."},{"it":"legge, la","en":"law. La legge giusta contro una legge ingiusta = the just law against an unjust law."},{"it":"legname, il","en":"timber; wood used for building or manufacturing. Fare il commerciante di legname = to work as a timber merchant."},{"it":"liberare","en":"to free; to liberate. Liberare Palermo dai tentacoli del mostro = to free Palermo from the monster’s tentacles."},{"it":"lotta, la","en":"struggle; fight. Le lotte tra le cosche = the conflicts between mafia clans."},{"it":"lontano da","en":"far from. Lavorare lontano da Palermo = to work far from Palermo."},{"it":"lupara bianca, la","en":"a mafia term for a disappearance in which the victim’s body is never found, often because it has been destroyed or concealed."},{"it":"magistrato, il","en":"magistrate; judicial officer. Un magistrato coraggioso = a courageous magistrate."},{"it":"mappa, la","en":"map. La mappa della nuova organizzazione = the map of the new organisation."},{"it":"matrimonio, il","en":"marriage; wedding. Il sindaco ha celebrato il matrimonio = the mayor officiated at the wedding."},{"it":"mettere in gabbia","en":"to put in a cage; figuratively, to capture or bring under control. Giovanni ha messo il mostro in gabbia = Giovanni has put the monster in a cage."},{"it":"mettersi al lavoro","en":"to get to work; to start working."},{"it":"minaccia, la","en":"threat. Non avevano paura delle minacce = they were not afraid of the threats."},{"it":"minacciare","en":"to threaten."},{"it":"movimento, il","en":"movement; activity. Studiare i movimenti del mostro = to study the mafia’s movements or activities."},{"it":"mostro, il","en":"monster. The chapter uses this metaphor for the mafia."},{"it":"muoversi","en":"to move; to get around. Si muove per le strade di Palermo = he moves around the streets of Palermo."},{"it":"nascondere","en":"to hide. I mafiosi nascosti nei covi = the mafiosi hidden in their hideouts."},{"it":"nemico, il","en":"enemy. Fare arrestare i nemici = to have one’s enemies arrested."},{"it":"numero uno, il","en":"number one; the top person or leader. Il numero uno di Cosa Nostra = the top boss of Cosa Nostra."},{"it":"nuovo","en":"new. Il nuovo capo di Giovanni = Giovanni’s new boss."},{"it":"nuove generazioni, le","en":"the younger generations; future generations."},{"it":"obbiettivo / obiettivo, l’","en":"objective; goal. Con lo stesso obiettivo = with the same goal."},{"it":"organizzare","en":"to organise. Organizzare le indagini = to organise investigations."},{"it":"organizzazione, l’","en":"organisation. La nuova organizzazione di Cosa Nostra = the new organisation of Cosa Nostra."},{"it":"ordine, l’","en":"order; command. È partito l’ordine di sgambettare la squadra = the order to take down the team has been issued."},{"it":"ospitare","en":"to host; to accommodate. This is useful general vocabulary, though the chapter more specifically describes staying in a protected location."},{"it":"parente, il / la","en":"relative. I parenti dei mafiosi uccisi = the relatives of murdered mafiosi."},{"it":"parte, la","en":"side; part. Stare dalla parte di Giovanni = to be on Giovanni’s side."},{"it":"passare alcune settimane","en":"to spend several weeks. Passarono alcune settimane in Sardegna = they spent several weeks in Sardinia."},{"it":"pentirsi","en":"to repent; to regret one’s actions. In the mafia context, it refers to a member who decides to cooperate with the authorities."},{"it":"pentito, il","en":"a repentant mafia member who cooperates with the authorities and provides information."},{"it":"perquisire","en":"to search a person or place for evidence. Fare le perquisizioni = to carry out searches."},{"it":"perquisizione, la","en":"search; police search. Gli arresti e le perquisizioni = arrests and searches."},{"it":"perdere","en":"to lose. Perdere la partita = to lose the match."},{"it":"pista, la","en":"lead; line of investigation. This is useful investigative vocabulary, though the chapter’s main wording is indagine and informazione."},{"it":"politico, il","en":"politician. Il politico più importante di Palermo = Palermo’s most important politician."},{"it":"pool antimafia, il","en":"anti-mafia investigative team; a group of magistrates working together against the mafia."},{"it":"portare in tribunale","en":"to bring before a court. Portare i mafiosi al processo in tribunale = to bring the mafiosi to trial."},{"it":"potente","en":"powerful. Il capo più potente = the most powerful boss."},{"it":"prezioso","en":"valuable; precious. Informazioni preziose = valuable information."},{"it":"progetto, il","en":"project; plan."},{"it":"prova, la","en":"evidence; proof. Raccogliere prove = to gather evidence."},{"it":"pubblico, il","en":"public. La piscina comunale is a public swimming pool; comunale means belonging to the municipality."},{"it":"punire","en":"to punish. Punire i nemici = to punish one’s enemies."},{"it":"raccogliere prove","en":"to gather evidence. La squadra deve raccogliere prove = the team must gather evidence."},{"it":"raccontare","en":"to tell; to recount. Raccontami = tell me."},{"it":"reclutare","en":"to recruit. Il modo di reclutare nuovi soldati = the way new soldiers are recruited."},{"it":"regione, la","en":"region. I politici che governano la città e la regione = the politicians who govern the city and the region."},{"it":"regola, la","en":"rule. Le regole della mafia = the mafia’s rules."},{"it":"ricostruire","en":"to reconstruct; to piece together. Ricostruire la mappa dell’organizzazione = to reconstruct the organisation’s structure."},{"it":"rivelazione, la","en":"revelation; disclosure. Le rivelazioni del pentito = the informant’s disclosures."},{"it":"riscattare","en":"to redeem; to recover. This is useful general vocabulary, but the chapter’s specific idea is revenge through the law."},{"it":"riscuotere","en":"to collect; to receive money. Riscuotere le tasse = to collect taxes."},{"it":"ritirarsi","en":"to withdraw; to retire. Don Masino preferisce ritirarsi in Brasile = Don Masino prefers to withdraw to Brazil."},{"it":"ruolo, il","en":"role. Giocare un ruolo fondamentale = to play a crucial role."},{"it":"sbarcare","en":"to disembark; to arrive by ship or plane. Don Masino sbarca all’aeroporto di Roma = Don Masino arrives at Rome airport."},{"it":"sconfiggere","en":"to defeat. Il mostro può essere sconfitto = the monster can be defeated."},{"it":"scoprire","en":"to discover; to uncover. Scoprire i crimini commessi = to uncover the crimes committed."},{"it":"scorta, la","en":"security escort. Scortato da una decina di poliziotti = escorted by about ten police officers."},{"it":"scortare","en":"to escort; to accompany someone under protection."},{"it":"segreto, il","en":"secret. In gran segreto = in complete secrecy."},{"it":"sfuggire a","en":"to escape; to avoid. Sfuggire all’arresto = to escape arrest."},{"it":"sgambettare","en":"literally, to trip someone by putting a leg in their way; figuratively, to bring someone down or sabotage them. Sgambettare Giovanni = to bring Giovanni down."},{"it":"sindaco, il","en":"mayor. Il sindaco di Palermo = the mayor of Palermo."},{"it":"soldato, il","en":"soldier. Nuovi soldati della mafia = new mafia recruits."},{"it":"sospetto, il","en":"suspect. Arrestare i mafiosi sospetti = to arrest suspected mafiosi."},{"it":"squadra, la","en":"team. Una grande squadra = a great team."},{"it":"stare dalla parte di qualcuno","en":"to be on someone’s side. Il sindaco sta dalla parte di Giovanni = the mayor is on Giovanni’s side."},{"it":"strage, la","en":"massacre; mass killing. Una strage dei familiari = a massacre of family members."},{"it":"strappare confidenze","en":"to obtain confidential information, often with effort or persistence."},{"it":"studiare","en":"to study; to examine carefully. Studiare i movimenti del mostro = to study the mafia’s activities."},{"it":"svolgere un’indagine","en":"to carry out an investigation. The chapter also uses organizzare le indagini."},{"it":"tentacolo, il","en":"tentacle. I tentacoli del mostro = the monster’s tentacles, referring to the mafia’s reach into society."},{"it":"testimone, il / la","en":"witness. I due testimoni = the two witnesses."},{"it":"tirare fuori","en":"to take out; to pull out. Tirare fuori una fotografia dallo zaino = to take a photograph out of a backpack."},{"it":"togliere di mezzo qualcuno","en":"to get rid of someone; in a mafia context, often to kill them."},{"it":"traffico illecito, il","en":"illegal trafficking; unlawful trade. Traffici illeciti = illegal dealings."},{"it":"tribunale, il","en":"court; courthouse. Un’aula del tribunale = a courtroom."},{"it":"trappola, la","en":"trap. Mettere il mostro in trappola = to trap the monster."},{"it":"tutto ciò che","en":"everything that; all that. Tutto ciò che si muove = everything that moves."},{"it":"uccidere","en":"to kill. Uccidere i nemici = to kill one’s enemies."},{"it":"ufficialmente","en":"officially. Useful when discussing formal arrests and court proceedings."},{"it":"unire","en":"to unite; to connect. Tutte le foglie sono collegate tra loro = all the leaves are connected to one another."},{"it":"uomo d’onore, l’","en":"literally “man of honour,” the term used by mafia members for themselves."},{"it":"uomo di valore, l’","en":"a person of great worth; a capable and courageous person."},{"it":"vacanza, la","en":"holiday; vacation. Fare una vacanza insieme = to go on holiday together."},{"it":"vendicarsi","en":"to take revenge. Vendicarsi attraverso la legge = to take revenge through the law."},{"it":"vincere","en":"to win; to defeat. Vincere la partita = to win the match."},{"it":"vittoria, la","en":"victory. La prima grande vittoria = the first major victory."},{"it":"volere bene a qualcuno","en":"to care about someone; to love someone. Giovanni gli vuole subito bene = Giovanni immediately grows fond of him."},{"it":"volto, il","en":"face. Non guarda in faccia nessuno = he doesn’t care who someone is; he doesn’t make exceptions for anyone."},{"it":"zaino, lo","en":"backpack. Mettere nello zaino = to put in the backpack."},{"it":"zona, la","en":"area; zone. In tutte le zone del campo = in every area of the playing field."}],"phrases":[{"it":"fare lo sgambetto a qualcuno","en":"to trip someone up; figuratively, to bring someone down"},{"it":"giocarsi la partita a viso aperto","en":"to fight the battle openly"},{"it":"andare all’attacco","en":"to go on the offensive"},{"it":"giocare un ruolo fondamentale","en":"to play a crucial role"},{"it":"avere il cuore forte come una roccia","en":"to have a heart as strong as a rock"},{"it":"volere bene a qualcuno","en":"to care about someone; to be fond of someone"},{"it":"non guardare in faccia nessuno","en":"to make no exceptions; to treat everyone the same regardless of status"},{"it":"fare una retata","en":"to carry out a police raid"},{"it":"ottenere la collaborazione di qualcuno","en":"to obtain someone’s cooperation"},{"it":"strappare confidenze a qualcuno","en":"to obtain confidential information from someone"},{"it":"essere disposti a fare qualcosa","en":"to be willing to do something"},{"it":"fare breccia nel cuore di qualcuno","en":"to get through to someone emotionally"},{"it":"far cadere un muro","en":"to bring down a wall; figuratively, to break through a barrier"},{"it":"dire tutto quello che si sa","en":"to tell everything one knows"},{"it":"controllare un’informazione","en":"to check or verify information"},{"it":"mettere il mostro in gabbia","en":"to put the monster in a cage; figuratively, to bring the mafia under control"},{"it":"essere nelle mani di qualcuno","en":"to be under someone’s control"},{"it":"sfuggire all’arresto","en":"to escape arrest"},{"it":"avere le manette ai polsi","en":"to have handcuffs on one’s wrists"},{"it":"essere un uomo d’onore","en":"to be a “man of honour,” in mafia terminology"},{"it":"fare affari","en":"to do business"},{"it":"riscuotere le tasse","en":"to collect taxes"},{"it":"non avere paura di nulla","en":"to be afraid of nothing"},{"it":"in poche ore","en":"in a few hours"},{"it":"giorno e notte","en":"day and night"},{"it":"da una parte… dall’altra","en":"on one side… on the other"},{"it":"essere pronto a dire tutto","en":"to be ready to tell everything"},{"it":"a partire da","en":"starting from; beginning with"},{"it":"un mondo più degno e più umano","en":"a more dignified and humane world"}]},{"number":8,"title":"Chapter 8 — Il mostro è in gabbia!","words":[{"it":"a braccia aperte","en":"with open arms."},{"it":"a forte velocità","en":"at high speed. Tre auto blu a forte velocità = three blue cars travelling at high speed."},{"it":"a malapena","en":"barely; only just."},{"it":"a quanto pare","en":"apparently; it seems that."},{"it":"accusare qualcuno","en":"to accuse someone. I magistrati che accusano i mafiosi = the magistrates who accuse the mafia members."},{"it":"accusa, l’","en":"accusation; charge."},{"it":"accomodarsi","en":"to take a seat; to sit down. Si accomodano in trenta gabbie = they take their places in thirty cages."},{"it":"aula bunker, l’","en":"a heavily fortified courtroom designed to protect against attacks."},{"it":"avvocato, l’","en":"lawyer; attorney. Gli avvocati che li difendono = the lawyers who defend them."},{"it":"astronave, l’","en":"spaceship. L’astronave verde = the green spaceship, the nickname given to the enormous fortified courtroom because of its appearance."},{"it":"attentato, l’","en":"assassination attempt; attack. Limitare il rischio di attentati = to reduce the risk of attacks."},{"it":"alzare la testa","en":"to raise one’s head; figuratively, to regain courage and stand up against oppression."},{"it":"battaglia, la","en":"battle; struggle. La battaglia contro il carciofo = the battle against the mafia."},{"it":"blindato","en":"armoured; heavily protected. Un fortino blindato = a heavily fortified stronghold."},{"it":"bravo","en":"good; well done. Bravo Giovanni! = Well done, Giovanni!"},{"it":"buttare via","en":"to throw away. Buttare via una grande occasione = to throw away a great opportunity."},{"it":"carcere, il","en":"prison. Finire in carcere = to end up in prison."},{"it":"carcerato, il","en":"prisoner; incarcerated person."},{"it":"carciofo, il","en":"artichoke. The chapter continues using the artichoke as a metaphor for the mafia’s many interconnected groups."},{"it":"condannare","en":"to convict; to sentence. Il giudice legge: “Condannato…” = the judge reads: “Guilty…”"},{"it":"condannato, il","en":"convicted person; someone who has been sentenced."},{"it":"condanna, la","en":"conviction; sentence. La condanna a diciannove ergastoli = the sentence of nineteen life terms."},{"it":"colpevole","en":"guilty. Il mostro è stato giudicato colpevole = the monster was found guilty."},{"it":"cemento, il","en":"concrete. Un grande scatolone fatto di marmo e di cemento = a large box-like building made of marble and concrete."},{"it":"cancellata, la","en":"metal gate; iron fence. La cancellata del Palazzaccio = the courthouse’s metal gate."},{"it":"centinaio, il","en":"hundred; a group of approximately one hundred. Centinaia di mafiosi = hundreds of mafia members."},{"it":"città, la","en":"city. La nostra città = our city."},{"it":"colpevole o innocente","en":"guilty or innocent."},{"it":"complessivamente","en":"in total; altogether. Complessivamente, diciannove ergastoli = nineteen life sentences in total."},{"it":"coraggio, il","en":"courage. Palermo ha trovato il coraggio per combatterlo = Palermo found the courage to fight it."},{"it":"condannato a scontare","en":"sentenced to serve. Condannato a scontare diciannove ergastoli = sentenced to serve nineteen life terms."},{"it":"davanti a","en":"in front of. Davanti alla porta del Palazzo = in front of the courthouse entrance."},{"it":"decidere","en":"to decide. I giudici si chiudono in una stanza per decidere la sentenza = the judges shut themselves in a room to decide the verdict."},{"it":"dichiarazione, la","en":"statement; declaration. Le dichiarazioni dei pentiti = the statements made by cooperating mafia members."},{"it":"difendere","en":"to defend. Gli avvocati che li difendono = the lawyers who defend them."},{"it":"dimostrare","en":"to demonstrate; to prove. Ha dimostrato che tutta la malavita dipende da una sola organizzazione = he proved that all the city’s criminal underworld depended on a single organisation."},{"it":"dipingere","en":"to paint. This verb is useful generally, but it is not central to the readable passage."},{"it":"dubbio, il","en":"doubt. Se non sbaglio = if I’m not mistaken."},{"it":"ergastolo, l’","en":"life imprisonment; a life sentence. Diciannove ergastoli = nineteen life sentences."},{"it":"entrare in gabbia","en":"to enter a cage; figuratively, to be brought under control or imprisoned."},{"it":"essere condannato","en":"to be convicted; to be sentenced."},{"it":"essere giudicato colpevole","en":"to be found guilty."},{"it":"essere in piedi","en":"to be standing. Nell’astronave verde si alzano tutti in piedi = everyone in the green courtroom stands up."},{"it":"esistere","en":"to exist. Guardate, il mostro esiste = Look, the monster exists."},{"it":"esplodere","en":"to explode. Negozi senza la paura che saltino in aria = shops without the fear that they will be blown up."},{"it":"essere abituato a","en":"to be accustomed to. Quelli abituati a dire che la mafia non esiste = those accustomed to saying that the mafia does not exist."},{"it":"fare arrestare qualcuno","en":"to have someone arrested; to cause someone to be arrested."},{"it":"fare giustizia","en":"to deliver justice; to see justice done."},{"it":"fare una pausa","en":"to take a pause. Una pausa studiata per aumentare la suspense = a pause deliberately timed to increase the suspense."},{"it":"finire in carcere","en":"to end up in prison."},{"it":"fortino, il","en":"small fortress; stronghold. Il fortino di Giovanni e della sua squadra = the stronghold of Giovanni and his team."},{"it":"frequentare","en":"to frequent; to visit regularly. Frequentare le caserme degli sbirri = to frequent the police barracks."},{"it":"fiducioso","en":"hopeful; confident. Essere fiduciosi di poter battere il mostro = to be hopeful that they can defeat the monster."},{"it":"foglia, la","en":"leaf. In the artichoke metaphor, the leaves represent the mafia’s different groups."},{"it":"fiera, la","en":"fair; marketplace. The courthouse is figuratively described as a market where mafia members once conducted business."},{"it":"gabbia, la","en":"cage. Trenta gabbie blindate = thirty reinforced cages."},{"it":"gabbia blindata, la","en":"reinforced, secure cage. In the courtroom, these are enclosed areas for the accused."},{"it":"giudice, il","en":"judge."},{"it":"giudice popolare, il","en":"lay judge; a member of the public serving as a judge in a trial."},{"it":"giudicare","en":"to judge; to try a case. I giudici diranno se sono colpevoli o innocenti = the judges will decide whether they are guilty or innocent."},{"it":"giudicato colpevole","en":"found guilty."},{"it":"giustizia, la","en":"justice. Una legge giusta = a just law."},{"it":"giornalista, il / la","en":"journalist. Cinquecento giornalisti arrivati da tutto il mondo = five hundred journalists who arrived from all over the world."},{"it":"gigantesco","en":"gigantic; enormous. Un’aula gigantesca = an enormous courtroom."},{"it":"gol, il","en":"goal, in football. Il suo gol = his goal; here, Giovanni’s major victory against the mafia."},{"it":"grande vittoria, la","en":"great victory; major success."},{"it":"in dialetto","en":"in dialect. U palazzu, in dialetto = “U palazzu,” in the local dialect."},{"it":"in gabbia","en":"in a cage; figuratively, imprisoned or trapped."},{"it":"in piedi","en":"standing; on one’s feet."},{"it":"innocente","en":"innocent; not guilty."},{"it":"infamia, l’","en":"disgrace; dishonour. Per i mafiosi frequentare le caserme degli sbirri è un’infamia = for mafia members, visiting police barracks is considered disgraceful."},{"it":"importanza, l’","en":"importance. Capisci l’importanza di quel giorno? = Do you understand the importance of that day?"},{"it":"invece","en":"instead; on the other hand. Volevano sgambettarlo e invece è arrivato fino in porta = they wanted to trip him up, but instead he made it all the way to the goal."},{"it":"innalzare","en":"to raise; to lift. Related to the expression alzare la testa, meaning to regain courage."},{"it":"legge, la","en":"law. C’è una legge sola che vale per tutti = there is only one law that applies to everyone."},{"it":"legge giusta, la","en":"just law; fair law."},{"it":"leggere una sentenza","en":"to read out a verdict or sentence. Il giudice legge la decisione = the judge reads the decision."},{"it":"limitare","en":"to limit; to reduce. Limitare il rischio di attentati = to reduce the risk of attacks."},{"it":"lotta, la","en":"fight; struggle. La gente che lotta contro la mafia = people who fight against the mafia."},{"it":"luogo, il","en":"place. Da tutto il mondo = from all over the world."},{"it":"mafia, la","en":"mafia."},{"it":"mafioso, il","en":"mafia member."},{"it":"malavita, la","en":"criminal underworld. Tutta la malavita della città = the entire criminal underworld of the city."},{"it":"marmo, il","en":"marble. Un grande scatolone fatto di marmo e cemento = a large box-like building made of marble and concrete."},{"it":"merito, il","en":"merit; credit. Il grande merito è di Giovanni = the great credit belongs to Giovanni."},{"it":"microfono, il","en":"microphone. Il giudice va al microfono = the judge goes to the microphone."},{"it":"minaccia, la","en":"threat. The courthouse was designed to reduce the risk of mafia attacks."},{"it":"mondiale, il","en":"World Cup; world championship. I Mondiali del Messico = the 1986 World Cup in Mexico."},{"it":"mostro, il","en":"monster. The narrator’s metaphor for the mafia."},{"it":"mostrare","en":"to show. Giovanni ha messo il mostro in gabbia per mostrarlo a tutti = Giovanni put the monster in a cage to show it to everyone."},{"it":"moltiplicare","en":"to multiply. Lo scudetto moltiplicato per mille = the championship multiplied a thousandfold."},{"it":"multare","en":"to fine someone. The chapter mentions a large fine as part of the sentence."},{"it":"negare","en":"to deny. Quelli che dicevano che la mafia non esiste = those who said the mafia did not exist."},{"it":"negozio, il","en":"shop; store. Aprire negozi senza paura = to open shops without fear."},{"it":"nessuno","en":"nobody; no one. Nessuno può più permettersi l’omertà = nobody can continue to hide behind the code of silence."},{"it":"notizia, la","en":"news; piece of information."},{"it":"non riuscire a credere","en":"to be unable to believe. Palermo non riesce a crederci = Palermo cannot believe it."},{"it":"non sbagliare","en":"not to be mistaken. Se non sbaglio = if I’m not mistaken."},{"it":"omertà, l’","en":"the code of silence that protects the mafia and discourages people from speaking to the authorities."},{"it":"organizzazione, l’","en":"organisation. Una sola organizzazione = a single organisation."},{"it":"osservare","en":"to observe; to look at carefully. Osservatele in queste trenta gabbie = look at them in these thirty cages."},{"it":"ottenere","en":"to obtain; to achieve. Ottenere una grande vittoria = to achieve a great victory."},{"it":"Palazzaccio, il","en":"an informal, somewhat dismissive nickname for the Palermo courthouse; literally, “the big ugly palace.”"},{"it":"palazzo, il","en":"building; palace. Il Palazzo di Giustizia = the Palace of Justice; the courthouse."},{"it":"partita, la","en":"match; game. La grande partita = the great match, used metaphorically for the fight against the mafia."},{"it":"pentito, il","en":"a mafia member who cooperates with the authorities and provides information about the organisation."},{"it":"permettersi","en":"to allow oneself; to be able to get away with something. Nessuno può più permettersi l’omertà = nobody can get away with maintaining the code of silence any longer."},{"it":"processare","en":"to put on trial. Devono essere processati = they must stand trial."},{"it":"processo, il","en":"trial; legal proceeding."},{"it":"maxiprocesso, il","en":"a very large criminal trial involving hundreds of defendants. Here, it refers to the landmark trial of Cosa Nostra in Palermo."},{"it":"porta, la","en":"door; goal in football. È arrivato fino in porta = he made it all the way to the goal."},{"it":"prova, la","en":"evidence; proof. Per mancanza di prove = for lack of evidence."},{"it":"pubblico, il","en":"public. I giudici popolari = lay judges drawn from the public."},{"it":"paura, la","en":"fear. Vivere nella paura del mostro = to live in fear of the monster."},{"it":"pena, la","en":"punishment; sentence. La pena giusta = the appropriate punishment."},{"it":"pulito","en":"clean. Un mare pulito = a clean sea."},{"it":"raffica, la","en":"burst; rapid succession. Una raffica di “condannato” = a rapid burst of “guilty” verdicts."},{"it":"rischio, il","en":"risk. Limitare il rischio di attentati = to reduce the risk of attacks."},{"it":"riuscire a","en":"to manage to; to succeed in. È riuscito a dimostrare = he managed to prove."},{"it":"rialzare la testa","en":"to raise one’s head again; to regain confidence and dignity."},{"it":"ritenuto","en":"considered; regarded as. Persone ritenute perbene = people considered respectable."},{"it":"rinunciare a","en":"to give up; to go without. Rinunciare al cinema e al ristorante = to give up going to the cinema and restaurants."},{"it":"restare zitto","en":"to remain silent. Papà rimase zitto per alcuni secondi = Dad remained silent for a few seconds."},{"it":"rispettabile","en":"respectable. Persone ritenute perbene = people regarded as respectable."},{"it":"scalinata, la","en":"staircase; flight of steps. La lunga scalinata davanti al Palazzo = the long staircase in front of the courthouse."},{"it":"scivolo, lo","en":"ramp; slide. Due specie di scivoli = two kinds of ramps."},{"it":"scudetto, lo","en":"the Italian football league championship title; also the badge worn by the reigning champions."},{"it":"sentenza, la","en":"verdict; judgment; sentence. Decidere la sentenza = to decide the verdict."},{"it":"scontare una pena","en":"to serve a sentence. Scontare diciannove ergastoli = to serve nineteen life sentences."},{"it":"silenzio, il","en":"silence. Silenzio before the verdict is read = silence."},{"it":"speranza, la","en":"hope. La vittoria di Giovanni dà speranza = Giovanni’s victory gives hope."},{"it":"sperare di","en":"to hope to. Palermo può sperare di avere un giorno case più belle = Palermo can hope to have more beautiful houses one day."},{"it":"spettacolo, lo","en":"spectacle; show. Uno spettacolo! = What a sight!"},{"it":"scatolone, lo","en":"large box; box-like structure. Un grande scatolone di marmo e cemento = a large box-like building made of marble and concrete."},{"it":"squadra, la","en":"team. La squadra di Giovanni = Giovanni’s team."},{"it":"strage, la","en":"massacre; mass killing. Gli indiani hanno fatto strage in città = the Indians have carried out a massacre in the city, in the father’s metaphor comparing the trial to a Western."},{"it":"stare in piedi","en":"to stand; to be standing."},{"it":"stupendo","en":"wonderful; magnificent. Quel magnifico gol all’Inghilterra = that magnificent goal against England."},{"it":"tentacolo, il","en":"tentacle. I tentacoli del mostro = the monster’s tentacles, representing the mafia’s reach into society."},{"it":"tribunale, il","en":"court; courthouse. Entrare nel tribunale = to enter the courthouse."},{"it":"tricolore, il","en":"the Italian tricolour flag, green, white and red. La fascia tricolore = the green-white-red sash worn by the lay judges in this passage."},{"it":"tornare a casa","en":"to return home."},{"it":"tutto
