to want to know"},{"it":"volere studiare","en":"to want to study"},{"it":"voltarsi","en":"to turn around"},{"it":"voce","en":"voice"},{"it":"voce nervosa","en":"nervous voice"},{"it":"viaggio d'avventura","en":"adventure journey"},{"it":"vuoto","en":"empty"},{"it":"zaino","en":"backpack; schoolbag"},{"it":"zia","en":"aunt"},{"it":"zio","en":"uncle"},{"it":"zona","en":"area; district"},{"it":"Zorro","en":"Zorro, the fictional masked hero"}],"phrases":[{"it":"Niente da fare.","en":"There's nothing to be done. / No luck."},{"it":"Chiudere un occhio.","en":"To turn a blind eye."},{"it":"Prendere il largo.","en":"To head out to sea; to leave the shore behind."},{"it":"Muoversi con le proprie gambe.","en":"To stand on one's own feet; to become independent."},{"it":"Essere all'altezza di qualcuno.","en":"To be able to measure up to someone."},{"it":"Fare il proprio dovere.","en":"To do one's duty."},{"it":"Non si era mai mosso da Palermo.","en":"He had never really left Palermo."},{"it":"Gli era venuta voglia di…","en":"He had started to feel like…"},{"it":"A forza di leggere…","en":"From reading so much…"},{"it":"Da un momento all'altro.","en":"At any moment."},{"it":"Perdere la testa.","en":"To lose one's head; to lose control."},{"it":"Restare freddo.","en":"To remain calm and composed."},{"it":"Mettere il coltello alla gola.","en":"To hold a knife to someone's throat."},{"it":"Trovare il colpevole.","en":"To find the culprit."},{"it":"Lotta ai contrabbandieri.","en":"The fight against smugglers."},{"it":"Scampato pericolo.","en":"A danger narrowly avoided; having escaped danger."},{"it":"Un colpo di fulmine.","en":"Love at first sight."},{"it":"Ti bacio e ti ribacio.","en":"I kiss you and kiss you again."},{"it":"Mi piace un sacco.","en":"I really like it."},{"it":"A giudicare da…","en":"Judging by…"},{"it":"Ci troviamo in acqua.","en":"We find ourselves in the water."},{"it":"Non c'era tanta gente.","en":"There weren't many people."},{"it":"Gli piaceva molto nuotare."
