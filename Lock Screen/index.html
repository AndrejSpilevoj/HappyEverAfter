<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Magic Lock Screen</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    .lock-screen {
      position: relative;
      width: min(100vw, 46.43vh);
      height: min(215.05vw, 100vh);
      aspect-ratio: 832 / 1792;
      flex: 0 0 auto;
      color: #fff;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    .wallpaper, .card-reveal {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .card-reveal {
      opacity: 0;
      z-index: 2;
      object-fit: contain;
      transition: opacity 700ms ease-out;
    }
    .date, .time {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,.18);
      font-variant-numeric: tabular-nums;
      z-index: 3;
    }
    .date {
      top: 4.8%;
      font-size: clamp(25px, 4.5vw, 4.8vh);
      line-height: 1.2;
      font-weight: 600;
    }
    .time {
      top: 8.2%;
      font-size: clamp(120px, 19.5vw, 20.5vh);
      line-height: .98;
      font-weight: 300;
      letter-spacing: -.055em;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      will-change: transform, opacity;
      transition: transform 2000ms ease-out, opacity 350ms ease-out;
    }
    .time:active { cursor: grabbing; }
    @media (min-width: 600px) {
      .lock-screen { width: min(46.43vh, 100vw, 420px); height: auto; aspect-ratio: 832 / 1792; }
      .date { top: 4.8%; font-size: clamp(18px, 2.7vh, 25px); }
      .time { top: 8.2%; font-size: clamp(74px, 12vh, 108px); }
    }
  </style>
</head>
<body>
  <main class="lock-screen" aria-label="Magic lock screen">
    <img class="wallpaper" src="lock_screen_background_clean.png" alt="">
    <img class="card-reveal" id="cardReveal" src="card.png" alt="">
    <div class="date" id="date">Mon 26 Oct</div>
    <div class="time" id="time" role="button" aria-label="Touch and drag down to turn the time backwards">10:33</div>
  </main>
  <script>
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const cardEl = document.getElementById("cardReveal");

    const FIRST_CARD = "card.png";
    const SECOND_PHASE_CARD = "cardAH.png";
    const FIRST_PHASE_ORDER = [
      "cardAS.png",
      "card2H.png",
      "cardJC.png",
      "cardAH.png",
      "card4C.png",
      "cardKH.png",
      "cardAD.png"
    ];

    const SECOND_PHASE_ORDER = [
      "cardAH.png",
      "cardAH.png",
      "cardAS.png",
      "card2H.png",
      "cardJC.png",
      "card.png",
      "card4C.png",
      "cardKH.png",
      "cardAD.png"
    ];
    const PAUSE_MS = 60000;
    const REVEAL_DISTANCE = 220;

    let shownTime = new Date();
    let isSpinningBack = false;
    let dragging = false;
    let startY = 0;
    let startTime = null;
    let lastMinuteIndex = 0;
    let dragPixels = 0;
    let lastCompletedPullAt = null;
    let lastActivityAt = Date.now();
    let sequenceMode = "first"; // "first" or "second"
    let firstCardCount = 0;
    let secondPhaseCardCount = 0;
    let firstDeck = [];
    let secondDeck = [];
    let sequenceStarted = false;
    let pendingCard = null;
    let cardReady = false;
    let magicLocked = false; // kept for event-handler compatibility; the live clock is never locked
    let lockTimer = null;

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function resetDecks() {
      firstDeck = [...FIRST_PHASE_ORDER];
      secondDeck = [...SECOND_PHASE_ORDER];
    }
    resetDecks();

    // Preload every card before it is needed, so a slow image request cannot
    // make the next card appear late or cause a visible jump during a pull.
    const cardImageCache = new Map();
    const ALL_CARD_IMAGES = [...new Set([
      FIRST_CARD, SECOND_PHASE_CARD, ...FIRST_PHASE_ORDER, ...SECOND_PHASE_ORDER
    ])];
    for (const src of ALL_CARD_IMAGES) {
      const image = new Image();
      cardImageCache.set(src, image);
      image.onload = () => {
        if (dragging && pendingCard === src && !cardReady) {
          cardReady = true;
          cardEl.src = src;
          cardEl.style.opacity = String(Math.min(1, dragPixels / REVEAL_DISTANCE));
        }
      };
      image.src = src;
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).format(date);
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("en-GB", {
        weekday: "short", day: "2-digit", month: "short"
      }).format(date).replace(",", "");
    }

    function renderClock(date) {
      timeEl.textContent = formatTime(date);
      dateEl.textContent = formatDate(date);
    }

    function updateClock() {
      // The real clock always runs whenever the user is not actively pulling
      // the time or watching the brief rewind animation.
      if (!dragging && !isSpinningBack) {
        shownTime = new Date();
        renderClock(shownTime);
      }
    }
    updateClock();
    setInterval(updateClock, 250);

    function beginDrag(clientY) {
      if (magicLocked) return;

      const now = Date.now();

      // After 1 minute of no touching, switch rounds (even if round 1 was not finished).
      const idle = now - lastActivityAt >= PAUSE_MS;
      if (idle && sequenceStarted) {
        if (sequenceMode === "first") {
          sequenceMode = "second";
          secondDeck = [...SECOND_PHASE_ORDER];
        } else {
          // Round 2 done (or abandoned): start over with round 1.
          sequenceMode = "first";
          firstCardCount = 0;
          firstDeck = [...FIRST_PHASE_ORDER];
        }
      }

      lastActivityAt = now;
      pendingCard = peekNextCard();
      if (!pendingCard) {
        // No card is available yet (usually because phase 1 is waiting for its
        // one-minute wait). Do not freeze or lock the clock; just ignore this pull.
        dragging = false;
        isSpinningBack = false;
        shownTime = new Date();
        renderClock(shownTime);
        timeEl.style.opacity = "1";
        timeEl.style.transform = "";
        return;
      }

      clearTimeout(lockTimer);
      dragging = true;
      const cachedCard = cardImageCache.get(pendingCard);
      cardReady = Boolean(cachedCard && cachedCard.complete && cachedCard.naturalWidth > 0);
      if (cardReady) cardEl.src = pendingCard;
      cardEl.style.opacity = "0";
      startY = clientY;
      startTime = new Date();
      shownTime = new Date(startTime);
      lastMinuteIndex = 0;
      dragPixels = 0;
      timeEl.style.transition = "none";
      timeEl.style.opacity = "1";
      timeEl.style.transform = "";
    }

    function moveDrag(clientY) {
      if (!dragging || magicLocked) return;

      dragPixels = Math.max(0, clientY - startY);
      const minutesBack = Math.floor(dragPixels / 5);

      if (minutesBack !== lastMinuteIndex) {
        shownTime = new Date(startTime.getTime() - minutesBack * 60 * 1000);
        renderClock(shownTime);
        lastMinuteIndex = minutesBack;
      }

      // Reveal the selected card as the time is pulled down.
      cardEl.style.opacity = cardReady
        ? String(Math.min(1, dragPixels / REVEAL_DISTANCE))
        : "0";
      timeEl.style.opacity = String(1 - 0.9 * Math.min(1, dragPixels / REVEAL_DISTANCE));
      timeEl.style.transform = `translateY(${Math.min(dragPixels * 0.16, 58)}px)`;
    }

    function peekNextCard() {
      if (sequenceMode === "first") {
        if (firstCardCount < 2) return FIRST_CARD;
        return firstDeck.length ? firstDeck[0] : null;
      }
      return secondDeck.length ? secondDeck[0] : null;
    }

    function chooseNextCard() {
      if (sequenceMode === "first") {
        if (firstCardCount < 2) {
          firstCardCount++;
          return FIRST_CARD;
        }
        return firstDeck.length ? firstDeck.shift() : null;
      }

      return secondDeck.length ? secondDeck.shift() : null;
    }

    function startInactivityLockTimer() {
      // Intentionally do not lock the clock after inactivity. The live clock
      // and the card-sequence timing are independent.
      clearTimeout(lockTimer);
    }

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      // Short pulls return quickly; a full pull gets the full two-second glide.
      const pullProgress = Math.min(1, dragPixels / REVEAL_DISTANCE);
      const returnDuration = Math.round(250 + 1750 * pullProgress);
      timeEl.style.transition = `transform ${returnDuration}ms ease-out, opacity ${returnDuration}ms ease-out`;
      timeEl.style.transform = "";
      timeEl.style.opacity = "0.1";

      // Only a full pull reveals/consumes a card.
      if (dragPixels >= REVEAL_DISTANCE) {
        const card = chooseNextCard();
        if (card) {
          sequenceStarted = true;
          lastCompletedPullAt = Date.now();
          startInactivityLockTimer();
        }
      }

      cardEl.style.opacity = "0";
      isSpinningBack = true;
      const fromTime = new Date(shownTime);
      const start = performance.now();
      const duration = returnDuration;

      function spinBackToRealTime(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const realNow = new Date();
        const intermediate = new Date(
          fromTime.getTime() + (realNow.getTime() - fromTime.getTime()) * eased
        );
        renderClock(intermediate);

        if (progress < 1) {
          requestAnimationFrame(spinBackToRealTime);
        } else {
          shownTime = new Date();
          renderClock(shownTime);
          isSpinningBack = false;
          timeEl.style.transition = "opacity 350ms ease-out";
          timeEl.style.opacity = "1";
        }
      }
      requestAnimationFrame(spinBackToRealTime);
    }

    // iPhone / iPad Safari: non-passive touch handlers are important here.
    timeEl.addEventListener("touchstart", (event) => {
      if (!event.touches.length || magicLocked) return;
      beginDrag(event.touches[0].clientY);
      event.preventDefault();
    }, { passive: false });

    timeEl.addEventListener("touchmove", (event) => {
      if (!dragging || !event.touches.length || magicLocked) return;
      moveDrag(event.touches[0].clientY);
      event.preventDefault();
    }, { passive: false });

    timeEl.addEventListener("touchend", (event) => {
      if (magicLocked) return;
      event.preventDefault();
      finishDrag();
    }, { passive: false });

    timeEl.addEventListener("touchcancel", finishDrag, { passive: false });

    // Mouse / pointer support for desktop browsers.
    timeEl.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "touch" || magicLocked) return;
      beginDrag(event.clientY);
      try { timeEl.setPointerCapture(event.pointerId); } catch (_) {}
      event.preventDefault();
    });

    timeEl.addEventListener("pointermove", (event) => {
      if (!dragging || event.pointerType === "touch" || magicLocked) return;
      moveDrag(event.clientY);
      event.preventDefault();
    });

    timeEl.addEventListener("pointerup", (event) => {
      if (event.pointerType !== "touch" && !magicLocked) finishDrag();
    });

    timeEl.addEventListener("pointercancel", (event) => {
      if (event.pointerType !== "touch" && !magicLocked) finishDrag();
    });

    // Any screen interaction resets the inactivity clock used to unlock phase 2.
    document.addEventListener("touchstart", () => { lastActivityAt = Date.now(); }, { passive: true });
    document.addEventListener("pointerdown", () => { lastActivityAt = Date.now(); }, { passive: true });

    // Block stray page-level touch movement while the clock is being dragged.
    document.addEventListener("touchmove", (event) => {
      if (dragging) event.preventDefault();
    }, { passive: false });

    // Keep the display awake where the browser supports Screen Wake Lock.
    let wakeLock = null;
    async function keepScreenAwake() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (error) {
        console.info("Screen Wake Lock unavailable:", error);
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") keepScreenAwake();
    });
    keepScreenAwake();
  </script>
</body>
</html>
