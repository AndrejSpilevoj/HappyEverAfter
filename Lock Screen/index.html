<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Magic Lock Screen</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    .lock-screen {
      position: relative;
      width: min(100vw, 46.43vh);
      height: min(215.05vw, 100vh);
      aspect-ratio: 832 / 1792;
      flex: 0 0 auto;
      color: #fff;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .wallpaper, .card-reveal {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .card-reveal {
      opacity: 0;
      z-index: 4;
      object-fit: contain;
      transition: opacity 700ms ease-out;
    }

    /* Covers the two circular health widgets baked into the wallpaper image.
       The live No Alarm label remains above this clean black area. */
    .widget-cleanup {
      position: absolute;
      z-index: 2;
      top: 24.5%;
      left: 47%;
      width: 50%;
      height: 13%;
      background: #000;
      pointer-events: none;
    }

    .date, .time {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      color: #fff;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,.18);
      font-variant-numeric: tabular-nums;
      z-index: 3;
    }

    .date {
      top: 4.8%;
      font-size: clamp(25px, 4.5vw, 4.8vh);
      line-height: 1.2;
      font-weight: 600;
    }

    .time {
      top: 8.2%;
      font-size: clamp(120px, 19.5vw, 20.5vh);
      line-height: .98;
      font-weight: 300;
      letter-spacing: -.055em;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      will-change: transform, opacity;
      transition: transform 2000ms ease-out, opacity 350ms ease-out;
      white-space: nowrap;

      /* Silver glass treatment inspired by sample 2. */
      color: #87939c;
      background: linear-gradient(
        180deg,
        #e0e7eb 0%,
        #9caab3 13%,
        #46545e 37%,
        #26323a 54%,
        #7b8992 76%,
        #34414a 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: .65px rgba(205, 218, 226, .34);
      text-shadow:
        0 1px 0 rgba(255,255,255,.22),
        0 -1px 0 rgba(0,0,0,.65),
        0 3px 7px rgba(0,0,0,.42),
        0 0 13px rgba(183,201,213,.10);
    }

    .alarm-line {
      position: absolute;
      top: 26.7%;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(205, 211, 216, .66);
      font-size: clamp(20px, 3.6vw, 2.8vh);
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -.025em;
      z-index: 3;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
    }

    .alarm-icon {
      width: 1em;
      height: 1em;
      flex: 0 0 auto;
      opacity: .82;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Raise the colon so its two dots sit optically halfway up the digits. */
    .time-colon {
      display: inline-block;
      position: relative;
      top: -.09em;
    }



    @media (min-width: 600px) {
      .lock-screen {
        width: min(46.43vh, 100vw, 420px);
        height: auto;
        aspect-ratio: 832 / 1792;
      }
      .date { top: 4.8%; font-size: clamp(18px, 2.7vh, 25px); }
      .time { top: 8.2%; font-size: clamp(74px, 12vh, 108px); }
      .alarm-line { top: 26.7%; font-size: clamp(17px, 2.5vh, 22px); }
    }
  </style>
</head>
<body>
  <main class="lock-screen" aria-label="Magic lock screen">
    <img class="wallpaper" src="lock_screen_background_clean.png" alt="">
    <img class="card-reveal" id="cardReveal" src="card.png" alt="">
    <div class="widget-cleanup" aria-hidden="true"></div>
    <div class="date" id="date">Thu 12 Nov</div>
    <div class="time" id="time" role="button" aria-label="Touch and drag the hours or minutes down to reveal cards"><span id="hoursText">00</span><span class="time-colon">:</span><span id="minutesText">00</span></div>
    <div class="alarm-line" aria-label="No Alarm">
      <svg class="alarm-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13" r="8"></circle>
        <path d="M8 3 5 5M16 3l3 2M12 9v4l2.5 1.5M4 11H2M22 11h-2"></path>
      </svg>
      <span>No Alarm</span>
    </div>
  </main>

  <script>
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const cardEl = document.getElementById("cardReveal");
    const hoursTextEl = document.getElementById("hoursText");
    const minutesTextEl = document.getElementById("minutesText");

    // Pulling the MINUTES runs phase 1.
    const MINUTES_SEQUENCE = [
      "card.png",
      "card.png",
      "cardAS.png",
      "card2H.png",
      "cardJC.png",
      "cardAH.png",
      "card4C.png",
      "cardKH.png",
      "cardAD.png"
    ];

    // Pulling the HOURS runs phase 2.
    const HOURS_SEQUENCE = [
      "cardAH.png",
      "cardAH.png",
      "cardAS.png",
      "card2H.png",
      "cardJC.png",
      "card.png",
      "card4C.png",
      "cardKH.png",
      "cardAD.png"
    ];

    const REVEAL_DISTANCE = 220;
    const PIXELS_PER_TIME_STEP = 5;

    // Each sequence has its own independent position.
    const sequencePositions = {
      minutes: 0,
      hours: 0
    };

    let shownTime = new Date();
    let dragging = false;
    let isSpinningBack = false;
    let activeSequence = null;
    let activePointerId = null;
    let startY = 0;
    let startTime = null;
    let dragPixels = 0;
    let pendingCard = null;
    let cardReady = false;
    let cardConsumed = false;

    function getSequence(name) {
      return name === "minutes" ? MINUTES_SEQUENCE : HOURS_SEQUENCE;
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short"
      }).format(date).replace(",", "");
    }

    function renderClock(date) {
      const hours = new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        hourCycle: "h23"
      }).format(date);

      const minutes = new Intl.DateTimeFormat("en-GB", {
        minute: "2-digit"
      }).format(date);

      // Inline spans preserve the original font and natural text layout.
      hoursTextEl.textContent = hours;
      minutesTextEl.textContent = minutes;
    }

    function updateClock() {
      if (!dragging && !isSpinningBack) {
        shownTime = new Date();
        renderClock(shownTime);
        dateEl.textContent = formatDate(shownTime);
      }
    }

    function getSequenceFromPointer(clientX) {
      const rect = timeEl.getBoundingClientRect();
      const midpoint = rect.left + rect.width / 2;
      return clientX < midpoint ? "hours" : "minutes";
    }


    updateClock();
    setInterval(updateClock, 250);

    // Preload all card files so they are ready before a reveal.
    const cardImageCache = new Map();
    const ALL_CARD_IMAGES = [...new Set([
      ...MINUTES_SEQUENCE,
      ...HOURS_SEQUENCE
    ])];

    for (const src of ALL_CARD_IMAGES) {
      const image = new Image();
      cardImageCache.set(src, image);

      image.onload = () => {
        if (dragging && pendingCard === src && !cardReady) {
          cardReady = true;
          cardEl.src = src;
          applyPull(dragPixels);
        }
      };

      image.src = src;
    }

    function beginDrag(event, sequenceName) {
      // Ignore a second pointer while a gesture is already in progress.
      if (dragging) return;

      const sequence = getSequence(sequenceName);
      const position = sequencePositions[sequenceName];

      // A completed sequence stays completed until the page is refreshed.
      if (position >= sequence.length) return;

      event.preventDefault();

      activeSequence = sequenceName;
      pendingCard = sequence[position];
      activePointerId = event.pointerId;

      dragging = true;
      isSpinningBack = false;
      cardConsumed = false;
      dragPixels = 0;
      startY = event.clientY;
      startTime = new Date();
      shownTime = new Date(startTime);

      const cachedCard = cardImageCache.get(pendingCard);
      cardReady = Boolean(cachedCard && cachedCard.complete && cachedCard.naturalWidth > 0);

      if (cardReady) {
        cardEl.src = pendingCard;
      }

      cardEl.style.transition = "none";
      cardEl.style.opacity = "0";

      timeEl.style.transition = "none";
      timeEl.style.opacity = "1";
      timeEl.style.transform = "";

      try {
        event.currentTarget.setPointerCapture(event.pointerId);
      } catch (_) {}
    }

    function moveDrag(event) {
      if (!dragging || event.pointerId !== activePointerId) return;

      event.preventDefault();
      dragPixels = Math.max(0, event.clientY - startY);

      // Consume exactly one card per meaningful pull.
      if (!cardConsumed && dragPixels >= 3) {
        cardConsumed = true;
        sequencePositions[activeSequence]++;
      }

      const minutesBack = Math.floor(dragPixels / PIXELS_PER_TIME_STEP);
      shownTime = new Date(startTime.getTime() - minutesBack * 60 * 1000);
      renderClock(shownTime);
      applyPull(dragPixels);
    }

    function applyPull(pixels) {
      const progress = Math.min(1, pixels / REVEAL_DISTANCE);
      cardEl.style.opacity = cardReady ? String(progress) : "0";
      timeEl.style.opacity = String(1 - 0.9 * progress);
      timeEl.style.transform = `translateY(${Math.min(pixels * 0.16, 58)}px)`;
    }

    function finishDrag(event) {
      if (!dragging) return;
      if (event && activePointerId !== null && event.pointerId !== activePointerId) return;

      if (event) event.preventDefault();

      dragging = false;
      activePointerId = null;

      const pullProgress = Math.min(1, dragPixels / REVEAL_DISTANCE);
      const returnDuration = Math.round(200 + 1000 * pullProgress);

      timeEl.style.transition = "none";
      cardEl.style.transition = "none";

      const fromTime = new Date(shownTime);
      const fromPixels = dragPixels;
      const animationStart = performance.now();

      isSpinningBack = true;

      function spinBackToRealTime(now) {
        if (dragging) {
          isSpinningBack = false;
          return;
        }

        const progress = Math.min(1, (now - animationStart) / returnDuration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const realNow = new Date();

        // Roll the displayed clock smoothly back to the actual current time.
        renderClock(new Date(
          fromTime.getTime() + (realNow.getTime() - fromTime.getTime()) * eased
        ));

        applyPull(fromPixels * (1 - eased));

        if (progress < 1) {
          requestAnimationFrame(spinBackToRealTime);
        } else {
          shownTime = new Date();
          renderClock(shownTime);
          dateEl.textContent = formatDate(shownTime);
          isSpinningBack = false;
          activeSequence = null;
          pendingCard = null;
          cardReady = false;

          timeEl.style.opacity = "1";
          timeEl.style.transform = "";
          cardEl.style.opacity = "0";
        }
      }

      requestAnimationFrame(spinBackToRealTime);
    }

    // Pointer events support touch, Apple Pencil, trackpads and desktop mouse.
    // The touched half is detected from the rendered text, not separate spans.
    timeEl.addEventListener("pointerdown", (event) => {
      const sequenceName = getSequenceFromPointer(event.clientX);
      beginDrag(event, sequenceName);
    });

    timeEl.addEventListener("pointermove", moveDrag);
    timeEl.addEventListener("pointerup", finishDrag);
    timeEl.addEventListener("pointercancel", finishDrag);

    // Keep the display awake where the browser supports Screen Wake Lock.
    let wakeLock = null;

    async function keepScreenAwake() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;

      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (error) {
        console.info("Screen Wake Lock unavailable:", error);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") keepScreenAwake();
    });

    keepScreenAwake();
  </script>
</body>
</html>
