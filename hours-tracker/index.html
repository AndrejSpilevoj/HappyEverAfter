<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valandų apskaita</title>
<style>
  :root{ --text:#5d6472; --muted:#8d93a0; --line:rgba(255,255,255,.55); --glass:rgba(255,255,255,.38); }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,#ebe7e2 0%,#e1e7ea 50%,#e8e2ea 100%);
    background-attachment:fixed; position:relative; overflow-x:hidden;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:.6; z-index:0}
  .b1{width:420px;height:420px;background:#d6e0e6;top:-100px;left:-80px}
  .b2{width:380px;height:380px;background:#e6dcd2;bottom:-80px;right:-60px}
  .b3{width:300px;height:300px;background:#dfe6dc;top:40%;left:55%}
  main{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:48px 16px 64px}
  h1{font-size:28px; font-weight:600; letter-spacing:-.02em; margin:0 0 4px}
  .sub{color:var(--muted); font-size:14px; margin-bottom:24px}
  .card{
    background:var(--glass); border:1px solid var(--line); border-radius:26px;
    -webkit-backdrop-filter:blur(28px) saturate(150%); backdrop-filter:blur(28px) saturate(150%);
    box-shadow:0 8px 30px rgba(120,130,145,.12), inset 0 1px 0 rgba(255,255,255,.7);
    padding:24px; margin-bottom:20px;
  }
  .label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px}
  .names{
    display:flex; gap:4px; padding:5px; margin-bottom:22px; overflow-x:auto;
    background:rgba(255,255,255,.3); border:1px solid var(--line); border-radius:28px;
    box-shadow:inset 0 1px 3px rgba(120,130,145,.12); scrollbar-width:none;
  }
  .names::-webkit-scrollbar{display:none}
  .chip{
    flex:1 1 auto; white-space:nowrap; border:0; background:transparent; color:var(--text);
    padding:9px 12px; border-radius:24px; font-size:13px; cursor:pointer; font-family:inherit;
    transition:.2s; line-height:1.25; text-align:center;
  }
  .chip small{display:block; font-size:11px; color:var(--muted); min-height:14px}
  .chip:hover{background:rgba(255,255,255,.4)}
  .chip.on{background:rgba(255,255,255,.9); box-shadow:0 2px 10px rgba(120,130,145,.2); font-weight:600}
  .row{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
  .field{display:flex; flex-direction:column; gap:6px}
  .field span{font-size:12px; color:var(--muted)}
  input[type=time], input[type=date], input[type=password]{
    padding:12px 14px; font-size:18px; font-family:inherit; text-align:center; color:var(--text);
    background:rgba(255,255,255,.55); border:1px solid var(--line); border-radius:16px; outline:none;
    box-shadow:inset 0 1px 3px rgba(120,130,145,.12);
  }
  input[type=text]{
    padding:14px 16px; font-size:16px; font-family:inherit; color:var(--text); width:100%;
    background:rgba(255,255,255,.55); border:1px solid var(--line); border-radius:16px; outline:none;
    box-shadow:inset 0 1px 3px rgba(120,130,145,.12);
  }
  input[type=text]::placeholder{color:#a9afba}
  input[type=text]:focus{background:rgba(255,255,255,.8); border-color:#fff}
  .grow{flex:1 1 260px}
  .row .submit{margin-left:0}
  input[type=time]{width:130px}
  input[type=date]{width:178px; font-size:16px}
  input[type=time]:focus,input[type=date]:focus,input[type=password]:focus{background:rgba(255,255,255,.8); border-color:#fff}
  .dash{font-size:24px; padding-bottom:10px; color:var(--muted)}
  .dur{padding-bottom:12px; font-size:14px; color:var(--muted); min-width:90px}
  .dur b{color:var(--text); font-size:18px; font-weight:600}
  button.submit{
    margin-left:auto; padding:15px 34px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;
    color:#fff; border:1px solid rgba(255,255,255,.7); border-radius:999px;
    background:linear-gradient(180deg,#b7c4d2,#9fb0c2);
    box-shadow:0 6px 18px rgba(130,150,170,.3), inset 0 1px 0 rgba(255,255,255,.6); transition:.2s;
  }
  button.submit:hover{transform:translateY(-1px)}
  button.submit:active{transform:scale(.98)}
  button.submit:disabled{opacity:.6; cursor:wait}
  #msg{margin-top:14px; font-size:13px; color:#7f9a86; min-height:18px}
  .hint{font-size:12px; color:var(--muted); margin:-4px 0 12px}
  table{width:100%; border-collapse:collapse; font-size:15px}
  th,td{padding:12px 10px; text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  tbody tr{border-top:1px solid rgba(255,255,255,.6)}
  td.dl{cursor:pointer; border-radius:12px; transition:.15s}
  td.dl:hover{background:rgba(255,255,255,.65); box-shadow:0 1px 8px rgba(120,130,145,.15)}
  td.dl:hover::after{content:" ↓"; color:var(--muted)}
  td.tot,th.tot{font-weight:600}
  td .role{color:var(--muted); font-size:13px}
  tfoot tr{border-top:1px solid rgba(255,255,255,.9)}
  tfoot td{font-weight:600; background:rgba(255,255,255,.3)}
  tfoot td:first-child{border-radius:0 0 0 14px} tfoot td:last-child{border-radius:0 0 14px 0}
  .scroll{overflow-x:auto}
  /* ---- statistics ---- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:8px}
  .kpi{background:rgba(255,255,255,.5); border:1px solid var(--line); border-radius:20px; padding:16px 18px}
  .kpi b{display:block; font-size:28px; font-weight:600; letter-spacing:-.02em; color:var(--text)}
  .kpi span{font-size:12px; color:var(--muted)}
  .kpi .up{color:#7f9a86} .kpi .down{color:#b08a7a}
  .stitle{font-size:15px; font-weight:600; margin:26px 0 4px}
  .shint{font-size:12px; color:var(--muted); margin-bottom:14px}
  .cols{display:flex; align-items:flex-end; gap:10px; height:190px; padding-top:6px}
  .col{flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center}
  .col .bar{width:100%; max-width:60px; border-radius:12px 12px 4px 4px; min-height:3px;
            background:linear-gradient(180deg,#b7c4d2,#9fb0c2); box-shadow:0 4px 12px rgba(130,150,170,.25)}
  .col.now .bar{background:linear-gradient(180deg,#a8c3b0,#8fae99)}
  .col .val{font-size:12px; font-weight:600; margin-bottom:5px; white-space:nowrap}
  .col .lbl{font-size:11px; color:var(--muted); margin-top:7px; text-align:center}
  .hrow{display:grid; grid-template-columns:minmax(110px,180px) 1fr 96px; gap:12px; align-items:center; margin:10px 0; font-size:14px}
  .hrow .track{height:14px; border-radius:99px; background:rgba(255,255,255,.55); box-shadow:inset 0 1px 3px rgba(120,130,145,.12)}
  .hrow .fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#b7c4d2,#9fb0c2)}
  .hrow .num{text-align:right; font-weight:600}
  .hrow .num small{font-weight:400; color:var(--muted)}
  .col .lbl{line-height:1.25}
  .dgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px 8px}
  .dm{text-align:center}
  .dm svg{display:block; margin:0 auto}
  .dm b{display:block; font-size:13px; font-weight:600; margin-top:6px}
  .dm i{font-style:normal; font-size:12px; color:var(--muted)}
  .seg{cursor:pointer; transition:stroke-width .15s}
  .seg:hover{stroke-width:17}
  .dlegend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:20px; padding-top:14px; border-top:1px solid rgba(255,255,255,.8); font-size:12px}
  .dlegend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px}
  .dlegend .role{color:var(--muted)}
  #tip{position:fixed; z-index:6; left:0; top:0; opacity:0; pointer-events:none; transition:opacity .12s;
       background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:14px; padding:9px 13px;
       -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
       box-shadow:0 8px 24px rgba(120,130,145,.22); font-size:13px; line-height:1.4; white-space:nowrap}
  #tip.show{opacity:1}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:8px}
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); opacity:0; z-index:5;
    background:rgba(255,255,255,.85); border:1px solid var(--line); border-radius:18px; padding:14px 22px;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow:0 8px 30px rgba(120,130,145,.2); font-size:14px; transition:.3s; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}
  #pin{position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
       background:rgba(225,231,234,.6); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
  #pin .card{margin:0; text-align:center; min-width:280px}
  #pin input{width:100%; margin:10px 0 16px}
  #pin button{margin:0}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <h1>Valandų apskaita</h1>
  <div class="sub" id="today"></div>

  <section class="card">
    <div class="label">Asmuo</div>
    <div class="names" id="names"></div>
    <div class="row">
      <label class="field"><span>Data</span><input type="date" id="d"></label>
      <label class="field"><span>Nuo</span><input type="time" id="from" value="00:00"></label>
      <div class="dash">–</div>
      <label class="field"><span>Iki</span><input type="time" id="to" value="00:00"></label>
      <div class="dur">Trukmė<br><b id="dur">0:00</b></div>
      <label class="field grow" id="volBox" style="display:none"><span id="volLabel">Savanorio vardas, pavardė</span>
        <input type="text" id="vol" maxlength="80" autocomplete="off" placeholder="Vardas Pavardė"></label>
    </div>
    <div class="row" style="margin-top:16px">
      <label class="field grow"><span id="textLabel">Atlikti darbai (trumpai aprašykite veiklą)</span>
        <input type="text" id="text" maxlength="400" autocomplete="off" placeholder="Pvz.: Koordinavau susitikimą su projekto dalyviais"></label>
      <button class="submit" id="go">Pateikti</button>
    </div>
    <div id="msg"></div>
  </section>

  <section class="card">
    <div class="label">Mėnesio suvestinė (val.)</div>
    <div class="hint">Spustelėkite valandas, kad atsisiųstumėte ataskaitą (.xlsx)</div>
    <div class="scroll"><table id="tbl"></table></div>
  </section>
  <section class="card" id="stats">
    <div class="label">Projekto apžvalga</div>
    <div id="statsBody"></div>
  </section>
  <div class="note" id="note"></div>
</main>

<div id="pin"><div class="card">
  <div class="label">PIN</div>
  <input type="password" id="pinInput" autocomplete="off">
  <button class="submit" id="pinOk" style="margin:0">Tęsti</button>
</div></div>
<div id="toast"></div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="report.js"></script>
<script>
// ====== CONFIG ======
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOiZTxP1gi1INvdPnLtQSw5BDp66IT8FolrsQXSix2FBtZkfPL6B2z2C93nPcoTT8xWw/exec";   // Apps Script web app URL (ends with /exec)
const MONTHS_SHOWN = 7;                         // columns in the summary table
// ====================
const DEMO = new URLSearchParams(location.search).has("demo") || SCRIPT_URL.startsWith("PASTE");
const T = Tracker;
let people = [], log = [], sel = 0, months = [];
let token = ""; try { token = localStorage.getItem("pin") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
const label = p => p.role ? `${p.name} <span class="role">(${p.role})</span>` : p.name;
const plain = p => p.name + (p.role ? " (" + p.role + ")" : "");

// ---- people that need a name field (+ their own texts) ----
const DEFAULT_MODE = {
  text:"Atlikti darbai (trumpai aprašykite veiklą)",
  ph:"Pvz.: Koordinavau susitikimą su projekto dalyviais",
  errText:"Aprašykite atliktus darbus."
};
const MODES = {
  savanoriai:{
    nameLabel:"Savanorio vardas, pavardė",
    errName:"Įveskite savanorio vardą ir pavardę."
  },
  kuras:{
    nameLabel:"Vairuotojo vardas, pavardė",
    text:"Kelionės tikslas",
    ph:"Vežiau daiktus iš ... iki ...",
    errName:"Įveskite vairuotojo vardą ir pavardę.",
    errText:"Nurodykite kelionės tikslą."
  }
};
const modeOf = p => Object.assign({}, DEFAULT_MODE, (p && MODES[p.id]) || {});
const needsName = p => !!(p && MODES[p.id]);

// ---- demo backend (in memory) ----
const demo = { people:[
    {id:"irina_admin",name:"Irina Burkauskienė",role:"Admin",code:"1.4.3"},
    {id:"irina_koord",name:"Irina Burkauskienė",role:"Koord.",code:"1.2.1"},
    {id:"danguole",name:"Danguolė Juškevičienė",role:"",code:"1.3.2"},
    {id:"kristina_club",name:"Kristina Ulianskienė",role:"Club LT",code:"1.1.4"},
    {id:"kristina_soc",name:"Kristina Ulianskienė",role:"Soc.",code:"1.1.1"},
    {id:"savanoriai",name:"Savanoriai",role:"",code:""},
    {id:"kuras",name:"Kuras",role:"",code:"1.1.1"}], log:[] };
(function seed(){
  const ms = T.lastMonths(MONTHS_SHOWN, new Date());
  demo.people.forEach((p,pi)=>ms.forEach((m,mi)=>{
    for(let k=0;k<4;k++) demo.log.push({person:p.id,date:m+"-"+String(3+k*6).padStart(2,"0"),
      from:"10:00",to:T.fmt(600+60*(1+(pi+mi+k)%3)).padStart(5,"0"),min:60*(1+(pi+mi+k)%3)});
  }));
})();

async function api(payload){
  if (DEMO) {
    if (payload.action==="data") return {ok:true,people:demo.people,log:demo.log};
    const mins = T.toMin(payload.to)-T.toMin(payload.from);
    demo.log.push({person:payload.person,date:payload.date,from:payload.from,to:payload.to,min:mins,text:payload.text,vol:payload.vol});
    return {ok:true,min:mins};
  }
  const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({token},payload))});
  return r.json();
}
function askPin(){ return new Promise(res=>{
  $("pin").style.display="flex"; $("pinInput").value=""; $("pinInput").focus();
  const done=()=>{ const v=$("pinInput").value.trim(); if(!v) return;
    $("pin").style.display="none"; try{localStorage.setItem("pin",v)}catch(e){} res(v); };
  $("pinOk").onclick=done; $("pinInput").onkeydown=e=>{if(e.key==="Enter")done()};
});}
async function call(payload){
  if(!DEMO && !token) token = await askPin();
  let r = await api(payload);
  while(r && r.ok===false && r.error==="PIN"){ token = await askPin(); r = await api(payload); }
  return r;
}

async function load(){
  const r = await call({action:"data"});
  if(!r || !r.ok){ toast("Nepavyko įkelti duomenų"); return; }
  people = r.people; log = r.log;
  months = T.lastMonths(MONTHS_SHOWN, new Date());
  if(sel>=people.length) sel=0;
  renderNames(); renderTable(); renderStats();
}

// ---- simple statistics for managers ----
function colsHtml(items, fmtVal){
  const max=Math.max(1,...items.map(i=>i.value));
  return '<div class="cols">'+items.map((i,k)=>
    `<div class="col${k===items.length-1?" now":""}"><div class="val">${i.value>0?fmtVal(i.value):"–"}</div>`+
    `<div class="bar" style="height:${Math.round(i.value/max*135)}px"></div><div class="lbl">${i.label}</div></div>`).join("")+'</div>';
}
function renderStats(){
  const box=$("statsBody"); if(!months.length){box.innerHTML=""; return}
  const last=months[months.length-1], prev=months[months.length-2];
  const inM=log.filter(e=>months.includes(e.date.slice(0,7)));
  const sum=a=>a.reduce((s,e)=>s+e.min,0);
  const cur=inM.filter(e=>e.date.startsWith(last)), pre=inM.filter(e=>e.date.startsWith(prev));
  const diff=sum(cur)-sum(pre);
  const nameOf=e=>{ if(e.vol) return e.vol; const p=people.find(x=>x.id===e.person); return p?p.name:e.person; };
  const active=new Set(cur.map(nameOf)).size;
  const mCap=m=>{ const n=T.MONTHS_LT[+m.slice(5)-1]; return n.charAt(0).toUpperCase()+n.slice(1); };
  const mText=m=>mCap(m)+" "+m.slice(0,4);
  const mLabel=m=>mCap(m)+"<br>"+m.slice(0,4);
  const diffTxt=diff===0?"Tiek pat kaip praėjusį mėnesį":
    `<span class="${diff>0?"up":"down"}">${diff>0?"▲ +":"▼ −"}${T.fmt(Math.abs(diff))} val.</span> nei praėjusį mėnesį`;

  let h=`<div class="kpis">
    <div class="kpi"><b>${T.fmt(sum(inM))}</b><span>Iš viso valandų (${months.length} mėn.)</span></div>
    <div class="kpi"><b>${T.fmt(sum(cur))}</b><span>Šį mėnesį (${mText(last)})<br>${diffTxt}</span></div>
    <div class="kpi"><b>${cur.length}</b><span>Įrašų šį mėnesį</span></div>
    <div class="kpi"><b>${active}</b><span>Aktyvių žmonių šį mėnesį</span></div>
  </div>`;

  // hours per month
  h+=`<div class="stitle">Valandos pagal mėnesius</div><div class="shint">Kiek valandų buvo dirbta kiekvieną mėnesį. Žalias stulpelis – šis mėnuo.</div>`;
  h+=colsHtml(months.map(m=>({label:mLabel(m),value:sum(inM.filter(e=>e.date.startsWith(m)))})),T.fmt);

  // hours per PĮP action
  const byCode={};
  inM.forEach(e=>{ const p=people.find(x=>x.id===e.person); const k=p&&p.code?"PĮP "+p.code:"Savanoriai (be PĮP kodo)"; byCode[k]=(byCode[k]||0)+e.min; });
  const total=sum(inM), codes=Object.entries(byCode).sort((a,b)=>b[1]-a[1]), cmax=codes.length?codes[0][1]:1;
  h+=`<div class="stitle">Valandos pagal PĮP veiksmą</div><div class="shint">Kaip valandos pasiskirsto tarp projekto veiksmų.</div>`;
  h+=codes.map(([k,v])=>`<div class="hrow"><div>${k}</div><div class="track"><div class="fill" style="width:${Math.round(v/cmax*100)}%"></div></div>`+
    `<div class="num">${T.fmt(v)} <small>${total?Math.round(v/total*100):0}%</small></div></div>`).join("");

  // people per month (one ring per month)
  const COLORS=["#9fb0c2","#a8c3b0","#d9c3a5","#c9b8d3","#e0b9b0","#b3ccd3","#cfcab8"];
  const R=34, CI=2*Math.PI*R;
  h+=`<div class="stitle">Veikla pagal žmones ir mėnesius</div><div class="shint">Kiekvienas apskritimas – vienas mėnuo. Spalvos rodo, kas tą mėnesį dirbo; užveskite pelę (ar paspauskite) ant spalvos. Skaičius viduryje – bendros mėnesio valandos.</div><div class="dgrid">`;
  months.forEach(m=>{
    const es=inM.filter(e=>e.date.startsWith(m)), t=sum(es);
    let off=0, segs="";
    people.forEach((p,pi)=>{
      const v=sum(es.filter(e=>e.person===p.id)); if(!v) return;
      const len=v/t*CI;
      segs+=`<circle class="seg" cx="45" cy="45" r="${R}" fill="none" stroke="${COLORS[pi%COLORS.length]}" stroke-width="14" `+
        `stroke-dasharray="${Math.max(len-1.5,0.5)} ${CI}" stroke-dashoffset="${-off}" `+
        `data-n="${plain(p).replace(/"/g,"&quot;")}" data-h="${T.fmt(v)}" data-p="${Math.round(v/t*100)}"></circle>`;
      off+=len;
    });
    if(!t) segs=`<circle cx="45" cy="45" r="${R}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="14"></circle>`;
    h+=`<div class="dm"><svg width="90" height="90" viewBox="0 0 90 90"><g transform="rotate(-90 45 45)">${segs}</g>`+
       `<text x="45" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#5d6472">${t?T.fmt(t):"–"}</text></svg>`+
       `<b>${mCap(m)}</b><i>${m.slice(0,4)}</i></div>`;
  });
  h+=`</div><div class="dlegend">`+people.map((p,pi)=>
    inM.some(e=>e.person===p.id)?`<span><i style="background:${COLORS[pi%COLORS.length]}"></i>${label(p)}</span>`:"").join("")+`</div>`;
  box.innerHTML=h;
}

// tooltip for the rings (hover on desktop, tap on phone)
(function(){
  const tip=$("tip"), box=$("statsBody");
  const show=(el,x,y)=>{
    tip.innerHTML=`<b>${el.dataset.n}</b><br>${el.dataset.h} val.`;
    tip.classList.add("show"); move(x,y);
  };
  const move=(x,y)=>{ tip.style.left=Math.min(x+14,innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(y+14)+"px"; };
  box.addEventListener("mouseover",e=>{ if(e.target.classList&&e.target.classList.contains("seg")) show(e.target,e.clientX,e.clientY); });
  box.addEventListener("mousemove",e=>{ if(tip.classList.contains("show")) move(e.clientX,e.clientY); });
  box.addEventListener("mouseout",e=>{ if(e.target.classList&&e.target.classList.contains("seg")) tip.classList.remove("show"); });
  box.addEventListener("click",e=>{
    if(e.target.classList&&e.target.classList.contains("seg")) show(e.target,e.clientX,e.clientY);
    else tip.classList.remove("show");
  });
})();

// show/hide the name field and set labels for the selected person
function applyMode(){
  const p=people[sel], m=modeOf(p);
  $("volBox").style.display=needsName(p)?"flex":"none";
  $("volLabel").textContent=m.nameLabel||"";
  $("textLabel").textContent=m.text;
  $("text").placeholder=m.ph;
}

function renderNames(){
  const box=$("names"); box.innerHTML="";
  people.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="chip"+(i===sel?" on":"");
    b.innerHTML=`${p.name}<small>${p.role?"("+p.role+")":""}</small>`;
    b.onclick=()=>{sel=i;renderNames()};
    box.appendChild(b);
  });
  applyMode();
}
function duration(){
  const d=T.toMin($("to").value)-T.toMin($("from").value);
  $("dur").textContent=d>0?T.fmt(d):"0:00"; return d;
}
["from","to"].forEach(id=>$(id).addEventListener("input",duration));

function renderTable(){
  const S=T.summarize(people,log,months);
  let h="<thead><tr><th>Vardas</th>"+months.map(m=>`<th>${T.monthLabel(m).split(" ").reverse().join(" ")}</th>`).join("")+"<th class='tot'>Iš viso</th></tr></thead><tbody>";
  const col=months.map(()=>0); let grand=0;
  people.forEach((p,r)=>{
    const row=months.map(m=>S[p.id][m]); const t=row.reduce((a,b)=>a+b,0); grand+=t;
    row.forEach((v,i)=>col[i]+=v);
    h+=`<tr><td>${label(p)}</td>${row.map((v,i)=>v>0?`<td class="dl" data-r="${r}" data-m="${i}">${T.fmt(v)}</td>`:`<td>–</td>`).join("")}<td class="tot">${T.fmt(t)}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td>Iš viso</td>${col.map(v=>`<td>${T.fmt(v)}</td>`).join("")}<td>${T.fmt(grand)}</td></tr></tfoot>`;
  const t=$("tbl"); t.innerHTML=h;
  t.querySelectorAll("td.dl").forEach(td=>td.onclick=()=>download(people[+td.dataset.r],months[+td.dataset.m]));
}

async function download(p,month){
  const rows=T.rowsFor(log,p.id,month);
  if(!rows.length){toast("Šį mėnesį įrašų nėra");return}
  try{
    if(typeof ExcelJS==="undefined") throw new Error("ExcelJS");
    const tpl=await (await fetch("Template.xlsx")).arrayBuffer();
    const buf=await T.buildReport(ExcelJS,tpl,p,month,rows);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download=T.fileName(p,month); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("Atsisiųsta: "+T.fileName(p,month));
  }catch(e){ toast("Nepavyko sukurti ataskaitos"+(DEMO?" (peržiūroje nėra interneto / Template.xlsx)":"")); }
}

$("go").onclick=async()=>{
  const d=duration(), msg=$("msg");
  if(d<=0){msg.style.color="#b08a7a";msg.textContent="Įveskite laiką: „Iki“ turi būti vėlesnis nei „Nuo“.";return}
  if(!$("d").value){msg.style.color="#b08a7a";msg.textContent="Pasirinkite datą.";return}
  const p=people[sel], m=modeOf(p), date=$("d").value, from=$("from").value, to=$("to").value;
  const text=$("text").value.trim(), vol=$("vol").value.trim(), isVol=needsName(p);
  if(!text){msg.style.color="#b08a7a";msg.textContent=m.errText;return}
  if(isVol&&!vol){msg.style.color="#b08a7a";msg.textContent=m.errName;return}
  $("go").disabled=true; msg.style.color="#8d93a0"; msg.textContent="Saugoma…";
  try{
    const r=await call({action:"add",person:p.id,date,from,to,text,vol:isVol?vol:""});
    if(!r||!r.ok) throw new Error(r&&r.error||"klaida");
    msg.style.color="#7f9a86";
    msg.textContent=`Išsaugota: ${plain(p)}${isVol?" – "+vol:""} · ${date} · ${from}–${to} · ${T.fmt(d)} val.`;
    $("from").value="00:00"; $("to").value="00:00"; $("text").value=""; $("vol").value=""; duration();
    await load();
  }catch(e){ msg.style.color="#b08a7a"; msg.textContent="Nepavyko išsaugoti: "+e.message; }
  $("go").disabled=false;
};
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),3200); }

const now=new Date();
$("d").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
$("today").textContent=now.getFullYear()+" m. "+T.MONTHS_LT[now.getMonth()]+" "+now.getDate()+" d.";
$("note").textContent=DEMO?"Demonstracinė versija su pavyzdiniais duomenimis – niekas neišsaugoma":"";
load();
</script>
