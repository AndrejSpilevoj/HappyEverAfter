
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS Standalone Web App Setup (Eliminates permission prompts once saved to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Google">
  
  <title>Google</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }

    /* Google Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Moving Playing Card (80% width) */
    #playing-card {
      position: absolute;
      width: 80%; 
      height: auto;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
      opacity: 0; /* Hidden initially */
      transition: opacity 0.2s ease;
      filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Background Screen -->
    <img src="google-bg.jpg" class="bg-image" alt="Google Background">
    
    <!-- Floating Playing Card -->
    <img src="card.png" id="playing-card" alt="Playing Card">
  </div>

  <script>
    const card = document.getElementById('playing-card');
    const stage = document.getElementById('stage');

    let posX = 0, posY = 0;
    let velX = 0, velY = 0;
    let tiltX = 0, tiltY = 0;
    let neutralY = 90; // recalibrated at activation time to match this device
    let isActivated = false;
    let isWaitingForDelay = false;
    let delayTimer = null;
    let lastTap = 0;

    // Detect Double Tap anywhere on screen
    window.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        handleDoubleTap();
      }
      lastTap = currentTime;
    });

    function handleDoubleTap() {
      // Toggle off if double-tapped while active or during 4s delay
      if (isActivated || isWaitingForDelay) {
        clearTimeout(delayTimer);
        isWaitingForDelay = false;
        isActivated = false;
        card.style.opacity = '0';
        return;
      }

      // Silent orientation listener request for iOS
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            setupSensorsAndTimer();
          }
        }).catch(console.error);
      } else {
        setupSensorsAndTimer();
      }
    }

    function setupSensorsAndTimer() {
      window.addEventListener('deviceorientation', (e) => {
        tiltX = e.gamma || 0; 
        tiltY = e.beta || 0;  
      });

      isWaitingForDelay = true;

      // 4-second delay before card reveals
      delayTimer = setTimeout(() => {
        isWaitingForDelay = false;
        startMotion();
      }, 4000);
    }

    function startMotion() {
      // Force card to exact screen center upon appearance
      posX = (stage.clientWidth - card.clientWidth) / 2;
      posY = (stage.clientHeight - card.clientHeight) / 2;
      velX = 0;
      velY = 0;

      // Calibrate: whatever tilt the phone is reporting right now becomes
      // the "no gravity" reference point. This makes the effect work the
      // same regardless of how a given device/browser reports beta.
      neutralY = tiltY;

      isActivated = true;
      card.style.opacity = '1';

      requestAnimationFrame(updateCardPosition);
    }

    // --- Improved vertical gravity: single smooth curve, dead zone centered
    // on the calibrated holding angle (neutralY) instead of a fixed number ---
    function verticalForce(beta) {
      const NEUTRAL_DEADZONE = 8;   // no pull within +/-8 deg of calibrated angle
      const MAX_FORCE = 6;
      const RAMP_RANGE = 45;        // deviation needed to reach max force

      const delta = beta - neutralY;
      const absDelta = Math.abs(delta);
      if (absDelta <= NEUTRAL_DEADZONE) return 0;

      const t = Math.min((absDelta - NEUTRAL_DEADZONE) / RAMP_RANGE, 1);
      const eased = t * t; // gentle ramp, no sudden jump
      const magnitude = eased * MAX_FORCE;

      return delta > 0 ? magnitude : -magnitude;
    }

    function updateCardPosition() {
      if (!isActivated) return;

      let forceY = verticalForce(tiltY);
      let forceX = 0;

      // --- Horizontal Gravity Logic ---
      if (Math.abs(tiltX) > 3) {
        forceX = tiltX * 0.12;
      }

      // Apply motion forces
      velX += forceX;
      velY += forceY;

      // Low friction for smooth air-hockey feel
      velX *= 0.90;
      velY *= 0.90;

      posX += velX;
      posY += velY;

      // Screen edge boundaries with elastic bounce
      const maxX = stage.clientWidth - card.clientWidth;
      const maxY = stage.clientHeight - card.clientHeight;

      if (posX < 0) { posX = 0; velX *= -0.3; }
      if (posX > maxX) { posX = maxX; velX *= -0.3; }
      if (posY < 0) { posY = 0; velY *= -0.3; }
      if (posY > maxY) { posY = maxY; velY *= -0.3; }

      // Apply screen transformation
      card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${velX * 0.4}deg)`;

      requestAnimationFrame(updateCardPosition);
    }
  </script>
</body>
</html>
