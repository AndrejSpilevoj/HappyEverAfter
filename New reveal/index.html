<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card Motion Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }

    /* Google Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Moving Playing Card - 2x Larger (90% width) */
    #playing-card {
      position: absolute;
      width: 90%; 
      height: auto;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
      opacity: 0; /* Hidden until double tap */
      transition: opacity 0.2s ease;
      filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Google UI Background -->
    <img src="google-bg.jpg" class="bg-image" alt="Google Background">
    
    <!-- Floating Playing Card -->
    <img src="card.png" id="playing-card" alt="Playing Card">
  </div>

  <script>
    const card = document.getElementById('playing-card');
    const stage = document.getElementById('stage');

    let posX = 0, posY = 0;
    let velX = 0, velY = 0;
    let tiltX = 0, tiltY = 0;
    let isActivated = false;
    let lastTap = 0;

    // Detect Double Tap anywhere on screen
    window.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        // Double tap detected!
        if (!isActivated) {
          enableCardAndSensors();
        }
      }
      lastTap = currentTime;
    });

    async function enableCardAndSensors() {
      // Request permissions for iOS if needed
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            startMotion();
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        startMotion();
      }
    }

    function startMotion() {
      isActivated = true;
      card.style.opacity = '1'; // Make card visible

      // Center the card in the viewport
      posX = (stage.clientWidth - card.clientWidth) / 2;
      posY = (stage.clientHeight - card.clientHeight) / 2;

      window.addEventListener('deviceorientation', (e) => {
        tiltX = e.gamma || 0; // Left/Right tilt
        tiltY = e.beta || 0;  // Front/Back tilt
      });

      requestAnimationFrame(updateCardPosition);
    }

    function updateCardPosition() {
      if (!isActivated) return;

      // Stronger downward acceleration when holding phone at ~45 degree resting angle
      velX += tiltX * 0.25;
      velY += (tiltY - 30) * 0.35; 

      // Physics Friction
      velX *= 0.86;
      velY *= 0.86;

      posX += velX;
      posY += velY;

      // Boundaries (screen edges)
      const maxX = stage.clientWidth - card.clientWidth;
      const maxY = stage.clientHeight - card.clientHeight;

      if (posX < 0) { posX = 0; velX *= -0.3; }
      if (posX > maxX) { posX = maxX; velX *= -0.3; }
      if (posY < 0) { posY = 0; velY *= -0.3; }
      if (posY > maxY) { posY = maxY; velY *= -0.3; }

      // Apply screen transformation
      card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${velX * 0.4}deg)`;

      requestAnimationFrame(updateCardPosition);
    }
  </script>
</body>
</html>
