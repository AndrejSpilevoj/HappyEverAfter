<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS Standalone Web App Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Google">
  
  <title>Google</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }

    /* Google Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Moving Playing Card (80% width) */
    #playing-card {
      position: absolute;
      width: 80%; 
      height: auto;
      z-index: 2;
      pointer-events: auto;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.1s ease;
      filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
      touch-action: none;
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Background Screen -->
    <img src="google-bg.jpg" class="bg-image" alt="Google Background">
    
    <!-- Floating Playing Card -->
    <img src="card.png" id="playing-card" alt="Playing Card">
  </div>

  <script>
    const card = document.getElementById('playing-card');
    const stage = document.getElementById('stage');

    let posX = 0, posY = 0;
    let velX = 0, velY = 0;
    let tiltX = 0, tiltY = 0;
    let neutralY = 90;
    let isActivated = false;
    let isWaitingForDelay = false;
    let delayTimer = null;
    let lastTap = 0;
    let permissionGranted = false;
    let listenerAttached = false;

    // --- RESTORED THRESHOLD (25) ---
    // Requires a firm smash/hit to trigger, preventing table-drop false alarms.
    const SHAKE_THRESHOLD = 25; 

    // --- Touch Dragging Variables ---
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let initialCardX = 0, initialCardY = 0;
    let lastTouchX = 0, lastTouchY = 0;
    let lastTouchTime = 0;

    // Card Touch Events
    card.addEventListener('touchstart', (e) => {
      if (!isActivated) return;
      
      isDragging = true;
      const touch = e.touches[0];
      
      dragStartX = touch.clientX;
      dragStartY = touch.clientY;
      initialCardX = posX;
      initialCardY = posY;
      
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = performance.now();
      
      velX = 0;
      velY = 0;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || !isActivated) return;
      
      const touch = e.touches[0];
      const deltaX = touch.clientX - dragStartX;
      const deltaY = touch.clientY - dragStartY;
      
      posX = initialCardX + deltaX;
      posY = initialCardY + deltaY;
      
      const maxX = stage.clientWidth - card.clientWidth;
      const maxY = stage.clientHeight - card.clientHeight;
      
      posX = Math.max(0, Math.min(posX, maxX));
      posY = Math.min(posY, maxY); // Unbounded at top for finger dismiss

      const now = performance.now();
      const dt = (now - lastTouchTime) || 16;
      velX = ((touch.clientX - lastTouchX) / dt) * 12; 
      velY = ((touch.clientY - lastTouchY) / dt) * 12;

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = now;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
      }
    });

    // Detect Double Tap anywhere on screen to trigger delayed activation
    window.addEventListener('touchend', (e) => {
      if (isDragging) return;

      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        handleDoubleTap();
      } else {
        maybeRequestPermission();
      }
      lastTap = currentTime;
    });

    function maybeRequestPermission() {
      if (permissionGranted) return;

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            permissionGranted = true;
            attachOrientationListener();
          }
        }).catch(console.error);
      } else {
        permissionGranted = true;
        attachOrientationListener();
      }
    }

    function attachOrientationListener() {
      if (listenerAttached) return;
      listenerAttached = true;

      // Tilt listener
      window.addEventListener('deviceorientation', (e) => {
        tiltX = e.gamma || 0;
        tiltY = e.beta || 0;
      });

      // Impact/Smash listener
      window.addEventListener('devicemotion', (e) => {
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;

        const totalAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

        // Instant trigger on firm smash or sharp hit
        if (totalAccel > SHAKE_THRESHOLD && !isActivated) {
          triggerInstantReveal();
        }
      });
    }

    function handleDoubleTap() {
      if (isActivated || isWaitingForDelay) return;

      if (!permissionGranted) {
        maybeRequestPermission();
      }

      startDelayTimer();
    }

    function triggerInstantReveal() {
      clearTimeout(delayTimer);
      isWaitingForDelay = false;
      neutralY = tiltY || 90;
      startMotion();
    }

    function dismissCard() {
      clearTimeout(delayTimer);
      isWaitingForDelay = false;
      isActivated = false;
      card.style.opacity = '0';
    }

    function startDelayTimer() {
      isWaitingForDelay = true;
      delayTimer = setTimeout(() => {
        isWaitingForDelay = false;
        calibrateThenStart();
      }, 3000);
    }

    function calibrateThenStart() {
      const samples = [];
      const sampleDuration = 100;
      const startTime = performance.now();

      function collect() {
        samples.push(tiltY);
        if (performance.now() - startTime < sampleDuration) {
          requestAnimationFrame(collect);
        } else {
          const sum = samples.reduce((a, b) => a + b, 0);
          neutralY = sum / samples.length;
          startMotion();
        }
      }

      requestAnimationFrame(collect);
    }

    function startMotion() {
      posX = (stage.clientWidth - card.clientWidth) / 2;
      posY = (stage.clientHeight - card.clientHeight) / 2;
      
      // --- INSTANT DOWNWARD DROP ---
      // Initial vertical impulse forces the card to slide down immediately upon reveal
      velX = 0;
      velY = 12; 

      isActivated = true;
      card.style.opacity = '1';

      requestAnimationFrame(updateCardPosition);
    }

    // --- ONE-WAY DOWNWARD GRAVITY ---
    function verticalForce(beta) {
      const NEUTRAL_DEADZONE = 8;
      const MAX_FORCE = 6;
      const RAMP_RANGE = 45;

      const delta = beta - neutralY;
      
      // Safety Lock: Disallow all upward forces caused by device tilt
      if (delta <= NEUTRAL_DEADZONE) return 0;

      const t = Math.min((delta - NEUTRAL_DEADZONE) / RAMP_RANGE, 1);
      const eased = t * t;
      
      return eased * MAX_FORCE;
    }

    function updateCardPosition() {
      if (!isActivated) return;

      if (!isDragging) {
        let forceY = verticalForce(tiltY);
        let forceX = 0;

        if (Math.abs(tiltX) > 3) {
          forceX = tiltX * 0.12;
        }

        velX += forceX;
        velY += forceY;

        velX *= 0.90;
        velY *= 0.90;

        posX += velX;
        posY += velY;

        const maxX = stage.clientWidth - card.clientWidth;
        const maxY = stage.clientHeight - card.clientHeight;

        if (posX < 0) { posX = 0; velX *= -0.3; }
        if (posX > maxX) { posX = maxX; velX *= -0.3; }
        if (posY > maxY) { posY = maxY; velY *= -0.3; }

        // Dismiss trigger if pushed off top by finger
        if (posY < -card.clientHeight) {
          dismissCard();
          return;
        }
      }

      card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${velX * 0.4}deg)`;

      requestAnimationFrame(updateCardPosition);
    }
  </script>
</body>
</html>
