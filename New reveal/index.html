<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS Standalone Web App Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Google">
  
  <title>Google</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }

    /* Google Background Image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      -webkit-user-drag: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Moving Playing Card (80% width) */
    #playing-card {
      position: absolute;
      width: 80%; 
      height: auto;
      z-index: 2;
      pointer-events: auto; /* Enabled for direct touch/pull interactions */
      will-change: transform;
      opacity: 0; /* Hidden initially */
      transition: opacity 0.2s ease;
      filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
      touch-action: none; /* Prevents default browser scrolling when dragging the card */
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Background Screen -->
    <img src="google-bg.jpg" class="bg-image" alt="Google Background">
    
    <!-- Floating Playing Card -->
    <img src="card.png" id="playing-card" alt="Playing Card">
  </div>

  <script>
    const card = document.getElementById('playing-card');
    const stage = document.getElementById('stage');

    let posX = 0, posY = 0;
    let velX = 0, velY = 0;
    let tiltX = 0, tiltY = 0;
    let neutralY = 90; // Recalibrated at activation time to match device
    let isActivated = false;
    let isWaitingForDelay = false;
    let delayTimer = null;
    let lastTap = 0;
    let permissionGranted = false;
    let listenerAttached = false;

    // --- Touch Dragging Variables ---
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let initialCardX = 0, initialCardY = 0;
    let lastTouchX = 0, lastTouchY = 0;
    let lastTouchTime = 0;

    // --- Card Touch Events (Push/Pull directly with finger) ---
    card.addEventListener('touchstart', (e) => {
      if (!isActivated) return;
      
      isDragging = true;
      const touch = e.touches[0];
      
      // Save initial touch relative positions
      dragStartX = touch.clientX;
      dragStartY = touch.clientY;
      initialCardX = posX;
      initialCardY = posY;
      
      // Tracking for flick velocity
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = performance.now();
      
      // Pause inertia while user holds card
      velX = 0;
      velY = 0;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || !isActivated) return;
      
      const touch = e.touches[0];
      const deltaX = touch.clientX - dragStartX;
      const deltaY = touch.clientY - dragStartY;
      
      // Direct position update to follow finger
      posX = initialCardX + deltaX;
      posY = initialCardY + deltaY;
      
      // Constrain inside stage bounds while dragging
      const maxX = stage.clientWidth - card.clientWidth;
      const maxY = stage.clientHeight - card.clientHeight;
      posX = Math.max(0, Math.min(posX, maxX));
      posY = Math.max(0, Math.min(posY, maxY));

      // Calculate throwing velocity based on swipe speed
      const now = performance.now();
      const dt = (now - lastTouchTime) || 16;
      velX = ((touch.clientX - lastTouchX) / dt) * 12; 
      velY = ((touch.clientY - lastTouchY) / dt) * 12;

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = now;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
      }
    });

    // Detect Double Tap anywhere on screen
    window.addEventListener('touchend', (e) => {
      // Ignore double-tap check if ending a touch drag action
      if (isDragging) return;

      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        handleDoubleTap();
      } else {
        maybeRequestPermission();
      }
      lastTap = currentTime;
    });

    function maybeRequestPermission() {
      if (permissionGranted) return;

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            permissionGranted = true;
            attachOrientationListener();
          }
        }).catch(console.error);
      } else {
        // Non-iOS-13+ device
        permissionGranted = true;
        attachOrientationListener();
      }
    }

    function attachOrientationListener() {
      if (listenerAttached) return;
      listenerAttached = true;
      window.addEventListener('deviceorientation', (e) => {
        tiltX = e.gamma || 0;
        tiltY = e.beta || 0;
      });
    }

    function handleDoubleTap() {
      if (isActivated || isWaitingForDelay) {
        clearTimeout(delayTimer);
        isWaitingForDelay = false;
        isActivated = false;
        card.style.opacity = '0';
        return;
      }

      if (!permissionGranted) {
        maybeRequestPermission();
      }

      startDelayTimer();
    }

    function startDelayTimer() {
      isWaitingForDelay = true;

      // 4-second delay before card reveals
      delayTimer = setTimeout(() => {
        isWaitingForDelay = false;
        calibrateThenStart();
      }, 4000);
    }

    function calibrateThenStart() {
      const samples = [];
      const sampleDuration = 400; // ms
      const startTime = performance.now();

      function collect() {
        samples.push(tiltY);
        if (performance.now() - startTime < sampleDuration) {
          requestAnimationFrame(collect);
        } else {
          const sum = samples.reduce((a, b) => a + b, 0);
          neutralY = sum / samples.length;
          startMotion();
        }
      }

      requestAnimationFrame(collect);
    }

    function startMotion() {
      // Force card to exact screen center upon appearance
      posX = (stage.clientWidth - card.clientWidth) / 2;
      posY = (stage.clientHeight - card.clientHeight) / 2;
      velX = 0;
      velY = 0;

      isActivated = true;
      card.style.opacity = '1';

      requestAnimationFrame(updateCardPosition);
    }

    function verticalForce(beta) {
      const NEUTRAL_DEADZONE = 8;
      const MAX_FORCE = 6;
      const RAMP_RANGE = 45;

      const delta = beta - neutralY;
      const absDelta = Math.abs(delta);
      if (absDelta <= NEUTRAL_DEADZONE) return 0;

      const t = Math.min((absDelta - NEUTRAL_DEADZONE) / RAMP_RANGE, 1);
      const eased = t * t;
      const magnitude = eased * MAX_FORCE;

      return delta > 0 ? magnitude : -magnitude;
    }

    function updateCardPosition() {
      if (!isActivated) return;

      // Only apply gravity tilt forces when user is NOT dragging the card
      if (!isDragging) {
        let forceY = verticalForce(tiltY);
        let forceX = 0;

        // Horizontal Gravity Logic
        if (Math.abs(tiltX) > 3) {
          forceX = tiltX * 0.12;
        }

        // Apply motion forces
        velX += forceX;
        velY += forceY;

        // Air hockey friction
        velX *= 0.90;
        velY *= 0.90;

        posX += velX;
        posY += velY;

        // Screen edge boundaries with elastic bounce
        const maxX = stage.clientWidth - card.clientWidth;
        const maxY = stage.clientHeight - card.clientHeight;

        if (posX < 0) { posX = 0; velX *= -0.3; }
        if (posX > maxX) { posX = maxX; velX *= -0.3; }
        if (posY < 0) { posY = 0; velY *= -0.3; }
        if (posY > maxY) { posY = maxY; velY *= -0.3; }
      }

      // Render transformation on screen
      card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${velX * 0.4}deg)`;

      requestAnimationFrame(updateCardPosition);
    }
  </script>
</body>
</html>
