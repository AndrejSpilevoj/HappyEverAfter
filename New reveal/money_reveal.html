<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Google">

  <title>Google</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stage {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      pointer-events: none;
      -webkit-user-drag: none;
      z-index: 1;
    }

    /*
      The note is rotated 90 degrees.
      Its CSS height becomes its visible width.
      95vw makes the visible width approximately
      95% of the screen width.
    */
    #playing-card {
      position: absolute;
      top: 0;
      left: 0;
      width: auto;
      height: 95vw;
      max-width: none;
      max-height: none;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.1s ease;
      filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
      touch-action: none;
      -webkit-user-drag: none;
      transform-origin: center center;
    }

    #playing-card.visible {
      pointer-events: auto;
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="stage">
    <img src="google-bg.jpg" class="bg-image" alt="">
    <img src="card3.png" id="playing-card" alt="20 Euro Note" draggable="false">
  </div>

  <script>
    const card = document.getElementById('playing-card');
    const stage = document.getElementById('stage');

    let posX = 0;
    let posY = 0;
    let velX = 0;
    let velY = 0;

    let tiltX = 0;
    let tiltY = 0;
    let initialTiltX = 0;
    let initialTiltY = 0;

    let isActivated = false;
    let gravityActivated = false;
    let isDismissing = false;
    let isWaitingForDelay = false;
    let isDragging = false;
    let animationRunning = false;

    let delayTimer = null;
    let lastTap = 0;
    let permissionGranted = false;
    let listenerAttached = false;

    const SHAKE_THRESHOLD = 25;
    const REVEAL_DELAY = 3000;

    let dragStartX = 0;
    let dragStartY = 0;
    let initialCardX = 0;
    let initialCardY = 0;
    let lastTouchX = 0;
    let lastTouchY = 0;
    let lastTouchTime = 0;

    // Dimensions of the rotated note.
    // CSS height becomes visible width after rotation.
    function visibleWidth() {
      return card.offsetHeight;
    }

    function visibleHeight() {
      return card.offsetWidth;
    }

    function clampPosition() {
      const maxX = Math.max(0, stage.clientWidth - visibleWidth());
      const maxY = Math.max(0, stage.clientHeight - visibleHeight());

      posX = Math.max(0, Math.min(posX, maxX));
      posY = Math.max(0, Math.min(posY, maxY));
    }

    // posX and posY refer to the top-left of the
    // rotated note's visible bounding box.
    function renderCard() {
      const width = card.offsetWidth;
      const height = card.offsetHeight;

      const offsetX = (height - width) / 2;
      const offsetY = (width - height) / 2;

      card.style.transform =
        `translate3d(${posX + offsetX}px, ${posY + offsetY}px, 0) ` +
        `rotate(90deg) rotate(${velX * 0.1}deg)`;
    }

    // Ask for sensor permission on compatible iPhones.
    async function maybeRequestPermission() {
      if (permissionGranted) return;

      try {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          const result =
            await DeviceOrientationEvent.requestPermission();

          if (result !== 'granted') return;
        }

        if (
          typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function'
        ) {
          const result =
            await DeviceMotionEvent.requestPermission();

          if (result !== 'granted') {
            permissionGranted = true;
            attachOrientationListener();
            return;
          }
        }

        permissionGranted = true;
        attachOrientationListener();

      } catch (error) {
        console.warn('Motion permission unavailable:', error);
      }
    }

    function attachOrientationListener() {
      if (listenerAttached) return;
      listenerAttached = true;

      window.addEventListener('deviceorientation', (event) => {
        tiltX = event.gamma || 0;
        tiltY = event.beta || 0;
      });

      window.addEventListener('devicemotion', (event) => {
        const acc = event.accelerationIncludingGravity;
        if (!acc) return;

        const x = acc.x || 0;
        const y = acc.y || 0;
        const z = acc.z || 0;

        const totalAccel = Math.sqrt(x*x + y*y + z*z);

        if (
          totalAccel > SHAKE_THRESHOLD &&
          !isActivated &&
          !isWaitingForDelay
        ) {
          triggerInstantReveal();
        }
      });
    }

    // Double-tap to reveal after three seconds.
    stage.addEventListener('touchend', (event) => {
      if (isDragging || isActivated) return;

      const now = Date.now();
      const elapsed = now - lastTap;

      if (elapsed > 0 && elapsed < 300) {
        lastTap = 0;
        handleDoubleTap();
      } else {
        lastTap = now;
        maybeRequestPermission();
      }
    }, { passive: true });

    function handleDoubleTap() {
      if (isActivated || isWaitingForDelay) return;
      startDelayTimer();
    }

    function startDelayTimer() {
      isWaitingForDelay = true;

      clearTimeout(delayTimer);

      delayTimer = setTimeout(() => {
        isWaitingForDelay = false;
        startMotion();
      }, REVEAL_DELAY);
    }

    function triggerInstantReveal() {
      clearTimeout(delayTimer);
      isWaitingForDelay = false;
      startMotion();
    }

    function startMotion() {
      if (!card.complete || !card.naturalWidth) {
        card.addEventListener('load', startMotion, { once: true });
        return;
      }

      posX = (stage.clientWidth - visibleWidth()) / 2;
      posY = (stage.clientHeight - visibleHeight()) / 2;

      velX = 0;
      velY = 0;

      initialTiltX = tiltX;
      initialTiltY = tiltY;

      isActivated = true;
      gravityActivated = false;
      isDismissing = false;
      isDragging = false;

      clampPosition();

      card.classList.add('visible');
      renderCard();

      if (!animationRunning) {
        animationRunning = true;
        requestAnimationFrame(updateCardPosition);
      }
    }

    function dismissCard() {
      clearTimeout(delayTimer);

      isActivated = false;
      gravityActivated = false;
      isDismissing = false;
      isDragging = false;
      isWaitingForDelay = false;

      card.classList.remove('visible');
    }

    // Drag the note with your finger.
    card.addEventListener('touchstart', (event) => {
      if (!isActivated || isDismissing) return;

      event.preventDefault();

      gravityActivated = true;
      isDragging = true;

      const touch = event.touches[0];

      dragStartX = touch.clientX;
      dragStartY = touch.clientY;

      initialCardX = posX;
      initialCardY = posY;

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = performance.now();

      velX = 0;
      velY = 0;
    }, { passive: false });

    window.addEventListener('touchmove', (event) => {
      if (!isDragging || !isActivated || isDismissing) return;

      event.preventDefault();

      const touch = event.touches[0];

      posX = initialCardX + touch.clientX - dragStartX;
      posY = initialCardY + touch.clientY - dragStartY;

      const maxX = Math.max(0, stage.clientWidth - visibleWidth());
      posX = Math.max(0, Math.min(posX, maxX));

      const now = performance.now();
      const dt = Math.max(1, now - lastTouchTime);

      velX = ((touch.clientX - lastTouchX) / dt) * 12;
      velY = ((touch.clientY - lastTouchY) / dt) * 12;

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      lastTouchTime = now;

      if (posY < -visibleHeight() / 2) {
        isDragging = false;
        isDismissing = true;
        velY = Math.min(velY, -8);
      }

      renderCard();
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;

      isDragging = false;

      if (posY < -visibleHeight() / 2) {
        isDismissing = true;
        velY = Math.min(velY, -8);
      }
    });

    function verticalForce(beta) {
      const clampedBeta = Math.max(0, beta);

      return Math.sin(
        (clampedBeta / 90) * (Math.PI / 2)
      ) * 1.8;
    }

    function horizontalForce(gamma) {
      const DEADZONE = 12;
      const absGamma = Math.abs(gamma);

      if (absGamma <= DEADZONE) return 0;

      return (absGamma - DEADZONE) * Math.sign(gamma) * 0.28;
    }

    function updateCardPosition() {
      if (!isActivated) {
        animationRunning = false;
        return;
      }

      if (isDismissing) {
        posY += velY;

        if (posY < -visibleHeight()) {
          dismissCard();
          animationRunning = false;
          return;
        }
      } else if (!isDragging) {

        if (!gravityActivated) {
          if (
            Math.abs(tiltX - initialTiltX) > 3 ||
            Math.abs(tiltY - initialTiltY) > 3
          ) {
            gravityActivated = true;
          }
        }

        if (gravityActivated) {
          const forceX = horizontalForce(tiltX);
          const forceY = verticalForce(tiltY);

          velX += forceX;
          velY += forceY;

          // Gentle damping keeps the note controllable.
          velX *= forceX === 0 ? 0.70 : 0.92;
          velY *= 0.92;

          posX += velX;
          posY += velY;

          const maxX = Math.max(0, stage.clientWidth - visibleWidth());
          const maxY = Math.max(0, stage.clientHeight - visibleHeight());

          if (posX < 0) {
            posX = 0;
            velX *= -0.1;
          }

          if (posX > maxX) {
            posX = maxX;
            velX *= -0.1;
          }

          if (posY > maxY) {
            posY = maxY;
            velY = 0;
          }

          if (posY < -visibleHeight() / 2) {
            isDismissing = true;
            velY = Math.min(velY, -8);
          }
        }
      }

      renderCard();
      requestAnimationFrame(updateCardPosition);
    }

    window.addEventListener('resize', () => {
      if (!isActivated) return;
      clampPosition();
      renderCard();
    });

  </script>
</body>
</html>
