<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      touch-action: manipulation;
    }

    .top-bar {
      position: absolute;
      top: 44px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8e8e93;
    }

    .display-container {
      padding: 0 18px 8px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      width: 100%;
    }

    .expression {
      font-size: 28px;
      color: #8e8e93;
      min-height: 36px;
      white-space: nowrap;
      overflow-x: auto;
      width: 100%;
      text-align: right;
      scrollbar-width: none;
    }
    .expression::-webkit-scrollbar { display: none; }

    .main-display {
      font-size: 64px;
      font-weight: 300;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      width: 100%;
      text-align: right;
      letter-spacing: -0.5px;
      line-height: 1.1;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      touch-action: none;
    }

    /* Individual digits for the 0.5s fade-away animation */
    .digit-fade {
      display: inline-block;
      transition: opacity 0.5s ease;
      opacity: 1;
    }

    .digit-fade.faded {
      opacity: 0;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 8px 16px 36px 16px;
    }

    .btn {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      font-size: 32px;
      font-weight: 400;
      color: #fff;
      background-color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: filter 0.1s;
    }

    .btn:active {
      filter: brightness(140%);
    }

    .btn.gray {
      background-color: #505050;
      color: #fff;
    }

    .btn.orange {
      background-color: #ff9f0a;
      color: #fff;
      font-size: 36px;
    }

    .backspace-icon {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    </div>
    <div class="icon-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>
    </div>
  </div>

  <div class="display-container">
    <div class="expression" id="expression"></div>
    <div class="main-display" id="mainDisplay">0</div>
  </div>

  <div class="keypad">
    <button class="btn gray" onclick="handleBackspace()">
      <svg class="backspace-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
    </button>
    <button class="btn gray" id="clearBtn" onclick="handleClear()">AC</button>
    <button class="btn gray" onclick="handlePercent()">%</button>
    <button class="btn orange" onclick="handleOp('÷')">÷</button>

    <button class="btn" onclick="handleNumKey('7')">7</button>
    <button class="btn" onclick="handleNumKey('8')">8</button>
    <button class="btn" onclick="handleNumKey('9')">9</button>
    <button class="btn orange" onclick="handleOp('×')">×</button>

    <button class="btn" onclick="handleNumKey('4')">4</button>
    <button class="btn" onclick="handleNumKey('5')">5</button>
    <button class="btn" onclick="handleNumKey('6')">6</button>
    <button class="btn orange" onclick="handleOp('-')">-</button>

    <button class="btn" onclick="handleNumKey('1')">1</button>
    <button class="btn" onclick="handleNumKey('2')">2</button>
    <button class="btn" onclick="handleNumKey('3')">3</button>
    <button class="btn orange" onclick="handlePlus()">+</button>

    <button class="btn" onclick="handleToggleSign()">⁺/₋</button>
    <button class="btn" onclick="handleNumKey('0')">0</button>
    <button class="btn" onclick="handleComma()">,</button>
    <button class="btn orange" onclick="handleEquals()">=</button>
  </div>

<script>
  let currentNumStr = "0";
  let exprTokens = [];
  let waitingForNewNum = false;
  let stageArmed = false;
  let intermediateVal = 0;
  let forcedAddendStr = "";
  let forcedIndex = 0;
  let isShowingFinalResult = false; // Controls when touch-to-fade is active

  const mainDisplay = document.getElementById("mainDisplay");
  const expressionDisplay = document.getElementById("expression");
  const clearBtn = document.getElementById("clearBtn");

  function formatDisplayNumber(str) {
    if (str === "Error" || str === "NaN") return str;
    let parts = str.split(",");
    let integerPart = parts[0].replace(/\s/g, "");
    integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return parts.length > 1 ? integerPart + "," + parts[1] : integerPart;
  }

  function adjustFontSize() {
    let fontSize = 64;
    mainDisplay.style.fontSize = fontSize + "px";
    
    const containerWidth = mainDisplay.clientWidth;
    while (mainDisplay.scrollWidth > containerWidth && fontSize > 28) {
      fontSize -= 2;
      mainDisplay.style.fontSize = fontSize + "px";
    }
  }

  function updateDisplays() {
    const formatted = formatDisplayNumber(currentNumStr);

    if (isShowingFinalResult) {
      // Wrap each digit in a span to enable individual touch fading
      let html = "";
      for (let char of formatted) {
        if (char === " ") {
          html += `<span class="digit-fade" style="white-space: pre;"> </span>`;
        } else {
          html += `<span class="digit-fade">${char}</span>`;
        }
      }
      mainDisplay.innerHTML = html;
    } else {
      mainDisplay.innerText = formatted;
    }

    expressionDisplay.innerText = exprTokens.join("");

    adjustFontSize();

    expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;

    if (currentNumStr !== "0" || exprTokens.length > 0) {
      clearBtn.innerText = "C";
    } else {
      clearBtn.innerText = "AC";
    }
  }

  // --- TOUCH SLIDE TO FADE LOGIC (Active ONLY for Final Result) ---
  let isTouching = false;

  function fadeDigitAtPoint(clientX, clientY) {
    if (!isShowingFinalResult) return;
    const element = document.elementFromPoint(clientX, clientY);
    if (element && element.classList.contains("digit-fade")) {
      element.classList.add("faded");
    }
  }

  mainDisplay.addEventListener("touchstart", (e) => {
    if (!isShowingFinalResult) return;
    isTouching = true;
    fadeDigitAtPoint(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  mainDisplay.addEventListener("touchmove", (e) => {
    if (!isShowingFinalResult || !isTouching) return;
    fadeDigitAtPoint(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  mainDisplay.addEventListener("touchend", () => { isTouching = false; });
  mainDisplay.addEventListener("touchcancel", () => { isTouching = false; });

  // Mouse fallback for desktop testing
  mainDisplay.addEventListener("mousedown", (e) => {
    if (!isShowingFinalResult) return;
    isTouching = true;
    fadeDigitAtPoint(e.clientX, e.clientY);
  });

  mainDisplay.addEventListener("mousemove", (e) => {
    if (!isShowingFinalResult || !isTouching) return;
    fadeDigitAtPoint(e.clientX, e.clientY);
  });

  window.addEventListener("mouseup", () => { isTouching = false; });

  function getTargetTimestampPlusThirtySec() {
    const future = new Date(Date.now() + 30000);
    const YY = String(future.getFullYear()).slice(-2);
    const MM = String(future.getMonth() + 1).padStart(2, '0');
    const DD = String(future.getDate()).padStart(2, '0');
    const HH = String(future.getHours()).padStart(2, '0');
    const Min = String(future.getMinutes()).padStart(2, '0');

    return parseInt(`${YY}${MM}${DD}${HH}${Min}`, 10);
  }

  function handleNumKey(key) {
    isShowingFinalResult = false; // Reset fade state when new numbers are typed

    if (stageArmed) {
      if (forcedIndex < forcedAddendStr.length) {
        if (waitingForNewNum) {
          currentNumStr = forcedAddendStr[forcedIndex];
          waitingForNewNum = false;
        } else {
          currentNumStr += forcedAddendStr[forcedIndex];
        }
        forcedIndex++;
        updateDisplays();
      }
      return;
    }

    if (waitingForNewNum) {
      currentNumStr = key;
      waitingForNewNum = false;
    } else {
      currentNumStr = (currentNumStr === "0") ? key : currentNumStr + key;
    }
    updateDisplays();
  }

  function handleComma() {
    isShowingFinalResult = false;
    if (stageArmed) return;
    if (waitingForNewNum) {
      currentNumStr = "0,";
      waitingForNewNum = false;
    } else if (!currentNumStr.includes(",")) {
      currentNumStr += ",";
    }
    updateDisplays();
  }

  function handleOp(op) {
    isShowingFinalResult = false;
    if (stageArmed) return;
    exprTokens.push(formatDisplayNumber(currentNumStr));
    exprTokens.push(op);
    waitingForNewNum = true;
    updateDisplays();
  }

  function handlePlus() {
    isShowingFinalResult = false;
    if (stageArmed) return;

    let evalString = exprTokens.map(t => {
      if (t === "×") return "*";
      if (t === "÷") return "/";
      return t.replace(/\s/g, "").replace(",", ".");
    }).join("") + currentNumStr.replace(/\s/g, "").replace(",", ".");

    try {
      intermediateVal = Function('"use strict";return (' + evalString + ')')();
    } catch (e) {
      intermediateVal = 0;
    }

    let targetVal = getTargetTimestampPlusThirtySec();
    let addend = Math.abs(targetVal - intermediateVal);
    
    forcedAddendStr = String(addend);
    forcedIndex = 0;
    stageArmed = true;

    exprTokens.push(formatDisplayNumber(currentNumStr));
    exprTokens.push("+");
    waitingForNewNum = true;
    updateDisplays();
  }

  function handleEquals() {
    if (!stageArmed) {
      let evalString = exprTokens.map(t => {
        if (t === "×") return "*";
        if (t === "÷") return "/";
        return t.replace(/\s/g, "").replace(",", ".");
      }).join("") + currentNumStr.replace(/\s/g, "").replace(",", ".");

      try {
        let res = Function('"use strict";return (' + evalString + ')')();
        currentNumStr = String(res).replace(".", ",");
      } catch (e) {
        currentNumStr = "Error";
      }
      exprTokens = [];
      isShowingFinalResult = true; // Activate touch-to-fade effect on result
      updateDisplays();
      return;
    }

    if (forcedIndex < forcedAddendStr.length) {
      return;
    }

    let finalTarget = getTargetTimestampPlusThirtySec();

    exprTokens = [];
    currentNumStr = String(finalTarget).replace(".", ",");
    stageArmed = false;
    isShowingFinalResult = true; // Activate touch-to-fade effect on result
    updateDisplays();
  }

  function handleClear() {
    isShowingFinalResult = false;
    if (stageArmed) return;
    currentNumStr = "0";
    exprTokens = [];
    waitingForNewNum = false;
    stageArmed = false;
    forcedAddendStr = "";
    forcedIndex = 0;
    updateDisplays();
  }

  function handleBackspace() {
    isShowingFinalResult = false;
    if (stageArmed) return;
    if (currentNumStr.length > 1) {
      currentNumStr = currentNumStr.slice(0, -1);
    } else {
      currentNumStr = "0";
    }
    updateDisplays();
  }

  function handlePercent() {
    isShowingFinalResult = false;
    if (stageArmed) return;
    let val = parseFloat(currentNumStr.replace(/\s/g, "").replace(",", "."));
    currentNumStr = String(val / 100).replace(".", ",");
    updateDisplays();
  }

  function handleToggleSign() {
    isShowingFinalResult = false;
    if (stageArmed) return;
    if (currentNumStr !== "0") {
      if (currentNumStr.startsWith("-")) {
        currentNumStr = currentNumStr.substring(1);
      } else {
        currentNumStr = "-" + currentNumStr;
      }
    }
    updateDisplays();
  }

  window.addEventListener('resize', updateDisplays);
</script>

</body>
</html>
