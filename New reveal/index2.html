<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Critical for mobile scale and disabling unwanted double-tap zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Removes touch highlight box on iOS/Android */
      user-select: none; /* Prevents text selection while tapping */
      -webkit-user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      touch-action: manipulation; /* Optimizes for touch gestures */
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: #000;
      padding: 20px;
    }

    .display {
      font-size: 44px;
      text-align: right;
      margin-bottom: 20px;
      padding: 10px 15px;
      min-height: 80px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      word-break: break-all;
      color: #fff;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .btn {
      height: 72px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      background-color: #333;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      touch-action: manipulation;
    }

    .btn:active {
      filter: brightness(140%);
    }

    .btn.op {
      background-color: #ff9f0a;
      color: #fff;
    }

    .btn.gray {
      background-color: #a5a5a5;
      color: #000;
    }

    .btn.zero {
      grid-column: span 2;
      border-radius: 36px;
      justify-content: flex-start;
      padding-left: 28px;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="btn gray" onclick="handleClear()">AC</button>
    <button class="btn gray" onclick="handleBtn('±')">±</button>
    <button class="btn gray" onclick="handleBtn('%')">%</button>
    <button class="btn op" onclick="handleOp('÷')">÷</button>
    
    <button class="btn" onclick="handleNum('7')">7</button>
    <button class="btn" onclick="handleNum('8')">8</button>
    <button class="btn" onclick="handleNum('9')">9</button>
    <button class="btn op" onclick="handleOp('×')">×</button>
    
    <button class="btn" onclick="handleNum('4')">4</button>
    <button class="btn" onclick="handleNum('5')">5</button>
    <button class="btn" onclick="handleNum('6')">6</button>
    <button class="btn op" onclick="handleOp('-')">-</button>
    
    <button class="btn" onclick="handleNum('1')">1</button>
    <button class="btn" onclick="handleNum('2')">2</button>
    <button class="btn" onclick="handleNum('3')">3</button>
    <button class="btn op" onclick="handlePlus()">+</button>
    
    <button class="btn zero" onclick="handleNum('0')">0</button>
    <button class="btn" onclick="handleNum('.')">.</button>
    <button class="btn op" onclick="handleEquals()">=</button>
  </div>
</div>

<script>
  let currentDisplay = "0";
  let stageTrickArmed = false;

  // Prevent double-tap zoom delay on mobile devices
  document.addEventListener('touchend', function (event) {
    var now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, false);
  var lastTouchEnd = 0;

  function refreshDisplay() {
    document.getElementById("display").innerText = currentDisplay;
  }

  function handleNum(num) {
    if (currentDisplay === "0") {
      currentDisplay = num;
    } else {
      currentDisplay += num;
    }
    refreshDisplay();
  }

  function handleOp(op) {
    currentDisplay += " " + op + " ";
    refreshDisplay();
  }

  function handlePlus() {
    // When '+' is pressed, the magic force logic is armed
    stageTrickArmed = true;
    currentDisplay += " + ";
    refreshDisplay();
  }

  function handleClear() {
    currentDisplay = "0";
    stageTrickArmed = false;
    refreshDisplay();
  }

  function handleBtn(val) {
    currentDisplay += val;
    refreshDisplay();
  }

  function handleEquals() {
    if (stageTrickArmed) {
      // Generate live timestamp string (YYYYMMDDHHMM)
      const now = new Date();
      const YYYY = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const DD = String(now.getDate()).padStart(2, '0');
      const HH = String(now.getHours()).padStart(2, '0');
      const Min = String(now.getMinutes()).padStart(2, '0');

      currentDisplay = `${YYYY}${MM}${DD}${HH}${Min}`;
      stageTrickArmed = false;
    } else {
      // Standard evaluation backup if '+' wasn't used in trick flow
      try {
        let sanitized = currentDisplay.replace(/×/g, '*').replace(/÷/g, '/');
        currentDisplay = String(Function('"use strict";return (' + sanitized + ')')());
      } catch (e) {
        currentDisplay = "Error";
      }
    }
    refreshDisplay();
  }
</script>

</body>
</html>
