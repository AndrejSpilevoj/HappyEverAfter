<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>ChatGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-image: url('chatgpt-bg.png');
            background-size: 100% auto;
            background-repeat: repeat-y;
            background-position: top center;
            background-color: #ffffff;
        }

        .page-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Adjust this padding-top to move the video up or down to align with your background */
            padding-top: 15vh; 
        }

        .video-container {
            width: 100%;
            max-width: 600px; /* Limits max width on desktop so it looks like a phone screen, remove if you want it full width */
            position: relative;
        }

        video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
        }

        /* Fullscreen invisible touch trigger */
        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }

        .click-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="click-overlay" id="tapOverlay"></div>

    <div class="page-container">
        <div class="video-container">
            <video id="myVideo" src="Phone.mov#t=0.001" playsinline webkit-playsinline muted preload="auto"></video>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const overlay = document.getElementById('tapOverlay');

        overlay.addEventListener('click', () => {
            video.muted = false; // Enable audio
            video.play().then(() => {
                overlay.classList.add('hidden');
            }).catch(error => {
                console.log("Playback failed:", error);
            });
        });
    </script>

</body>
</html>
