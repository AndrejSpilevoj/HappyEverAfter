<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-image: url('chatgpt-bg.png');
            background-size: 100% auto;
            background-repeat: repeat-y;
            background-position: top center;
            background-color: #ffffff;
        }

        .video-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        video {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <video id="myVideo" src="Phone.mov#t=0.01" playsinline webkit-playsinline muted preload="auto"></video>
    </div>

    <script>
        const video = document.getElementById('myVideo');

        // Play video with audio on tap anywhere on the page
        document.body.addEventListener('click', () => {
            if (video.paused) {
                video.muted = false; // Enable audio upon user interaction
                video.play().catch(error => {
                    console.log("Playback failed:", error);
                });
            }
        });
    </script>

</body>
</html>
