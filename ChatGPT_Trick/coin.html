<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- iOS Standalone Web App Setup -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ChatGPT">

<title>ChatGPT</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

#stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: env(safe-area-inset-top, 0px);
    overflow: hidden;
}

/* ChatGPT Background Image */
.bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    -webkit-user-drag: none;
    pointer-events: none;
    z-index: 1;
}

/* Square Video Element filling maximum horizontal width and centered vertically */
#myVideo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    z-index: 2;
    pointer-events: auto;
    border: none;
    outline: none;
    background: transparent;
    -webkit-appearance: none;
}

/* Overlay Image (Coin) - Centered, scaled 36% with physics & anti-select styling */
#coinOverlay {
    position: absolute;
    width: 36%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    z-index: 3;
    pointer-events: auto;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.05s ease;
    filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
}
</style>
</head>
<body>

<div id="stage">
    <!-- Background Screen Template -->
    <img src="chatgpt-bg.png" class="bg-image" alt="ChatGPT Background">

    <!-- Square Video Element with Loop -->
    <video id="myVideo" src="Coin.mov#t=0.001" playsinline webkit-playsinline muted loop preload="auto"></video>

    <!-- Coin Image Overlay -->
    <img id="coinOverlay" src="coin.png" alt="Coin Overlay">
</div>

<!-- Audio Elements -->
<audio id="coinSound" src="coin.mp3" preload="auto"></audio>

<script>
const video = document.getElementById('myVideo');
const coin = document.getElementById('coinOverlay');
const coinSound = document.getElementById('coinSound');
const stage = document.getElementById('stage');

let posX = 0, posY = 0;
let velX = 0, velY = 0;
let tiltX = 0, tiltY = 0;
let isActivated = false;
let gravityActivated = true;
let isDismissing = false;
let isUnlockedForExit = false;
let permissionGranted = false;

// Interaction & Timer Variables
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let initialCoinX = 0, initialCoinY = 0;
let lastTouchX = 0, lastTouchY = 0;
let lastTouchTime = 0;
let lastTapTime = 0;
let revealDelayTimer = null;
let isWaitingForReveal = false;

const SHAKE_THRESHOLD = 25;

// Audio Pool for instant zero-latency bounce sounds (cling.mp3)
const clingPool = [];
for (let i = 0; i < 4; i++) {
    const audio = new Audio('cling.mp3');
    audio.preload = 'auto';
    clingPool.push(audio);
}
let clingPoolIndex = 0;

function playInstantCling() {
    const audio = clingPool[clingPoolIndex];
    clingPoolIndex = (clingPoolIndex + 1) % clingPool.length;
    audio.currentTime = 0;
    audio.play().catch(() => {});
}

// Request orientation and motion permissions for iOS on first user gesture
function requestSensorsPermission() {
    if (permissionGranted) return;

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
            if (response === 'granted') {
                permissionGranted = true;
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
            }
        }).catch(console.error);
    } else {
        permissionGranted = true;
        window.addEventListener('deviceorientation', handleOrientation);
        window.addEventListener('devicemotion', handleMotion);
    }
}

function handleOrientation(e) {
    tiltX = e.gamma || 0; // Left/Right tilt (-90 to 90)
    tiltY = e.beta || 0;  // Forward/Back tilt (-180 to 180)
}

function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;

    const totalAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

    if (totalAccel > SHAKE_THRESHOLD && !isActivated && !isWaitingForReveal) {
        startMotion();
    }
}

const handleFirstTouch = () => {
    if (video.paused) {
        video.muted = false;
        video.play().catch(error => console.log("Playback failed:", error));
    }
    // Unlock audio elements for iOS
    coinSound.play().then(() => { coinSound.pause(); coinSound.currentTime = 0; }).catch(() => {});
    clingPool.forEach(audio => {
        audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {});
    });

    requestSensorsPermission();
};

function playCoinSound() {
    coinSound.currentTime = 0;
    coinSound.play().catch(error => console.log("Audio play blocked:", error));
}

function startMotion() {
    if (isActivated) return;

    clearTimeout(revealDelayTimer);
    isWaitingForReveal = false;

    posX = (stage.clientWidth - coin.clientWidth) / 2;
    posY = (stage.clientHeight - coin.clientHeight) / 2;

    velX = 0;
    velY = 0;

    isActivated = true;
    gravityActivated = true;
    isDismissing = false;
    isUnlockedForExit = false; 
    
    playCoinSound();
    coin.style.opacity = '1';

    requestAnimationFrame(updateCoinPosition);
}

// Tap & Double-Tap Handling
window.addEventListener('touchend', (e) => {
    if (isDragging) return;

    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;

    if (tapLength < 300 && tapLength > 0) {
        if (!isActivated && !isWaitingForReveal) {
            isWaitingForReveal = true;
            clearTimeout(revealDelayTimer);
            revealDelayTimer = setTimeout(() => {
                isWaitingForReveal = false;
                startMotion();
            }, 2000);
        }
    } else {
        if (isActivated) {
            isUnlockedForExit = true;
        }
    }
    lastTapTime = currentTime;
});

// Touch & Drag Events
coin.addEventListener('touchstart', (e) => {
    if (!isActivated || isDismissing) return;

    isDragging = true;
    const touch = e.touches[0];

    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    initialCoinX = posX;
    initialCoinY = posY;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = performance.now();

    velX = 0;
    velY = 0;
}, { passive: true });

window.addEventListener('touchmove', (e) => {
    if (!isDragging || !isActivated || isDismissing) return;

    const touch = e.touches[0];
    const deltaX = touch.clientX - dragStartX;
    const deltaY = touch.clientY - dragStartY;

    posX = initialCoinX + deltaX;
    posY = initialCoinY + deltaY;

    const now = performance.now();
    const dt = (now - lastTouchTime) || 16;
    velX = ((touch.clientX - lastTouchX) / dt) * 8;
    velY = ((touch.clientY - lastTouchY) / dt) * 8;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = now;
}, { passive: true });

window.addEventListener('touchend', () => {
    if (isDragging) {
        isDragging = false;
    }
});

window.addEventListener('touchstart', handleFirstTouch, { once: true });
window.addEventListener('click', handleFirstTouch, { once: true });

function dismissCoin() {
    isActivated = false;
    isDismissing = false;
    coin.style.opacity = '0';
}

function updateCoinPosition() {
    if (!isActivated) return;

    const maxX = stage.clientWidth - coin.clientWidth;
    const maxY = stage.clientHeight - coin.clientHeight;

    if (isDismissing) {
        velX *= 1.04;
        velY *= 1.04;
        posX += velX;
        posY += velY;

        if (posX < -coin.clientWidth * 2 || posX > stage.clientWidth * 2 || posY < -coin.clientHeight * 2 || posY > stage.clientHeight * 2) {
            dismissCoin();
            return;
        }
    } else {
        if (!isDragging && gravityActivated) {
            const deadzone = 1.5;
            let forceX = 0;
            let forceY = 0;

            if (Math.abs(tiltX) > deadzone) {
                forceX = (Math.abs(tiltX) - deadzone) * Math.sign(tiltX) * 0.035;
            }
            if (Math.abs(tiltY) > deadzone) {
                forceY = (Math.abs(tiltY) - deadzone) * Math.sign(tiltY) * 0.035;
            }

            velX += forceX;
            velY += forceY;

            velX *= 0.91;
            velY *= 0.91;

            posX += velX;
            posY += velY;

            // Left Wall (Always bounces with instant cling sound)
            if (posX < 0) {
                posX = 0;
                if (Math.abs(velX) > 0.4) playInstantCling();
                velX *= -0.25;
            }

            if (!isUnlockedForExit) {
                if (posX > maxX) {
                    posX = maxX;
                    if (Math.abs(velX) > 0.4) playInstantCling();
                    velX *= -0.25;
                }
                if (posY < 0) {
                    posY = 0;
                    if (Math.abs(velY) > 0.4) playInstantCling();
                    velY *= -0.25;
                }
                if (posY > maxY) {
                    posY = maxY;
                    if (Math.abs(velY) > 0.4) playInstantCling();
                    velY *= -0.25;
                }
            } else {
                if (posX > maxX || posY < 0 || posY > maxY) {
                    isDismissing = true;
                }
            }
        }
    }

    coin.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${velX * 0.5}deg)`;

    requestAnimationFrame(updateCoinPosition);
}
</script>

</body>
</html>
