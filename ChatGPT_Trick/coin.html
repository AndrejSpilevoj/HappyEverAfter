<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- iOS Standalone Web App Setup -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ChatGPT">

<title>ChatGPT</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

#stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: env(safe-area-inset-top, 0px);
    overflow: hidden;
}

/* ChatGPT Background Image */
.bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    -webkit-user-drag: none;
    pointer-events: none;
    z-index: 1;
}

/* Square Video Element filling maximum horizontal width and centered vertically */
#myVideo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    z-index: 2;
    pointer-events: auto;
    border: none;
    outline: none;
    background: transparent;
    -webkit-appearance: none;
}

/* Overlay Image (Coin) */
#coinOverlay {
    position: absolute;
    width: 36%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    z-index: 3;
    pointer-events: auto;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.05s ease;
    filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
}
</style>
</head>
<body>

<div id="stage">
    <!-- Background Screen Template -->
    <img src="chatgpt-bg.png" class="bg-image" alt="ChatGPT Background">

    <!-- Square Video Element with Loop -->
    <video id="myVideo" src="Coin.mov#t=0.001" playsinline webkit-playsinline muted loop preload="auto"></video>

    <!-- Coin Image Overlay -->
    <img id="coinOverlay" src="coin.png" alt="Coin Overlay">
</div>

<script>
const video = document.getElementById('myVideo');
const coin = document.getElementById('coinOverlay');
const stage = document.getElementById('stage');

let posX = 0, posY = 0;
let velX = 0, velY = 0;
let tiltX = 0, tiltY = 0;
let isActivated = false;
let isDismissing = false;
let permissionGranted = false;

// Drag variables
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let initialCoinX = 0, initialCoinY = 0;
let lastTouchX = 0, lastTouchY = 0;
let lastTouchTime = 0;

// Long press reveal variables
let pressTimer = null;
let pressStartX = 0, pressStartY = 0;
let pressNowX = 0, pressNowY = 0;

const SHAKE_THRESHOLD = 25;
const LONG_PRESS_MS = 1500;     // hold this long on an empty spot to reveal the coin
const PRESS_MOVE_CANCEL = 10;   // px of finger movement that cancels the long press
const MIN_EXIT_SPEED = 8;       // px per frame, minimum speed when leaving through the top
const GRAVITY_STRENGTH = 0.055; // coin on glass: stronger than the card. Raise for faster sliding
const FRICTION = 0.93;          // closer to 1 = slides longer

// Wall contact tracking: a wall hit counts once per new touch, not while resting/sliding
const contact = { l: false, r: false, b: false };
const WALL_RELEASE = 4; // px the coin must move away before the wall "resets"

// Rotation physics (degrees per frame)
let angle = 0, angVel = 0;
const SPIN_DAMPING = 0.96;
const MAX_SPIN = 4;
const SPIN_DIR = { l: -1, r: 1, b: -1 };

function wallHit(side, vel, tangent) {
    if (!contact[side]) {
        contact[side] = true;
        angVel *= 0.2;
        angVel += SPIN_DIR[side] * tangent * 0.03;
    }
}

// Request orientation and motion permissions for iOS on first user gesture
function requestSensorsPermission() {
    if (permissionGranted) return;

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
            if (response === 'granted') {
                permissionGranted = true;
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
            }
        }).catch(console.error);
    } else {
        permissionGranted = true;
        window.addEventListener('deviceorientation', handleOrientation);
        window.addEventListener('devicemotion', handleMotion);
    }
}

function handleOrientation(e) {
    tiltX = e.gamma || 0; // Left/Right tilt
    tiltY = e.beta || 0;  // Forward/Back tilt
}

// Shake reveal: instant, centered
function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;

    const totalAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

    if (totalAccel > SHAKE_THRESHOLD && !isActivated) {
        cancelPress();
        startMotion();
    }
}

const handleFirstTouch = () => {
    if (video.paused) {
        video.play().catch(error => console.log("Playback failed:", error));
    }

    requestSensorsPermission();
};

// Reveal the coin. With a finger position it appears under the finger and follows it.
function startMotion(fingerX, fingerY) {
    if (isActivated) return;

    const maxX = stage.clientWidth - coin.clientWidth;
    const maxY = stage.clientHeight - coin.clientHeight;

    velX = 0;
    velY = 0;
    contact.l = contact.r = contact.b = false;
    angle = 0;
    angVel = 0;
    isDismissing = false;

    if (fingerX !== undefined) {
        const rect = stage.getBoundingClientRect();
        posX = fingerX - rect.left - coin.clientWidth / 2;
        posY = fingerY - rect.top - coin.clientHeight / 2;
        // Keep the coin inside the screen if the finger is near an edge
        posX = Math.max(0, Math.min(posX, maxX));
        posY = Math.max(0, Math.min(posY, maxY));

        // Follow the finger right away
        isDragging = true;
        dragStartX = fingerX;
        dragStartY = fingerY;
        initialCoinX = posX;
        initialCoinY = posY;
        lastTouchX = fingerX;
        lastTouchY = fingerY;
        lastTouchTime = performance.now();
    } else {
        posX = maxX / 2;
        posY = maxY / 2;
    }

    isActivated = true;
    coin.style.opacity = '1';

    requestAnimationFrame(updateCoinPosition);
}

// ---- Long press reveal ----
function cancelPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
}

window.addEventListener('touchstart', (e) => {
    if (isActivated) return;
    if (e.touches.length !== 1) { cancelPress(); return; }

    const t = e.touches[0];
    pressStartX = pressNowX = t.clientX;
    pressStartY = pressNowY = t.clientY;

    cancelPress();
    pressTimer = setTimeout(() => {
        pressTimer = null;
        startMotion(pressNowX, pressNowY);
    }, LONG_PRESS_MS);
}, { passive: true });

window.addEventListener('touchmove', (e) => {
    if (!pressTimer) return;
    const t = e.touches[0];
    pressNowX = t.clientX;
    pressNowY = t.clientY;
    if (Math.hypot(pressNowX - pressStartX, pressNowY - pressStartY) > PRESS_MOVE_CANCEL) {
        cancelPress();
    }
}, { passive: true });

// ---- Touch & Drag on the coin ----
coin.addEventListener('touchstart', (e) => {
    if (!isActivated || isDismissing) return;

    isDragging = true;
    const touch = e.touches[0];

    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    initialCoinX = posX;
    initialCoinY = posY;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = performance.now();

    velX = 0;
    velY = 0;
}, { passive: true });

window.addEventListener('touchmove', (e) => {
    if (!isDragging || !isActivated || isDismissing) return;

    const touch = e.touches[0];
    const deltaX = touch.clientX - dragStartX;
    const deltaY = touch.clientY - dragStartY;

    const maxX = stage.clientWidth - coin.clientWidth;
    const maxY = stage.clientHeight - coin.clientHeight;

    posX = Math.max(0, Math.min(initialCoinX + deltaX, maxX));
    posY = Math.min(initialCoinY + deltaY, maxY); // top is open: dragging out dismisses

    const now = performance.now();
    const dt = (now - lastTouchTime) || 16;
    velX = ((touch.clientX - lastTouchX) / dt) * 8;
    velY = ((touch.clientY - lastTouchY) / dt) * 8;

    // Flicking the coin gives it spin (direction follows horizontal flick)
    angVel += velX * 0.01;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = now;

    // Dragged past halfway off the top: auto exit
    if (posY < -coin.clientHeight / 2) {
        startDismiss();
    }
}, { passive: true });

function releaseTouch() {
    cancelPress();
    if (isDragging) {
        isDragging = false;
        // Released past halfway off the top: auto exit
        if (isActivated && posY < -coin.clientHeight / 2) {
            startDismiss();
        }
    }
}
window.addEventListener('touchend', releaseTouch);
window.addEventListener('touchcancel', releaseTouch);

window.addEventListener('touchstart', handleFirstTouch, { once: true });
window.addEventListener('click', handleFirstTouch, { once: true });

function startDismiss() {
    isDragging = false;
    isDismissing = true;
    velX = 0;
    velY = Math.min(velY, -MIN_EXIT_SPEED); // keep a faster flick, otherwise minimum push
}

function dismissCoin() {
    isActivated = false;
    isDismissing = false;
    isDragging = false;
    coin.style.opacity = '0';
}

function updateCoinPosition() {
    if (!isActivated) return;

    const maxX = stage.clientWidth - coin.clientWidth;
    const maxY = stage.clientHeight - coin.clientHeight;

    if (isDismissing) {
        // Constant speed out through the top, no gravity or friction
        posY += velY;

        if (posY < -coin.clientHeight) {
            dismissCoin();
            return;
        }
    } else if (!isDragging) {
        // Gravity is always on; the finger overrides it while dragging
        const deadzone = 1.5;
        let forceX = 0;
        let forceY = 0;

        if (Math.abs(tiltX) > deadzone) {
            forceX = (Math.abs(tiltX) - deadzone) * Math.sign(tiltX) * GRAVITY_STRENGTH;
        }
        if (Math.abs(tiltY) > deadzone) {
            forceY = (Math.abs(tiltY) - deadzone) * Math.sign(tiltY) * GRAVITY_STRENGTH;
        }

        velX += forceX;
        velY += forceY;

        velX *= FRICTION;
        velY *= FRICTION;

        posX += velX;
        posY += velY;

        // Continuous wall friction: sliding along a wall keeps nudging the spin
        if (contact.l) angVel += SPIN_DIR.l * velY * 0.01;
        if (contact.r) angVel += SPIN_DIR.r * velY * 0.01;
        if (contact.b) angVel += SPIN_DIR.b * velX * 0.01;

        // Subtle spin only while flying free
        if (!(contact.l || contact.r || contact.b)) {
            angVel += velX * 0.006;
        }

        // Left wall
        if (posX < 0) {
            posX = 0;
            wallHit('l', velX, velY);
            velX *= -0.25;
        } else if (posX > WALL_RELEASE) {
            contact.l = false;
        }

        // Right wall
        if (posX > maxX) {
            posX = maxX;
            wallHit('r', velX, velY);
            velX *= -0.25;
        } else if (posX < maxX - WALL_RELEASE) {
            contact.r = false;
        }

        // Bottom wall
        if (posY > maxY) {
            posY = maxY;
            wallHit('b', velY, velX);
            velY *= -0.25;
        } else if (posY < maxY - WALL_RELEASE) {
            contact.b = false;
        }

        // Top is the exit: past halfway off the top starts the auto exit
        if (posY < -coin.clientHeight / 2) {
            startDismiss();
        }
    }

    // Spin momentum: decays slowly (glass friction)
    const touchingWall = contact.l || contact.r || contact.b;
    angVel *= touchingWall ? 0.88 : SPIN_DAMPING;
    if (angVel > MAX_SPIN) angVel = MAX_SPIN;
    if (angVel < -MAX_SPIN) angVel = -MAX_SPIN;
    if (Math.abs(angVel) < 0.01) angVel = 0;
    angle = (angle + angVel) % 360;

    coin.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${angle}deg)`;

    requestAnimationFrame(updateCoinPosition);
}
</script>

</body>
</html>
