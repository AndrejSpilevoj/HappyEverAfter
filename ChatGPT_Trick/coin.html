<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- iOS Standalone Web App Setup -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ChatGPT">

<title>ChatGPT</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

#stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: env(safe-area-inset-top, 0px);
    overflow: hidden;
}

/* ChatGPT Background Image */
.bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    -webkit-user-drag: none;
    pointer-events: none;
    z-index: 1;
}

/* Square Video Element filling maximum horizontal width and centered vertically */
#myVideo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    z-index: 2;
    pointer-events: auto;
    border: none;
    outline: none;
    background: transparent;
    -webkit-appearance: none;
}

/* Overlay Image (Coin) - Centered, scaled 36% with physics & anti-select styling */
#coinOverlay {
    position: absolute;
    width: 36%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    z-index: 3;
    pointer-events: auto;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.05s ease;
    filter: drop-shadow(0px 12px 20px rgba(0,0,0,0.35));
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
}
</style>
</head>
<body>

<div id="stage">
    <!-- Background Screen Template -->
    <img src="chatgpt-bg.png" class="bg-image" alt="ChatGPT Background">

    <!-- Square Video Element with Loop -->
    <video id="myVideo" src="Coin.mov#t=0.001" playsinline webkit-playsinline muted loop preload="auto"></video>

    <!-- Coin Image Overlay -->
    <img id="coinOverlay" src="coin.png" alt="Coin Overlay">
</div>

<script>
const video = document.getElementById('myVideo');
const coin = document.getElementById('coinOverlay');
const stage = document.getElementById('stage');

let posX = 0, posY = 0;
let velX = 0, velY = 0;
let tiltX = 0, tiltY = 0;
let isActivated = false;
let gravityActivated = true;
let isDismissing = false;
let isUnlockedForExit = false;
let permissionGranted = false;

// Interaction & Timer Variables
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let initialCoinX = 0, initialCoinY = 0;
let lastTouchX = 0, lastTouchY = 0;
let lastTouchTime = 0;
let lastTapTime = 0;
let revealDelayTimer = null;
let isWaitingForReveal = false;

const SHAKE_THRESHOLD = 25;
const HOLD_TO_RELEASE_MS = 1500; // hold the coin this long to "break the walls"
const EXIT_SOUND_VISIBLE = 0.10; // play coin.mp3 when only this fraction is still visible
let holdTimer = null;
let exitSoundPlayed = false;

// ---- Web Audio: cling.mp3 decoded once, plays with minimal latency ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx({ latencyHint: 'interactive' });
let clingBuffer = null;

fetch('cling.mp3')
    .then(r => r.arrayBuffer())
    .then(data => new Promise((res, rej) => audioCtx.decodeAudioData(data, res, rej)))
    .then(buf => { clingBuffer = buf; })
    .catch(err => console.error('cling.mp3 load failed:', err));

let coinBuffer = null;

fetch('coin.mp3')
    .then(r => r.arrayBuffer())
    .then(data => new Promise((res, rej) => audioCtx.decodeAudioData(data, res, rej)))
    .then(buf => { coinBuffer = buf; })
    .catch(err => console.error('coin.mp3 load failed:', err));

function playBuffer(buffer) {
    if (!buffer) return;
    if (audioCtx.state !== 'running') audioCtx.resume();
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.start(0);
}

function playInstantCling() { playBuffer(clingBuffer); }
function playExitSound() { playBuffer(coinBuffer); }

// Wall contact tracking: cling plays once per new touch, not while resting/sliding
const contact = { l: false, r: false, t: false, b: false };
const WALL_RELEASE = 4; // px the coin must move away before the wall "resets"

// Rotation physics (degrees per frame)
let angle = 0, angVel = 0;
const SPIN_DAMPING = 0.96; // closer to 1 = spins longer
const MAX_SPIN = 4;
const SPIN_DIR = { l: -1, r: 1, t: 1, b: -1 }; // wall friction spin direction

function wallHit(side, vel, tangent) {
    if (!contact[side]) {
        contact[side] = true;
        const speed = Math.abs(vel);
        if (speed > 0.4) playInstantCling();
        // Hitting a wall stops most of the spin; only a tiny bit from sliding
        angVel *= 0.2;
        angVel += SPIN_DIR[side] * tangent * 0.03;
    }
}

// Request orientation and motion permissions for iOS on first user gesture
function requestSensorsPermission() {
    if (permissionGranted) return;

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
            if (response === 'granted') {
                permissionGranted = true;
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
            }
        }).catch(console.error);
    } else {
        permissionGranted = true;
        window.addEventListener('deviceorientation', handleOrientation);
        window.addEventListener('devicemotion', handleMotion);
    }
}

function handleOrientation(e) {
    tiltX = e.gamma || 0; // Left/Right tilt (-90 to 90)
    tiltY = e.beta || 0;  // Forward/Back tilt (-180 to 180)
}

function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;

    const totalAccel = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);

    if (totalAccel > SHAKE_THRESHOLD && !isActivated && !isWaitingForReveal) {
        startMotion();
    }
}

const handleFirstTouch = () => {
    if (video.paused) {
        video.muted = false;
        video.play().catch(error => console.log("Playback failed:", error));
    }
    audioCtx.resume(); // unlock Web Audio on iOS

    requestSensorsPermission();
};

function playCoinSound() {
    playInstantCling(); // coin appearing now uses cling.mp3
}

function startMotion() {
    if (isActivated) return;

    clearTimeout(revealDelayTimer);
    isWaitingForReveal = false;

    posX = (stage.clientWidth - coin.clientWidth) / 2;
    posY = (stage.clientHeight - coin.clientHeight) / 2;

    velX = 0;
    velY = 0;
    contact.l = contact.r = contact.t = contact.b = false;
    angle = 0;
    angVel = 0;

    isActivated = true;
    gravityActivated = true;
    isDismissing = false;
    isUnlockedForExit = false;
    exitSoundPlayed = false;

    clearTimeout(holdTimer);

    playCoinSound();
    coin.style.opacity = '1';

    requestAnimationFrame(updateCoinPosition);
}

// Tap & Double-Tap Handling
window.addEventListener('touchend', (e) => {
    if (isDragging) return;

    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;

    if (tapLength < 300 && tapLength > 0) {
        if (!isActivated) {
            startMotion(); // reveal instantly on double tap
        }
    }
    lastTapTime = currentTime;
});

// Touch & Drag Events
coin.addEventListener('touchstart', (e) => {
    if (!isActivated || isDismissing) return;

    isDragging = true;
    const touch = e.touches[0];

    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    initialCoinX = posX;
    initialCoinY = posY;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = performance.now();

    velX = 0;
    velY = 0;

    // Holding the coin long enough breaks the walls
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { isUnlockedForExit = true; }, HOLD_TO_RELEASE_MS);
}, { passive: true });

window.addEventListener('touchmove', (e) => {
    if (!isDragging || !isActivated || isDismissing) return;

    const touch = e.touches[0];
    const deltaX = touch.clientX - dragStartX;
    const deltaY = touch.clientY - dragStartY;

    posX = initialCoinX + deltaX;
    posY = initialCoinY + deltaY;

    const now = performance.now();
    const dt = (now - lastTouchTime) || 16;
    velX = ((touch.clientX - lastTouchX) / dt) * 8;
    velY = ((touch.clientY - lastTouchY) / dt) * 8;

    // Flicking the coin gives it spin (direction follows horizontal flick)
    angVel += velX * 0.01;

    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    lastTouchTime = now;
}, { passive: true });

function releaseTouch() {
    clearTimeout(holdTimer); // released before 1.5s: walls stay
    isDragging = false;
}
window.addEventListener('touchend', releaseTouch);
window.addEventListener('touchcancel', releaseTouch);

window.addEventListener('touchstart', handleFirstTouch, { once: true });
window.addEventListener('click', handleFirstTouch, { once: true });

function dismissCoin() {
    isActivated = false;
    isDismissing = false;
    coin.style.opacity = '0';
}

function updateCoinPosition() {
    if (!isActivated) return;

    const maxX = stage.clientWidth - coin.clientWidth;
    const maxY = stage.clientHeight - coin.clientHeight;

    if (isDismissing) {
        velX *= 1.04;
        velY *= 1.04;
        posX += velX;
        posY += velY;

        // Play coin.mp3 once, when only the last 10% of the coin is visible
        if (!exitSoundPlayed) {
            const w = coin.clientWidth, h = coin.clientHeight;
            const visW = Math.max(0, Math.min(posX + w, stage.clientWidth) - Math.max(posX, 0));
            const visH = Math.max(0, Math.min(posY + h, stage.clientHeight) - Math.max(posY, 0));
            if ((visW * visH) / (w * h) <= EXIT_SOUND_VISIBLE) {
                exitSoundPlayed = true;
                playExitSound();
            }
        }

        if (posX < -coin.clientWidth * 2 || posX > stage.clientWidth * 2 || posY < -coin.clientHeight * 2 || posY > stage.clientHeight * 2) {
            dismissCoin();
            return;
        }
    } else {
        if (!isDragging && gravityActivated) {
            const deadzone = 1.5;
            let forceX = 0;
            let forceY = 0;

            if (Math.abs(tiltX) > deadzone) {
                forceX = (Math.abs(tiltX) - deadzone) * Math.sign(tiltX) * 0.035;
            }
            if (Math.abs(tiltY) > deadzone) {
                forceY = (Math.abs(tiltY) - deadzone) * Math.sign(tiltY) * 0.035;
            }

            velX += forceX;
            velY += forceY;

            velX *= 0.91;
            velY *= 0.91;

            posX += velX;
            posY += velY;

            // Continuous wall friction: sliding along a wall keeps nudging the spin
            if (contact.l) angVel += SPIN_DIR.l * velY * 0.01;
            if (contact.r) angVel += SPIN_DIR.r * velY * 0.01;
            if (contact.t) angVel += SPIN_DIR.t * velX * 0.01;
            if (contact.b) angVel += SPIN_DIR.b * velX * 0.01;

            // Subtle spin only while flying free (not touching any wall)
            if (!(contact.l || contact.r || contact.t || contact.b)) {
                angVel += velX * 0.006;
            }

            // Left Wall (cling only on a NEW contact)
            if (posX < 0) {
                posX = 0;
                wallHit('l', velX, velY);
                velX *= -0.25;
            } else if (posX > WALL_RELEASE) {
                contact.l = false;
            }

            if (!isUnlockedForExit) {
                if (posX > maxX) {
                    posX = maxX;
                    wallHit('r', velX, velY);
                    velX *= -0.25;
                } else if (posX < maxX - WALL_RELEASE) {
                    contact.r = false;
                }
                if (posY < 0) {
                    posY = 0;
                    wallHit('t', velY, velX);
                    velY *= -0.25;
                } else if (posY > WALL_RELEASE) {
                    contact.t = false;
                }
                if (posY > maxY) {
                    posY = maxY;
                    wallHit('b', velY, velX);
                    velY *= -0.25;
                } else if (posY < maxY - WALL_RELEASE) {
                    contact.b = false;
                }
            } else {
                if (posX > maxX || posY < 0 || posY > maxY) {
                    isDismissing = true;
                }
            }
        }
    }

    // Spin momentum: decays slowly (glass friction)
    const touchingWall = contact.l || contact.r || contact.t || contact.b;
    angVel *= touchingWall ? 0.88 : SPIN_DAMPING; // wall friction kills spin fast
    if (angVel > MAX_SPIN) angVel = MAX_SPIN;
    if (angVel < -MAX_SPIN) angVel = -MAX_SPIN;
    if (Math.abs(angVel) < 0.01) angVel = 0;
    angle = (angle + angVel) % 360;

    coin.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${angle}deg)`;

    requestAnimationFrame(updateCoinPosition);
}
</script>

</body>
</html>
