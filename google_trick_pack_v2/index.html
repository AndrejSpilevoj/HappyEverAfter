<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: env(safe-area-inset-top, 0px);
    overflow: hidden;
  }
  #stage img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #before {
    z-index: 2;
    opacity: 1;
  }
  #reveal {
    z-index: 1;
    opacity: 1;
  }
  #before.hidden {
    opacity: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="reveal" src="reveal2.jpg" alt="">
  <img id="before" src="before.png" alt="">
</div>

<script>
  var lastTap = 0;
  var lastToggle = 0;
  var pendingReveal = false;

  function toggleReveal() {
    var now = Date.now();
    if (now - lastToggle < 400 || pendingReveal) return;
    lastToggle = now;

    var before = document.getElementById('before');

    if (!before.classList.contains('hidden')) {
      // currently showing photo 1 -> reveal photo 2 after 3s delay
      pendingReveal = true;
      setTimeout(function () {
        before.classList.add('hidden');
        pendingReveal = false;
      }, 3000);
    } else {
      // currently showing photo 2 -> flip back to photo 1 instantly
      before.classList.remove('hidden');
    }
  }

  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTap < 350) {
      e.preventDefault();
      toggleReveal();
    }
    lastTap = now;
  }, { passive: false });

  document.addEventListener('dblclick', function (e) {
    e.preventDefault();
    toggleReveal();
  });
</script>
</body>
</html>
