<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: env(safe-area-inset-top, 0px);
    overflow: hidden;
  }
  #stage img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #before {
    z-index: 2;
    opacity: 1;
  }
  #reveal {
    z-index: 1;
    opacity: 1;
  }
  #before.hidden {
    opacity: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="reveal" src="reveal3.jpg" alt="">
  <img id="before" src="before.png" alt="">
</div>

<script>
  var holdTimer = null;
  var pendingReveal = false;
  var HOLD_DURATION = 1200; // ms to hold before triggering

  function startHold(e) {
    e.preventDefault();
    if (holdTimer || pendingReveal) return;
    holdTimer = setTimeout(function () {
      holdTimer = null;
      toggleReveal();
    }, HOLD_DURATION);
  }

  function cancelHold(e) {
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = null;
    }
  }

  function toggleReveal() {
    var before = document.getElementById('before');

    if (!before.classList.contains('hidden')) {
      // showing photo 1 -> reveal photo 2 after 3s delay, instantly
      pendingReveal = true;
      setTimeout(function () {
        before.style.transition = 'none';
        before.classList.add('hidden');
        pendingReveal = false;
      }, 3000);
    } else {
      // showing photo 2 -> dissolve back to photo 1 over 2.5s
      before.style.transition = 'opacity 2.5s ease';
      before.classList.remove('hidden');
    }
  }

  document.addEventListener('touchstart', startHold, { passive: false });
  document.addEventListener('touchend', cancelHold, { passive: false });
  document.addEventListener('touchmove', cancelHold, { passive: false });
  document.addEventListener('touchcancel', cancelHold, { passive: false });

  // Fallback for mouse (laptop preview)
  document.addEventListener('mousedown', startHold);
  document.addEventListener('mouseup', cancelHold);
  document.addEventListener('mouseleave', cancelHold);
</script>
  
</body>
</html>
